<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>فحص تثبيت التطبيق</title>
<style>body{font-family:system-ui,sans-serif;padding:16px;max-width:560px;margin:auto;line-height:1.7}
.r{display:flex;gap:8px;padding:8px 10px;border-radius:10px;margin:6px 0;background:#f2f4f4}.ok{background:#e3f5ee}.no{background:#fdeaea}
button{font:inherit;padding:10px 16px;border-radius:10px;border:0;background:#12958F;color:#fff;margin-top:10px}small{color:#555;display:block}</style></head>
<body><h1>فحص تثبيت التطبيق</h1><div id="out"></div><div id="act"></div>
<script>
var out=document.getElementById('out');
function row(ok,t,why){var d=document.createElement('div');d.className='r '+(ok?'ok':'no');d.innerHTML='<b>'+(ok?'✔':'✘')+'</b><div>'+t+(why&&!ok?'<small>'+why+'</small>':'')+'</div>';out.appendChild(d);}
function get(u){return fetch(u,{cache:'no-store'}).then(function(r){return r.text().then(function(t){return {ok:r.ok,ct:r.headers.get('content-type')||'',t:t,s:r.status};});});}
var ua=navigator.userAgent;
if(/iPhone|iPad/.test(ua)) row(true,'آيفون: التثبيت يدوي من Safari فقط — زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».');
row(location.protocol==='https:'||location.hostname==='localhost','الرابط يبدأ بـ https','التثبيت يتطلب https.');
get('manifest.webmanifest').then(function(r){
  var m=null; try{m=JSON.parse(r.t);}catch(e){}
  row(r.ok&&!!m,'ملف manifest.webmanifest موجود وصحيح','الرابط يرجع '+r.s+(m?'':' ولا يحتوي JSON (غالباً يُحوَّل إلى index.html أو لم يُرفع الملف).'));
  if(!m) return;
  row(!!(m.name&&m.start_url&&m.display),'الاسم ونقطة البداية ونمط العرض معرّفة');
  var ic=(m.icons||[]).filter(function(i){return /192x192|512x512/.test(i.sizes);});
  row(ic.length>=2,'أيقونات 192 و512 مذكورة');
  (m.icons||[]).slice(0,3).forEach(function(i){ fetch(i.src,{cache:'no-store'}).then(function(x){ row(x.ok&&/image/.test(x.headers.get('content-type')||''),'الأيقونة '+i.src+' تُحمَّل','لم تُرفع أو تُحوَّل إلى صفحة. الرمز: '+x.status); }); });
});
get('sw.js').then(function(r){ row(r.ok&&/javascript/.test(r.ct),'ملف sw.js موجود','الرابط يرجع '+r.s+' ونوعه '+r.ct+' — يجب أن يكون JavaScript.'); });
get('index.html').then(function(r){ row(/rel="manifest"/.test(r.t),'الصفحة الرئيسية تشير إلى manifest','هذا ليس الملف المحدَّث من الحزمة.'); });
if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){ row(rs.length>0,'الـ service worker مسجَّل','افتح الصفحة الرئيسية مرة واحدة ثم أعد هذا الفحص.'); });
else row(false,'المتصفح لا يدعم service worker','جرّب Chrome.');
row(!matchMedia('(display-mode: standalone)').matches,'التطبيق غير مثبَّت حالياً','إن كان مثبَّتاً فلن يُعرض التثبيت مرة أخرى.');
var dp=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;row(true,'المتصفح جاهز للتثبيت');
  var b=document.createElement('button');b.textContent='تثبيت التطبيق الآن';b.onclick=function(){dp.prompt();};document.getElementById('act').appendChild(b);});
setTimeout(function(){ if(!dp) row(false,'المتصفح لم يعرض خيار التثبيت بعد','إن كانت كل النقاط أعلاه ✔ فافتح القائمة ⋮ في Chrome واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».'); },4000);
</script></body></html>
