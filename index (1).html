*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html.lock body{overflow:hidden}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

function derive(){

  S.payments.forEach(function(p){payBy[p.enrollmentId]=(payBy[p.enrollmentId]||0)+num(p.amount);});
  var tMap={},pg={},att={},tatt={};
  S.teachers.forEach(function(t){tMap[t.id]=t;});
  S.prog.forEach(function(p){pg[p.id]=p;});
  S.attendance.forEach(function(a){if(a.marks&&Object.keys(a.marks).length)att[a.id]=a.marks;});
  S.tattendance.forEach(function(a){if(a.marks&&Object.keys(a.marks).length)tatt[a.id]=a.marks;});
  D={sMap:sMap,eMap:eMap,feeBy:feeBy,payBy:payBy,tMap:tMap,pg:pg,att:att,tatt:tatt,classDates:Object.keys(att).sort()};

var Data={
  db:null,
  local:{settings:{}},
  loadLocal:function(){try{var r=localStorage.getItem('sms.v1');if(r){var o=JSON.parse(r);COLS.concat(['settings']).forEach(function(c){if(o[c])Data.local[c]=o[c];});}}catch(e){}},
  saveLocal:function(){try{localStorage.setItem('sms.v1',JSON.stringify(Data.local));}catch(e){}},
  pull:function(){
    COLS.forEach(function(c){S[c]=Object.keys(Data.local[c]).map(function(id){return Object.assign({id:id},Data.local[c][id]);});});
    S.settings=Object.assign({},DEF,Data.local.settings.main||{});
  },
  put:function(col,id,data){
    var d=Object.assign({},data);delete d.id;
    if(Data.db)return Data.db.collection(col).doc(id).set(d);
    Data.local[col][id]=d;Data.saveLocal();Data.pull();refresh();return Promise.resolve();
  },
  del:function(col,id){
    if(Data.db)return Data.db.collection(col).doc(id).delete();
    delete Data.local[col][id];Data.saveLocal();Data.pull();refresh();return Promise.resolve();
  },
  subscribe:function(){
    COLS.forEach(function(c){
      Data.db.collection(c).onSnapshot(function(snap){
        S[c]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
        S.loaded[c]=true;refresh();
      },dbError);
    });
    Data.db.doc('settings/main').onSnapshot(function(d){
      S.settings=Object.assign({},DEF,d.exists?d.data():{});S.loaded.settings=true;refresh();
    },dbError);
  }
};
function dbError(e){S.dbErr=(e&&e.code==='revoked')?'انتهت صلاحية الوصول إلى البيانات. أعد فتح الصفحة.':'تعذّر الاتصال بقاعدة البيانات.';refresh();}

      '<div class="mb">'+body+'</div></div></div>';

function field(f,v){
  var id='f_'+f.k;var val=v&&v[f.k]!=null?v[f.k]:(f.def!=null?f.def:'');var c;
  var req=f.req?' required':'';
  if(f.t==='select'){
    c='<select id="'+id+'" name="'+f.k+'"'+req+'>'+f.o.map(function(o){var ov=Array.isArray(o)?o[0]:o,ol=Array.isArray(o)?o[1]:o;
      return '<option value="'+esc(ov)+'"'+(String(ov)===String(val)?' selected':'')+'>'+esc(ol)+'</option>';}).join('')+'</select>';
  }else if(f.t==='textarea'){
    c='<textarea id="'+id+'" name="'+f.k+'">'+esc(val)+'</textarea>';
  }else{
    c='<input id="'+id+'" name="'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(val)+'"'+req+(f.ro?' readonly':'')+
      (f.t==='number'?' min="'+(f.min!=null?f.min:0)+'"'+(f.max!=null?' max="'+f.max+'"':'')+' step="any" inputmode="decimal"':'')+(f.list?' list="dl_'+f.k+'"':'')+'>';
    if(f.list)c+='<datalist id="dl_'+f.k+'">'+f.list.map(function(x){return '<option value="'+esc(x)+'">';}).join('')+'</datalist>';
  }
  return '<div class="fld'+(f.full?' full':'')+'"><label for="'+id+'">'+esc(f.l)+(f.req?' *':'')+'</label>'+c+(f.hint?'<span class="hint" id="h_'+f.k+'">'+esc(f.hint)+'</span>':'')+'</div>';
}

  var recent=S.payments.filter(function(p){var e=D.eMap[p.enrollmentId];return e&&e.year===Y;}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:num(b.receiptNo)-num(a.receiptNo);}).slice(0,6);

function reportData(){
  var Y=curYear();var kind=S.ui.rep||'roster';var st=S.ui.rst||'',sh=S.ui.rsh||'';
  var en=S.enrollments.filter(function(e){return e.year===Y&&(!st||e.stage===st)&&(!sh||e.shift===sh);});
  var stageIdx=stageList();
  en.sort(function(a,b){return (stageIdx.indexOf(a.stage)-stageIdx.indexOf(b.stage))||(a.section<b.section?-1:a.section>b.section?1:0)||(sName(a.studentId)<sName(b.studentId)?-1:1);});
  var r={title:'',head:[],rows:[],nums:[],total:null};
  if(kind==='roster'){
    r.title='كشف الطلاب — '+Y;r.head=['الرقم','الطالب','المرحلة','القسم','الفترة','حالة التسجيل','ولي الأمر','الهاتف'];
    r.rows=en.map(function(e){var s=D.sMap[e.studentId]||{};return [s.no||'',s.name||'',e.stage,e.section,e.shift,e.status,s.guardian||'',s.guardianPhone||s.phone||''];});
  }else if(kind==='dues'){
    r.title='كشف الذمم المتبقية — '+Y;r.head=['الرقم','الطالب','المرحلة','القسم','الفترة','الرسوم','المدفوع','المتبقي'];r.nums=[5,6,7];
    var t=[0,0,0];
    en.filter(function(e){return bal(e.id)>0;}).sort(function(a,b){return bal(b.id)-bal(a.id);}).forEach(function(e){
      var s=D.sMap[e.studentId]||{};r.rows.push([s.no||'',s.name||'',e.stage,e.section,e.shift,due(e.id),paid(e.id),bal(e.id)]);t[0]+=due(e.id);t[1]+=paid(e.id);t[2]+=bal(e.id);});
    r.total=t;
  }else{
    var from=S.ui.rfrom||'',to=S.ui.rto||'';
    r.title='كشف الدفعات'+(from||to?' — '+(from||'…')+' إلى '+(to||'…'):'');r.head=['رقم السند','التاريخ','الطالب','المرحلة','الفترة','المبلغ','الطريقة'];r.nums=[5];
    var tt=0;
    S.payments.filter(function(p){var e=D.eMap[p.enrollmentId];if(!e)return false;if(st&&e.stage!==st)return false;if(sh&&e.shift!==sh)return false;if(from&&p.date<from)return false;if(to&&p.date>to)return false;return true;})
      .sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:num(a.receiptNo)-num(b.receiptNo);}).forEach(function(p){
        var e=D.eMap[p.enrollmentId];r.rows.push([p.receiptNo,p.date,sName(e.studentId),e.stage,e.shift,num(p.amount),p.method]);tt+=num(p.amount);});
    r.total=[tt];
  }
  return r;
}

function useCap(n){try{return cl&&cl.use?cl.use(n):Promise.resolve(null);}catch(e){return Promise.resolve(null);}}
function saveFile(name,data){
  return useCap('downloads').then(function(dl){
    if(!dl){try{var ty=/\.json$/.test(name)?'application/json':/\.csv$/.test(name)?'text/csv;charset=utf-8':/\.xlsx$/.test(name)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':/\.html$/.test(name)?'text/html':'application/octet-stream';var u=URL.createObjectURL(new Blob([data],{type:ty}));var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);toast('تم تنزيل الملف');}catch(e){toast('تعذّر تنزيل الملف');}return;}
    return dl.save({filename:name,data:data}).then(function(){toast('تم حفظ الملف');},function(e){if(!e||e.code!=='declined')toast('تعذّر حفظ الملف');});
  });

function pointsOf(sid,f,t){
  var R=rules(),o={att:0,rec:0,exam:0,add:0,streak:0,p:0,l:0,a:0,nRec:0,nExam:0,nAdd:0,total:0},run=0;
  D.classDates.forEach(function(d){
    if(!inR(d,f,t))return;
    var st=D.att[d][sid];
    if(st==='p'){o.p++;o.att+=num(R.present);run++;if(num(R.streakDays)>0&&run%num(R.streakDays)===0)o.streak+=num(R.streakBonus);}
    else{if(st==='l'){o.l++;o.att+=num(R.late);}else if(st==='a'){o.a++;o.att+=num(R.absent);}run=0;}
  });
  var p=D.pg[sid];
  if(p){
    (p.rec||[]).forEach(function(e){if(inR(e.d,f,t)){o.rec+=num(R[e.g]);o.nRec++;}});
    (p.exams||[]).forEach(function(e){if(inR(e.d,f,t)){o.exam+=Math.round(num(e.mark)/(num(e.max)||100)*100*num(R.examFactor));o.nExam++;}});
    (p.adds||[]).forEach(function(e){if(inR(e.d,f,t)){o.add+=num(e.points);o.nAdd++;}});
  }
  o.total=o.att+o.rec+o.exam+o.add+o.streak;
  return o;
}
function juzPages(j){return j===1?21:j===30?23:20;}
function absPage(j,p){return j===1?p:20*j-19+p;}
function absToJP(a){a=Math.max(1,Math.min(604,Math.round(num(a))||1));if(a<=21)return {juz:1,page:a};if(a>=582)return {juz:30,page:a-581};var j=Math.floor((a-2)/20)+1;return {juz:j,page:a-(20*j-19)};}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'';}
function quranLink(n){var t=safeUrl(S.settings.quranUrl)||DEF.quranUrl;return t.indexOf('{n}')>=0?t.replace('{n}',n):t.replace(/\/+$/,'')+'/'+n;}
var TN={'new':'حفظ جديد',review:'مراجعة',tilawa:'تلاوة'};
function memoOf(sid){
  var p=D.pg[sid],pages={},cnt=0,j;
  ((p&&p.rec)||[]).filter(function(e){return e.t!=='tilawa';}).slice().sort(function(a,b){return (a.ts||0)-(b.ts||0)||(a.d<b.d?-1:1);}).forEach(function(e){pages[absPage(e.juz,e.page)]=e;});
  var per={};for(j=1;j<=30;j++)per[j]=0;
  Object.keys(pages).forEach(function(k){var e=pages[k];if(e.g!=='redo'&&per[e.juz]!=null){cnt++;per[e.juz]++;}});
  var done=0;for(j=1;j<=30;j++)if(per[j]>=juzPages(j))done++;
  return {pages:pages,count:cnt,per:per,done:done,pct:Math.round(cnt/604*100)};
}
function lastOf(sid){
  var recs=((D.pg[sid]&&D.pg[sid].rec)||[]).slice().sort(function(a,b){return (a.d<b.d?-1:a.d>b.d?1:0)||((a.ts||0)-(b.ts||0))||(absPage(a.juz,a.page)-absPage(b.juz,b.page));});
  var mem=null;recs.forEach(function(e){if(e.t!=='tilawa'&&e.g!=='redo')mem=e;});
  return {read:recs[recs.length-1]||null,mem:mem};
}
function leaderRows(f,t,filt){
  var seen={},out=[];
  S.enrollments.forEach(function(e){
    if(e.year!==curYear()||e.status!=='نشط'||seen[e.studentId])return;
    if(filt&&!filt(e))return;
    var s=D.sMap[e.studentId];if(!s)return;
    seen[e.studentId]=1;
    out.push({sid:e.studentId,e:e,name:s.name,no:s.no,pt:pointsOf(e.studentId,f,t)});
  });
  out.sort(function(a,b){return b.pt.total-a.pt.total||(a.name<b.name?-1:1);});
  return out;
}
function tStats(tid){
  var p=0,l=0,a=0,x=0;
  Object.keys(D.tatt).forEach(function(d){var st=D.tatt[d][tid];if(st==='p')p++;else if(st==='l')l++;else if(st==='a')a++;else if(st==='e')x++;});
  var n=p+l+a;
  var ev=S.tevals.filter(function(e){return e.teacherId===tid;}).sort(function(a,b){return a.period<b.period?1:-1;});
  var avg=ev.length?Math.round(ev.reduce(function(s,e){return s+num(e.pct);},0)/ev.length):null;
  var stu=S.enrollments.filter(function(e){return e.teacherId===tid&&e.year===curYear()&&e.status==='نشط';}).length;
  return {p:p,l:l,a:a,x:x,rate:n?Math.round((p+0.5*l)/n*100):null,avg:avg,ev:ev,students:stu};
}
function saveProg(sid,mut){

  delete p.id;p.rec=p.rec||[];p.exams=p.exams||[];p.adds=p.adds||[];p.rash=p.rash||[];

}
function studentOpts(sid){
  var list=S.students.filter(function(s){return s.status==='مقبول'||s.id===sid;}).sort(function(a,b){return a.name<b.name?-1:1;});

}

/* ---------- تشغيل عمليات متعددة ---------- */
function runFns(fns){
  var i=0,fail=null;
  function one(){
    if(i>=fns.length||fail)return Promise.resolve();
    var f=fns[i++];
    return f().then(one,function(e){fail=e;});
  }
  var w=[];for(var k=0;k<5;k++)w.push(one());
  return Promise.all(w).then(function(){if(fail)throw fail;});
}
function runJobs(jobs){
  return runFns(jobs.map(function(j){return function(){
    return (j[0]==='attendance'||j[0]==='tattendance')?Data.mergeMarks(j[0],j[1],j[2].marks):Data.put(j[0],j[1],j[2]);
  };}));
}

  jobs.push(['studentnotes','ex_n0',{ex:true,studentId:'ex_s0',text:'ما شاء الله، تقدّم ملحوظ في الحفظ والانضباط هذا الشهر.',date:ds[16],ts:5000}]);
  jobs.push(['studentnotes','ex_n1',{ex:true,studentId:'ex_s2',text:'يحتاج إلى مراجعة الصفحات الأخيرة في البيت قبل التسميع.',date:ds[14],ts:5001}]);

function msgCfg(){
  var m=S.settings.msg||{},r=m.rules||{};
  return {paused:!!m.paused,appUrl:m.appUrl||APP_URL,tpl:Object.assign({},TPL,m.tpl||{}),
    rules:{absent:Object.assign({},RULE.absent,r.absent),dues:Object.assign({},RULE.dues,r.dues),session:Object.assign({},RULE.session,r.session)}};

function fillTpl(t,v){return String(t||'').replace(/\{([^}]+)\}/g,function(m,k){return v[k]!=null?v[k]:m;});}
function baseVars(){return {'المؤسسة':S.settings.institution,'التاريخ':today(),'العملة':S.settings.currency,'السنة':curYear(),'الرابط':msgCfg().appUrl};}
function nowStr(){var d=new Date();return today()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function addMin(date,time,m){
  var p=String(time||'00:00').split(':'),d=new Date(date+'T'+pad(num(p[0]))+':'+pad(num(p[1]))+':00');
  d.setMinutes(d.getMinutes()+m);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function phoneOfS(s){return s.guardianPhone||s.phone||'';}
function audience(aud,stage){
  var out=[];
  if(aud==='teachers')S.teachers.filter(function(t){return t.status!=='موقوف';}).forEach(function(t){out.push({id:t.id,name:t.name,phone:t.phone});});
  else if(aud==='supervisors')S.supervisors.filter(function(t){return t.status!=='موقوف';}).forEach(function(t){out.push({id:t.id,name:t.name,phone:t.phone});});
  else{
    var Y=curYear();
    S.students.filter(function(s){return s.status==='مقبول';}).forEach(function(s){
      if(stage){var e=S.enrollments.filter(function(x){return x.studentId===s.id&&x.year===Y&&x.status==='نشط';})[0];if(!e||e.stage!==stage)return;}
      out.push({id:s.id,name:s.name,phone:phoneOfS(s)});
    });
  }
  return out;
}
function msgQueue(){
  var cfg=msgCfg(),td=today(),mon=td.slice(0,7),items=[],bv=baseVars();
  var sent={};S.msglog.forEach(function(l){sent[l.id]=1;});
  function add(key,kind,who,name,phone,text,dueAt){items.push({key:key,kind:kind,who:who,name:name,phone:phone,text:text,dueAt:dueAt,sent:!!sent[key]});}
  if(cfg.paused)return items;
  var Y=curYear();
  if(cfg.rules.absent.on){
    var marks=D.att[td]||{};
    Object.keys(marks).forEach(function(sid){
      if(marks[sid]!=='a')return;var s=D.sMap[sid];if(!s)return;
      add('absent_'+td+'_'+sid,'غياب','ولي أمر',s.name,phoneOfS(s),fillTpl(cfg.tpl.absent,Object.assign({},bv,{'الاسم':s.name})),td+' '+cfg.rules.absent.time);
    });
  }
  if(cfg.rules.dues.on){
    S.enrollments.filter(function(e){return e.year===Y&&e.status==='نشط'&&bal(e.id)>=num(cfg.rules.dues.minBal||1);}).forEach(function(e){
      var s=D.sMap[e.studentId];if(!s)return;
      add('dues_'+mon+'_'+e.id,'رسوم','ولي أمر',s.name,phoneOfS(s),fillTpl(cfg.tpl.dues,Object.assign({},bv,{'الاسم':s.name,'المتبقي':fmt(bal(e.id))})),td+' '+cfg.rules.dues.time);
    });
  }
  if(cfg.rules.session.on){
    S.sessions.filter(function(x){return x.date===td&&x.status!=='ملغاة'&&x.teacherId;}).forEach(function(x){
      var t=D.tMap[x.teacherId];if(!t)return;
      add('session_'+x.id+'_'+t.id,'حصة','معلم',t.name,t.phone,fillTpl(cfg.tpl.session,Object.assign({},bv,{'الاسم':t.name,'الوقت':x.time||'','العنوان':x.title||''})),addMin(td,x.time||'08:00',-num(cfg.rules.session.lead)));
    });
  }
  S.msgsched.forEach(function(sc){
    if(!sc.when)return;var dueAt=String(sc.when).replace('T',' ');
    audience(sc.aud,sc.stage).forEach(function(r){
      add('sch_'+sc.id+'_'+r.id,'مجدولة',sc.aud==='students'?'ولي أمر':sc.aud==='teachers'?'معلم':'مشرف',r.name,r.phone,fillTpl(sc.text,Object.assign({},bv,{'الاسم':r.name})),dueAt);
    });
  });
  return items;
}

function accPeople(tab){
  var q=(S.ui.aq||'').trim().toLowerCase(),out=[];
  var src=tab==='sup'?['supervisors','مشرف',S.supervisors]:tab==='teach'?['teachers','معلم',S.teachers]:['students','ولي أمر',S.students.filter(function(s){return s.status==='مقبول';})];
  src[2].forEach(function(p){
    var phone=tab==='stud'?phoneOfS(p):p.phone;
    if(q&&[p.name,phone].every(function(x){return String(x||'').toLowerCase().indexOf(q)<0;}))return;
    out.push({col:src[0],type:src[1],doc:p,name:p.name,phone:phone,level:p.access||LV_DEF[tab==='teach'?'teachers':tab==='sup'?'sup':'students']});
  });
  return out.sort(function(a,b){return a.name<b.name?-1:1;});
}
function accText(p){
  var cfg=msgCfg();
  return fillTpl(cfg.tpl.account,Object.assign({},baseVars(),{'الاسم':p.name,'الصلاحية':LV[p.level],'الوصف':LV_HELP[p.level]}));
}

/* ---------- تصدير Excel ---------- */
function xlsxBook(){
  var Y=curYear(),W2=XLSX.utils;
  var wb=W2.book_new();wb.Workbook={Views:[{RTL:true}]};
  function sheet(name,head,rows){
    var ws=W2.aoa_to_sheet([head].concat(rows));ws['!cols']=head.map(function(h){return {wch:Math.max(14,String(h).length+4)};});
    W2.book_append_sheet(wb,ws,name);
  }
  sheet('الطلاب',['الرقم','الاسم','حالة القبول','الجنس','تاريخ الميلاد','ولي الأمر','هاتف ولي الأمر','هاتف الطالب','الرقم الوطني','العنوان','ملاحظات'],
    S.students.slice().sort(function(a,b){return num(a.no)-num(b.no);}).map(function(s){return [num(s.no),s.name,s.status,s.gender||'',s.birth||'',s.guardian||'',s.guardianPhone||'',s.phone||'',s.nationalId||'',s.address||'',s.notes||''];}));
  sheet('التسجيلات',['السنة','الرقم','الطالب','المرحلة','القسم','الفترة','الحالة','المعلم','الرسوم','المدفوع','المتبقي'],
    S.enrollments.slice().sort(function(a,b){return a.year<b.year?1:-1;}).map(function(e){return [e.year,num(sNo(e.studentId)),sName(e.studentId),e.stage,e.section,e.shift,e.status,e.teacherId?tName(e.teacherId):'',due(e.id),paid(e.id),bal(e.id)];}));
  sheet('الرسوم',['السنة','الطالب','البند','المبلغ','تاريخ الاستحقاق'],
    S.fees.map(function(f){var e=D.eMap[f.enrollmentId];return [e?e.year:'',e?sName(e.studentId):'',f.title,num(f.amount),f.dueDate||''];}));
  sheet('الدفعات',['رقم السند','التاريخ','الطالب','السنة','المبلغ','الطريقة','ملاحظة'],
    S.payments.slice().sort(function(a,b){return num(a.receiptNo)-num(b.receiptNo);}).map(function(p){var e=D.eMap[p.enrollmentId];return [num(p.receiptNo),p.date,e?sName(e.studentId):'',e?e.year:'',num(p.amount),p.method,p.note||''];}));
  sheet('المعلمون',['الاسم','الهاتف','الحلقة / التخصص','الحالة'],S.teachers.map(function(t){return [t.name,t.phone||'',t.specialty||'',t.status||'نشط'];}));
  sheet('المشرفون',['الاسم','الهاتف','المستوى','المركز / المنطقة','الحالة'],S.supervisors.map(function(t){return [t.name,t.phone||'',t.level||'',t.area||'',t.status||'نشط'];}));
  sheet('الحصص',['التاريخ','الوقت','العنوان','المعلم','المرحلة','القسم','الفترة','المحتوى','الحالة'],
    S.sessions.slice().sort(function(a,b){return a.date<b.date?-1:1;}).map(function(x){return [x.date,x.time||'',x.title,x.teacherId?tName(x.teacherId):'',x.stage||'',x.section||'',x.shift||'',x.content||'',x.status||''];}));
  var ar=[];Object.keys(D.att).sort().forEach(function(d){Object.keys(D.att[d]).forEach(function(sid){ar.push([d,sName(sid),ATT[D.att[d][sid]]||D.att[d][sid]]);});});
  sheet('حضور الطلاب',['التاريخ','الطالب','الحالة'],ar);
  var tr=[];Object.keys(D.tatt).sort().forEach(function(d){Object.keys(D.tatt[d]).forEach(function(tid){tr.push([d,tName(tid),TATT[D.tatt[d][tid]]||D.tatt[d][tid]]);});});
  sheet('حضور المعلمين',['التاريخ','المعلم','الحالة'],tr);
  sheet('النقاط',['الطالب','نقاط الحضور','مرات التأخر','مرات الغياب','نقاط التسميع','نقاط الاختبارات','إضافات ومكافآت','المجموع'],
    S.students.map(function(s){var p=pointsOf(s.id);return [s.name,p.att,p.l,p.a,p.rec,p.exam,p.add+p.streak,p.total];}));
  return wb;
}
function exportXlsx(){
  if(typeof XLSX==='undefined'){toast('تعذّر تحميل مكتبة Excel. تحقق من الاتصال وأعد المحاولة.');return;}
  try{
    derive();
    var out=XLSX.write(xlsxBook(),{type:'array',bookType:'xlsx'});
    saveFile('بيانات-'+fname(S.settings.institution)+'-'+today()+'.xlsx',out);
  }catch(e){toast('تعذّر إنشاء ملف Excel.');}
}
function exportReportXlsx(){
  if(typeof XLSX==='undefined'){toast('تعذّر تحميل مكتبة Excel. تحقق من الاتصال وأعد المحاولة.');return;}
  var r=reportData();if(!r.rows.length){toast('لا توجد بيانات للتصدير.');return;}
  var rows=r.rows.slice();
  if(r.total){rows.push(r.head.map(function(h,i){if(i===0)return 'المجموع';var k=r.nums.indexOf(i);return k>=0?r.total[k]:'';}));}
  var wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  var ws=XLSX.utils.aoa_to_sheet([r.head].concat(rows));ws['!cols']=r.head.map(function(){return {wch:18};});
  XLSX.utils.book_append_sheet(wb,ws,'التقرير');
  saveFile(fname(r.title)+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}));
}

function xlsxOne(name,sheetName,head,rows){
  if(typeof XLSX==='undefined'){toast('تعذّر تحميل مكتبة Excel. تحقق من الاتصال وأعد المحاولة.');return;}
  if(!rows.length){toast('لا توجد بيانات للتصدير.');return;}
  try{
    var wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
    var ws=XLSX.utils.aoa_to_sheet([head].concat(rows));ws['!cols']=head.map(function(h){return {wch:Math.max(14,String(h).length+4)};});
    XLSX.utils.book_append_sheet(wb,ws,sheetName);
    saveFile(name+'-'+today()+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}));
  }catch(e){toast('تعذّر إنشاء ملف Excel.');}
}
ACT.exportStudentsXlsx=function(){

    S.students.slice().sort(function(a,b){return num(a.no)-num(b.no);}).map(function(s){

};

function sbAdapter(cl){
  var cache={},subs={},loaded=false;
  function notify(c){(subs[c]||[]).forEach(function(f){f();});}
  function snap(c){var o=cache[c]||{};return {docs:Object.keys(o).map(function(id){return {id:id,data:function(){return o[id];}};})};}
  function fail(e){var x=new Error((e&&e.message)||'error');x.code=(e&&e.code==='42501')?'invalid_argument':'sb';return x;}
  function load(){
    var all={},from=0;
    function page(){
      return cl.from('docs').select('col,id,data').order('col').order('id').range(from,from+999).then(function(r){
        if(r.error)throw fail(r.error);
        r.data.forEach(function(x){(all[x.col]=all[x.col]||{})[x.id]=x.data;});
        if(r.data.length===1000){from+=1000;return page();}
      });
    }
    return page().then(function(){cache=all;loaded=true;COLS.concat(['settings']).forEach(notify);});
  }
  function listen(){
    cl.channel('docs-sync').on('postgres_changes',{event:'*',schema:'public',table:'docs'},function(p){
      var n=(p.new&&p.new.col)?p.new:p.old;if(!n||!n.col)return;
      if(p.eventType==='DELETE'){if(cache[n.col])delete cache[n.col][n.id];}
      else{(cache[n.col]=cache[n.col]||{})[n.id]=p.new.data;}
      notify(n.col);
    }).subscribe(function(st){SB.rt=(st==='SUBSCRIBED');});
    setInterval(function(){if(!SB.rt&&!document.hidden)load().catch(function(){});},45000);
  }
  function put(c,id,d){
    return cl.from('docs').upsert({col:c,id:id,data:d,updated_at:new Date().toISOString(),updated_by:SB.user&&SB.user.id}).then(function(r){
      if(r.error)throw fail(r.error);(cache[c]=cache[c]||{})[id]=d;notify(c);
    });
  }
  function del(c,id){
    return cl.from('docs').delete().eq('col',c).eq('id',id).then(function(r){
      if(r.error)throw fail(r.error);if(cache[c])delete cache[c][id];notify(c);
    });
  }
  return {
    collection:function(c){return {
      doc:function(id){return {set:function(d){return put(c,id,d);},delete:function(){return del(c,id);}};},
      onSnapshot:function(cb){(subs[c]=subs[c]||[]).push(function(){cb(snap(c));});if(loaded)cb(snap(c));}
    };},
    doc:function(path){var p=path.split('/');return {onSnapshot:function(cb){
      function f(){var o=(cache[p[0]]||{})[p[1]];cb({exists:!!o,data:function(){return o;}});}
      (subs[p[0]]=subs[p[0]]||[]).push(f);if(loaded)f();
    }};},
    start:function(){return load().then(listen);}
  };
}
