/* kuran */
function juzPages(j){ return j===1 ? 21 : j===30 ? 23 : 20; }
function absPage(j, p){ return j===1 ? p : 20*j - 19 + p; }
function absToJP(a){
  a = Math.max(1, Math.min(604, Math.round(num(a)) || 1));
  if(a <= 21) return {juz:1, page:a};
  if(a >= 582) return {juz:30, page:a-581};
  var j = Math.floor((a-2)/20) + 1;
  return {juz:j, page:a - (20*j - 19)};
}
function quranLink(n){
  var t2 = safeUrl(S.settings.quranUrl) || DEF.quranUrl;
  return t2.indexOf('{n}') >= 0 ? t2.replace('{n}', n) : t2.replace(/\/+$/, '') + '/' + n;
}
function absToAyah(page){ return Math.max(1, Math.min(6236, Math.round(page*6236/604))); }

/* progression */
function memoOf(sid){
  var p = D.pg[sid], pages = {}, cnt = 0, j;
  ((p&&p.rec)||[])
    .filter(function(e){ return e.t !== 'tilawa'; })
    .slice()
    .sort(function(a,b){ return (a.ts||0)-(b.ts||0) || (a.d<b.d?-1:1); })
    .forEach(function(e){ pages[absPage(e.juz, e.page)] = e; });
  var per = {};
  for(j=1; j<=30; j++) per[j] = 0;
  Object.keys(pages).forEach(function(k){
    var e = pages[k];
    if(e.g !== 'redo' && per[e.juz] != null){ cnt++; per[e.juz]++; }
  });
  var done = 0;
  for(j=1; j<=30; j++) if(per[j] >= juzPages(j)) done++;
  return {pages:pages, count:cnt, per:per, done:done, pct:Math.round(cnt/604*100)};
}
function lastOf(sid){
  var recs = ((D.pg[sid]&&D.pg[sid].rec)||[]).slice().sort(function(a,b){
    return (a.d<b.d?-1:a.d>b.d?1:0) || ((a.ts||0)-(b.ts||0)) || (absPage(a.juz,a.page)-absPage(b.juz,b.page));
  });
  var mem = null;
  recs.forEach(function(e){ if(e.t !== 'tilawa' && e.g !== 'redo') mem = e; });
  return {read:recs[recs.length-1]||null, mem:mem};
}
function pointsOf(sid, f, t2){
  var R = rules();
  var o = {att:0,rec:0,exam:0,add:0,streak:0,p:0,l:0,a:0,nRec:0,nExam:0,nAdd:0,total:0};
  var run = 0;
  D.classDates.forEach(function(d){
    if(!inR(d, f, t2)) return;
    var st = D.att[d][sid];
    if(st === 'p'){
      o.p++; o.att += num(R.present); run++;
      if(num(R.streakDays) > 0 && run % num(R.streakDays) === 0) o.streak += num(R.streakBonus);
    } else {
      if(st === 'l'){ o.l++; o.att += num(R.late); }
      else if(st === 'a'){ o.a++; o.att += num(R.absent); }
      run = 0;
    }
  });
  var p = D.pg[sid];
  if(p){
    (p.rec||[]).forEach(function(e){ if(inR(e.d, f, t2)){ o.rec += num(R[e.g]); o.nRec++; } });
    (p.exams||[]).forEach(function(e){ if(inR(e.d, f, t2)){ o.exam += Math.round(num(e.mark)/(num(e.max)||100)*100*num(R.examFactor)); o.nExam++; } });
    (p.adds||[]).forEach(function(e){ if(inR(e.d, f, t2)){ o.add += num(e.points); o.nAdd++; } });
  }
  o.total = o.att + o.rec + o.exam + o.add + o.streak;
  return o;
}
function leaderRows(f, t2, filt){
  var seen = {}, out = [];
  S.enrollments.forEach(function(e){
    if(e.year !== curYear() || e.status !== 'نشط' || seen[e.studentId]) return;
    if(filt && !filt(e)) return;
    var s = D.sMap[e.studentId];
    if(!s) return;
    seen[e.studentId] = 1;
    out.push({sid:e.studentId, e:e, name:s.name, no:s.no, pt:pointsOf(e.studentId, f, t2)});
  });
  out.sort(function(a,b){ return b.pt.total - a.pt.total || (a.name<b.name?-1:1); });
  return out;
}
function saveProg(studentId, mutator){
  var p = clone(D.pg[studentId]||{});
  delete p.id;
  p.rec = p.rec||[]; p.exams = p.exams||[]; p.adds = p.adds||[]; p.rash = p.rash||[];
  mutator(p);
  return Data.put('prog', studentId, p);
}

/* rashidi */
function rashLink(p){
  var u = safeUrl(S.settings.rashidiUrl);
  return u ? (u.indexOf('#')<0 ? u+'#page='+p : u) : '';
}
function rashOf(sid){
  var p = D.pg[sid];
  var evs = ((p&&p.rash)||[]).slice().sort(function(a,b){
    return (a.d<b.d?-1:a.d>b.d?1:0) || ((a.ts||0)-(b.ts||0));
  });
  var pages = {};
  evs.forEach(function(e){
    var n = num(e.page) || num(e.item);
    if(n>=1 && n<=RASHIDI_PAGES) pages[n] = e;
  });
  var done = 0, reached = 0;
  for(var i=1; i<=RASHIDI_PAGES; i++){
    if(pages[i] && pages[i].g !== 'redo'){ done++; reached = i; }
  }
  return {
    evs:evs, pages:pages, done:done, reached:reached,
    pct:Math.round(done/RASHIDI_PAGES*100),
    completed:done >= RASHIDI_PAGES,
    last:evs[evs.length-1] || null
  };
}
function rashExamStatus(sid){
  var all = S.rashidiExams.filter(function(e){ return e.studentId===sid; });
  var trials = all.filter(function(e){ return e.type==='trial'; })
    .sort(function(a,b){ return (b.date||'') < (a.date||'') ? -1 : 1; });
  var finals = all.filter(function(e){ return e.type==='final'; })
    .sort(function(a,b){ return (b.date||'') < (a.date||'') ? -1 : 1; });
  function best(arr){
    if(!arr.length) return null;
    return arr.reduce(function(b, t2){
      var tp = num(t2.score)/(num(t2.max)||100);
      var bp = num(b.score)/(num(b.max)||100);
      return tp > bp ? t2 : b;
    }, arr[0]);
  }
  var bestFinal = best(finals);
  var finalPct = bestFinal ? Math.round(num(bestFinal.score)/(num(bestFinal.max)||100)*100) : null;
  return {
    trials:trials, finals:finals,
    bestTrial:best(trials), bestFinal:bestFinal,
    finalPct:finalPct,
    passed: finalPct != null && finalPct >= 60
  };
}

/* tStats + effectiveTeacherId */
function tStats(tid){
  var Y = curYear();
  var enrolls = S.enrollments.filter(function(e){
    return e.teacherId === tid && e.year === Y && e.status === 'نشط';
  });
  var uniqS = {};
  enrolls.forEach(function(e){ uniqS[e.studentId] = 1; });
  var p=0,l=0,a=0,x=0;
  Object.keys(D.tatt).forEach(function(d){
    var st = D.tatt[d][tid];
    if(st==='p') p++;
    else if(st==='l') l++;
    else if(st==='a') a++;
    else if(st==='e') x++;
  });
  var n = p+l+a;
  var ev = S.tevals.filter(function(e){ return e.teacherId===tid; })
    .sort(function(a,b){ return a.period<b.period?1:-1; });
  var avg = ev.length ? Math.round(ev.reduce(function(s,e){ return s+num(e.pct); }, 0)/ev.length) : null;
  return {p:p,l:l,a:a,x:x, rate:n?Math.round((p+0.5*l)/n*100):null, avg:avg, ev:ev, students:Object.keys(uniqS).length, enrolls:enrolls.length};
}
function effectiveTeacherId(){
  var role = myRole();
  var prof = S.profile || {};
  if(role === 'teacher') return prof.teacher_id || '';
  if(role === 'cs'){
    var hid = prof.teaching_halaqa_id || '';
    if(!hid) return '';
    var ha = S.halaqat.find(function(h){ return h.id===hid; });
    if(ha && ha.teacherId) return ha.teacherId;
    return 'cs_'+(prof.id||'me');
  }
  return '';
}
function canTeach(){ return !!effectiveTeacherId(); }
function myTeacherId(){
  if(myRole() !== 'teacher') return '';
  return (S.profile && S.profile.teacher_id) || (S.user && S.user.teacher_id) || '';
}
function myCenterId(){
  if(myRole() === 'cs') return (S.profile && S.profile.center_id) || '';
  if(myRole() === 'teacher'){
    var tid = myTeacherId();
    var t2 = tid ? D.tMap[tid] : null;
    return t2 ? t2.centerId || '' : '';
  }
  return '';
}

/* nextLessonFor + bookProgress */
function nextLessonFor(teacherId, bookId){
  var lessons = S.lessons.filter(function(l){ return l.bookId===bookId; })
    .sort(function(a,b){ return num(a.order) - num(b.order); });
  if(!lessons.length) return null;
  var last = S.sessions.filter(function(x){
    return x.teacherId===teacherId && x.bookId===bookId && x.status==='تمت';
  }).sort(function(a,b){ return a.date < b.date ? 1 : -1; })[0];
  if(!last) return lessons[0];
  var lastOrder = num(last.lessonOrder);
  var next = lessons.find(function(l){ return num(l.order) > lastOrder; });
  return next || null;
}
function bookProgress(teacherId, bookId){
  var lessons = S.lessons.filter(function(l){ return l.bookId===bookId; });
  var total = lessons.length;
  if(!total) return {total:0, done:0, pct:0, current:null, finished:false};
  var last = S.sessions.filter(function(x){
    return x.teacherId===teacherId && x.bookId===bookId && x.status==='تمت';
  }).sort(function(a,b){ return a.date < b.date ? 1 : -1; })[0];
  var lastOrder = last ? num(last.lessonOrder) : 0;
  var done = lessons.filter(function(l){ return num(l.order) <= lastOrder; }).length;
  var next = nextLessonFor(teacherId, bookId);
  return {total:total, done:done, pct:Math.round(done/total*100), current:next, finished:!next && done>0};
}

/* computeRegionStats + computeCenterStats + supStats */
function computeRegionStats(rid){
  var Y = curYear();
  var centers = S.centers.filter(function(c){ return c.regionId===rid; });
  var cids = centers.map(function(c){ return c.id; });
  var ens = S.enrollments.filter(function(e){
    return e.year===Y && e.status==='نشط' && cids.indexOf(e.centerId)>=0;
  });
  var tids = [];
  ens.forEach(function(e){ if(e.teacherId && tids.indexOf(e.teacherId)<0) tids.push(e.teacherId); });
  var us = {};
  ens.forEach(function(e){ us[e.studentId] = 1; });
  return {
    centers:centers.length,
    halaqat:S.halaqat.filter(function(h){ return cids.indexOf(h.centerId)>=0; }).length,
    teachers:tids.length,
    students:Object.keys(us).length
  };
}
function computeCenterStats(cid){
  var Y = curYear();
  var ens = S.enrollments.filter(function(e){
    return e.year===Y && e.status==='نشط' && e.centerId===cid;
  });
  var tids = [];
  ens.forEach(function(e){ if(e.teacherId && tids.indexOf(e.teacherId)<0) tids.push(e.teacherId); });
  var us = {};
  ens.forEach(function(e){ us[e.studentId] = 1; });
  return {
    halaqat:S.halaqat.filter(function(h){ return h.centerId===cid; }).length,
    teachers:tids.length,
    students:Object.keys(us).length
  };
}
function supStats(sid){
  var centers = S.centers.filter(function(c){ return c.supervisorId===sid; });
  var regions = S.regions.filter(function(r){ return r.rmId===sid; });
  return {centers:centers.length, regions:regions.length};
}

function computeBadges(sid){
  var badges = [];
  var mm = memoOf(sid);
  var pt = pointsOf(sid, '', '');
  var ro = rashOf(sid);
  if(mm.done >= 1) badges.push({title:'أتمّ جزءاً', desc:mm.done+' جزءاً', icon:'quran'});
  if(mm.done >= 5) badges.push({title:'حافظ متميز', desc:'5 أجزاء', icon:'quran'});
  if(mm.done >= 10) badges.push({title:'حافظ متقدم', desc:'10 أجزاء', icon:'quran'});
  if(mm.done >= 20) badges.push({title:'حافظ معظم القرآن', desc:'20 جزءاً', icon:'quran'});
  if(mm.done >= 30) badges.push({title:'ختم القرآن', desc:'30 جزءاً', icon:'cert', gold:true});
  if(pt.p >= 30) badges.push({title:'مواصل', desc:pt.p+' حضور', icon:'att'});
  if(pt.p >= 100) badges.push({title:'منتظم', desc:pt.p+' حضور', icon:'att'});
  if(pt.total >= 100) badges.push({title:'100 نقطة', desc:'إنجاز', icon:'star'});
  if(pt.total >= 500) badges.push({title:'500 نقطة', desc:'إنجاز متميز', icon:'star', gold:true});
  if(pt.total >= 1000) badges.push({title:'1000 نقطة', desc:'نجم', icon:'star', gold:true});
  if(pt.nRec >= 50) badges.push({title:'مجتهد', desc:pt.nRec+' تسميعة', icon:'quran'});
  if(pt.nRec >= 100) badges.push({title:'مثابر', desc:pt.nRec+' تسميعة', icon:'quran'});
  if(pt.nRec >= 300) badges.push({title:'تسميع وفير', desc:pt.nRec+' تسميعة', icon:'quran', gold:true});
  if(ro.done >= RLESSONS) badges.push({title:'ختم الرشيدي', desc:'إتمام الكتاب', icon:'quranbook', gold:true});
  if(pt.streak >= 15) badges.push({title:'سلسلة الحضور', desc:'حضور متواصل', icon:'att'});
  return badges;
}

/* waLink + fillTpl + baseVars + addMin + phoneOfS */
function waLink(phone, text){
  var d = String(phone||'').replace(/\D/g, '');
  if(!d) return '';
  if(d.indexOf('00') === 0) d = d.slice(2);
  else if(d.charAt(0) === '0') d = (S.settings.countryCode||'963') + d.slice(1);
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(text);
}
function fillTpl(t2, v){
  return String(t2||'').replace(/\{([^}]+)\}/g, function(m, k){
    return v[k] != null ? String(v[k]) : m;
  });
}
function baseVars(){
  return {
    'المؤسسة':S.settings.institution,
    'التاريخ':today(),
    'العملة':S.settings.currency,
    'السنة':curYear(),
    'الرابط':(S.settings.msg && S.settings.msg.appUrl) || APP_URL

function addMin(date, time, m){
  var p = String(time||'00:00').split(':');
  var d = new Date(date + 'T' + pad(num(p[0])) + ':' + pad(num(p[1])) + ':00');
  d.setMinutes(d.getMinutes() + m);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+
         pad(d.getHours())+':'+pad(d.getMinutes());
}

/* hijri */
var HIJRI_MONTHS = ['محرّم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
var GREG_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var WEEKDAYS_AR = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

function toHijri(y, m, d){
  var a = Math.floor((14-m)/12);
  var y2 = y + 4800 - a;
  var m2 = m + 12*a - 3;
  var jdn = d + Math.floor((153*m2 + 2)/5) + 365*y2 + Math.floor(y2/4) - Math.floor(y2/100) + Math.floor(y2/400) - 32045;
  var l0 = jdn - 1948440 + 10632;
  var n = Math.floor((l0 - 1)/10631);
  var l1 = l0 - 10631*n + 354;
  var j = Math.floor((10985-l1)/5316)*Math.floor((50*l1)/17719) +
          Math.floor(l1/5670)*Math.floor((43*l1)/15238);
  var l2 = l1 - Math.floor((30-j)/15)*Math.floor((17719*j)/50) -
           Math.floor(j/16)*Math.floor((15238*j)/43) + 29;
  var hm = Math.floor((24*l2)/709);
  var hd = l2 - Math.floor((709*hm)/24);
  var hy = 30*n + j - 30;
  return {y:hy, m:hm, d:hd};
}
function hijriFromIso(iso){
  var p = String(iso||'').split('-');
  if(p.length < 3) return null;
  try { return toHijri(num(p[0]), num(p[1]), num(p[2])); } catch(e){ return null; }
}
function gregDate(iso){
  if(!iso) return '';
  var d = String(iso).split('-');
  if(d.length < 3) return iso;
  var idx = new Date(num(d[0]), num(d[1])-1, num(d[2])).getDay();
  return WEEKDAYS_AR[idx] + ' ' + num(d[2]) + ' ' + GREG_MONTHS[num(d[1])-1] + ' ' + d[0];
}
function updateHijriBadge(){
  var el = $('#hijriBadge');
  if(!el){
    var top = document.querySelector('.top');
    if(!top) return;
    el = document.createElement('span');
    el.id = 'hijriBadge';
    el.className = 'chip';
    el.style.fontSize = '11px';
    el.style.display = 'none';
    top.appendChild(el);
  }
  var h = hijriFromIso(today());
  if(!h){ el.style.display = 'none'; return; }
  el.style.display = '';
  el.textContent = h.d + ' ' + HIJRI_MONTHS[h.m-1] + ' ' + h.y + 'هـ';
  el.title = gregDate(today());
}
function weekStart(iso){
  var d = new Date(iso||today());
  var day = d.getDay();
  var diff = day===6 ? 0 : (day+1)%7;
  d.setDate(d.getDate() - diff);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function addDays(iso, n){
  var d = new Date(iso);
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}

function vDashManager(Y, act){
  var h = vh(t('nav.dash'), 'السنة '+esc(Y)+' · '+roleName(myRole()),
    W('<button type="button" class="btn" data-act="newStudent">'+ico('plus')+'طالب</button>'+
      '<button type="button" class="btn pri" data-act="newSession">'+ico('plus')+'حصة</button>'));

  var morning = act.filter(function(e){ return e.shift==='صباحي'; }).length;
  var evening = act.filter(function(e){ return e.shift==='مسائي'; }).length;
  var accepted = S.students.filter(function(s){ return s.status==='مقبول'; }).length;
  var hideFin = !!S.settings.hideFinance;
  var dueT=0, paidT=0, remT=0;
  if(!hideFin){
    act.forEach(function(e){ dueT += due(e.id); paidT += paid(e.id); remT += Math.max(0, bal(e.id)); });
  }

  h += '<section class="kpis">'+
    '<div class="kpi"><small>إجمالي الطلاب</small><b>'+fmt(S.students.length)+'</b><i>في السجل</i></div>'+
    '<div class="kpi"><small>المقبولون</small><b>'+fmt(accepted)+'</b><i>قيد القبول: '+fmt(S.students.length-accepted)+'</i></div>'+
    '<div class="kpi"><small>الطلاب النشطون</small><b>'+fmt(act.length)+'</b><i>'+esc(Y)+'</i></div>'+
    '<div class="kpi"><small>صباحي / مسائي</small><b>'+morning+' / '+evening+'</b><i>توزيع</i></div>'+
    (hideFin ? '' :
      '<div class="kpi fin"><small>الرسوم</small><b>'+fmt(dueT)+'</b><i>'+esc(S.settings.currency)+'</i></div>'+
      '<div class="kpi fin"><small>المحصّل</small><b>'+fmt(paidT)+'</b><i>'+esc(S.settings.currency)+'</i></div>'+
      '<div class="kpi fin rem"><small>المتبقي</small><b>'+fmt(remT)+'</b><i>'+esc(S.settings.currency)+'</i></div>')+
  '</section>';

  if(!hideFin && dueT > 0){
    var pct = Math.round(paidT/dueT*100);
    h += '<div class="card fin"><div class="prow"><span>نسبة التحصيل لسنة '+esc(Y)+'</span><b class="num">'+pct+'%</b></div>'+
      '<div class="ptrack"><span style="width:'+pct+'%"></span></div></div>';
  }

  var stages = stageList();
  var shiftRows = stages.map(function(st){
    var a = act.filter(function(e){ return e.stage===st && e.shift==='صباحي'; }).length;
    var b = act.filter(function(e){ return e.stage===st && e.shift==='مسائي'; }).length;
    return {label:st, vals:[a,b], total:a+b, detail:a+' ص · '+b+' م'};
  }).filter(function(r){ return r.total > 0; });

  if(shiftRows.length){
    h += '<div class="grid g2">'+
      '<div class="card"><h2>الطلاب حسب المرحلة والفترة</h2>'+
        stackBars(shiftRows, [{n:'صباحي',c:'c-a'},{n:'مسائي',c:'c-b'}])+
      '</div>';
    if(!hideFin){
      var feeRows = stages.map(function(st){
        var p=0, r=0;
        act.filter(function(e){ return e.stage===st; }).forEach(function(e){
          p += paid(e.id); r += Math.max(0, bal(e.id));
        });
        return {label:st, vals:[p,r], total:fmt(p+r), detail:'محصّل '+fmt(p)+' · متبقٍ '+fmt(r)};
      }).filter(function(r){ return r.vals[0]>0 || r.vals[1]>0; });
      if(feeRows.length){
        h += '<div class="card fin"><h2>الرسوم حسب المرحلة</h2>'+
          stackBars(feeRows, [{n:'محصّل',c:'c-a'},{n:'متبقٍ',c:'c-m'}])+
        '</div>';
      }
    }
    h += '</div>';
  }

  var cities = {};
  S.students.forEach(function(s){
    var c = String(s.city||'').trim();
    if(c) cities[c] = (cities[c]||0) + 1;
  });
  var cityRows = Object.keys(cities).sort(function(a,b){ return cities[b]-cities[a]; }).slice(0,6)
    .map(function(c){ return {label:c, vals:[cities[c]], total:cities[c], detail:'طالب'}; });
  if(cityRows.length){
    h += '<div class="card"><h2>توزيع الطلاب جغرافياً</h2>'+
      stackBars(cityRows, [{n:'طلاب',c:'c-a'}])+
    '</div>';
  }

  var td = today();
  var todayMarks = D.att[td] || {};
  var c = {p:0,l:0,a:0,u:0};
  act.forEach(function(e){
    var m = todayMarks[e.studentId];
    if(m) c[m]++; else c.u++;
  });

  h += '<div class="grid g2">'+
    '<div class="card"><h2>حضور اليوم</h2>'+
      (D.att[td] ?
        '<div class="sumpills">'+
          '<span class="pill good">حاضر '+c.p+'</span>'+
          '<span class="pill warn">متأخر '+c.l+'</span>'+
          '<span class="pill bad">غائب '+c.a+'</span>'+
          '<span class="pill">غير محدد '+c.u+'</span>'+
        '</div>' :
        '<p class="note">لم يُسجَّل حضور اليوم بعد.</p>')+
      '<div style="margin-top:12px"><button type="button" class="btn sm" data-act="nav" data-v="att">فتح التحضير</button></div>'+
    '</div>';

  var top = leaderRows('', '').slice(0,5);
  h += '<div class="card"><h2>لوحة الشرف (النقاط)</h2>'+
    (top.length ?
      '<div class="list">'+top.map(function(r,i){
        return '<div class="li"><div>'+
          '<span class="rk t'+(i+1)+'">'+(i+1)+'</span> '+
          '<button type="button" class="linkb" data-act="pointsOf" data-id="'+r.sid+'">'+esc(r.name)+'</button>'+
        '</div><span class="amt">'+fmt(r.pt.total)+' نقطة</span></div>';
      }).join('')+'</div>' :
      '<p class="note">لا توجد نقاط بعد.</p>')+
  '</div></div>';

  var topMem = S.students.filter(function(s){ return s.status==='مقبول'; })
    .map(function(s){ return {s:s, m:memoOf(s.id)}; })
    .filter(function(x){ return x.m.count > 0; })
    .sort(function(a,b){ return b.m.count - a.m.count; })
    .slice(0,5);

  if(topMem.length){
    h += '<div class="card"><h2>الأكثر حفظاً</h2>'+
      '<div class="list">'+topMem.map(function(x,i){
        return '<div class="li"><div>'+
          '<span class="rk t'+(i+1)+'">'+(i+1)+'</span> '+
          '<button type="button" class="linkb" data-act="profile" data-id="'+x.s.id+'">'+esc(x.s.name)+'</button>'+
          '<small>'+x.m.done+' جزءاً مكتملاً</small>'+
        '</div><span class="amt">'+x.m.count+' / 604</span></div>';
      }).join('')+'</div>'+
    '</div>';
  }

  var teacherScores = S.teachers.map(function(t2){
    var ev = S.tevals.filter(function(e){ return e.teacherId===t2.id; });
    if(!ev.length) return null;
    var avg = Math.round(ev.reduce(function(s,e){ return s+num(e.pct); }, 0)/ev.length);
    return {t:t2, avg:avg, count:ev.length};
  }).filter(Boolean).sort(function(a,b){ return b.avg - a.avg; }).slice(0,3);

  if(teacherScores.length){
    h += '<div class="card"><h2>أعلى المعلمين تقييماً</h2>'+
      '<div class="list">'+teacherScores.map(function(x,i){
        return '<div class="li"><div>'+
          '<span class="rk t'+(i+1)+'">'+(i+1)+'</span> '+esc(x.t.name)+
        '</div><span class="amt">'+x.avg+'%</span></div>';
      }).join('')+'</div>'+
    '</div>';
  }

  if(!hideFin){
    var recentPays = S.payments.filter(function(p){
      var e = D.eMap[p.enrollmentId];
      return e && e.year===Y;
    }).sort(function(a,b){
      return a.date<b.date?1:a.date>b.date?-1:num(b.receiptNo)-num(a.receiptNo);
    }).slice(0,6);
    if(recentPays.length){
      h += '<div class="card fin"><h2>آخر الدفعات</h2>'+
        '<div class="list">'+recentPays.map(function(p){
          var e = D.eMap[p.enrollmentId];
          return '<div class="li"><div>'+
            '<button type="button" class="linkb" data-act="account" data-e="'+p.enrollmentId+'">'+
              esc(e?sName(e.studentId):'')+
            '</button>'+
            '<small>سند '+esc(p.receiptNo)+' · '+esc(p.date)+' · '+esc(p.method)+'</small>'+
          '</div><span class="amt">'+money(p.amount)+'</span></div>';
        }).join('')+'</div>'+
      '</div>';
    }
  }

  h += '<div class="card"><h2>إجراءات سريعة</h2><div class="btns">'+
    W('<button type="button" class="btn" data-act="newStudent">'+ico('plus')+'طالب جديد</button>')+
    W('<button type="button" class="btn pri" data-act="newSession">'+ico('plus')+'حصة جديدة</button>')+
    '<button type="button" class="btn" data-act="nav" data-v="rep">'+ico('rep')+'التقارير</button>'+
    '<button type="button" class="btn" data-act="nav" data-v="set">'+ico('set')+'الإعدادات</button>'+
  '</div></div>';

  return h;
}

/* ---------- Dashboard (teacher) ---------- */
function vDashTeacher(Y, act){
  var tid = effectiveTeacherId();
  var myEnrolls = act.filter(function(e){ return e.teacherId===tid; });
  var myStudentIds = myEnrolls.map(function(e){ return e.studentId; });
  var mySessions = S.sessions.filter(function(x){ return x.teacherId===tid; });
  var td = today();
  var todaySess = mySessions.filter(function(x){ return x.date===td && x.status!=='ملغاة'; });
  var wa = new Date(); wa.setDate(wa.getDate()-7);
  var waStr = wa.getFullYear()+'-'+pad(wa.getMonth()+1)+'-'+pad(wa.getDate());
  var weekSess = mySessions.filter(function(x){ return x.date >= waStr; });

  var h = vh(t('nav.dash'), t('app.subtitle')+' · '+esc(Y),
    W('<button type="button" class="btn pri" data-act="newSession">'+ico('plus')+'حصة جديدة</button>'));

  h += '<section class="kpis">'+
    '<div class="kpi"><small>طلابي</small><b>'+myEnrolls.length+'</b><i>نشطون</i></div>'+
    '<div class="kpi"><small>حصص اليوم</small><b>'+todaySess.length+'</b></div>'+
    '<div class="kpi"><small>حصص الأسبوع</small><b>'+weekSess.length+'</b></div>'+
    '<div class="kpi"><small>تسميعات الأسبوع</small><b>'+fmt(myStudentIds.reduce(function(sum, sid){
      var m = memoOf(sid), c2 = 0;
      Object.keys(m.pages).forEach(function(k){ if(m.pages[k].d >= waStr) c2++; });
      return sum + c2;
    }, 0))+'</b></div>'+
  '</section>';

  var upcoming = [];
  S.books.filter(function(b){ return b.teacherId===tid && b.selected; }).forEach(function(b){
    var next = nextLessonFor(tid, b.id);
    if(next) upcoming.push({book:b, lesson:next});
  });
  if(upcoming.length){
    h += '<div class="card"><h2>الدروس القادمة</h2><div class="list">'+
      upcoming.slice(0,6).map(function(u){
        return '<div class="li"><div>'+
          '<b>'+esc(u.book.name)+'</b>'+
          '<small>'+esc(u.lesson.title||'')+' · درس '+esc(u.lesson.order)+'</small>'+
        '</div>'+
        W('<button type="button" class="btn sm pri" data-act="newSession" data-book="'+u.book.id+'">إعطاؤه</button>')+
        '</div>';
      }).join('')+
    '</div></div>';
  }

  var todayMarks = D.att[td] || {};
  var c = {p:0,l:0,a:0,u:0};
  myEnrolls.forEach(function(e){
    var m = todayMarks[e.studentId];
    if(m) c[m]++; else c.u++;
  });
  h += '<div class="card"><h2>حضور اليوم</h2>'+
    (D.att[td] ?
      '<div class="sumpills">'+
        '<span class="pill good">حاضر '+c.p+'</span>'+
        '<span class="pill warn">متأخر '+c.l+'</span>'+
        '<span class="pill bad">غائب '+c.a+'</span>'+
        '<span class="pill">غير محدد '+c.u+'</span>'+
      '</div>' :
      '<p class="note">لم يُسجَّل حضور اليوم بعد.</p>')+
    W('<div style="margin-top:12px"><button type="button" class="btn sm" data-act="newSession">فتح حصة</button></div>')+
  '</div>';

  var myLeader = myStudentIds.map(function(sid){
    var s = D.sMap[sid]; if(!s) return null;
    return {sid:sid, name:s.name, pt:pointsOf(sid, '', '')};
  }).filter(Boolean).sort(function(a,b){ return b.pt.total - a.pt.total; }).slice(0,8);

  if(myLeader.length){
    h += '<div class="card"><h2>طلابي (حسب النقاط)</h2>'+
      '<div class="list">'+myLeader.map(function(r,i){
        return '<div class="li"><div>'+
          '<span class="rk t'+(i+1)+'">'+(i+1)+'</span> '+
          '<button type="button" class="linkb" data-act="profile" data-id="'+r.sid+'">'+esc(r.name)+'</button>'+
          '<small>حضور '+r.pt.p+' · غياب '+r.pt.a+'</small>'+
        '</div><span class="amt">'+fmt(r.pt.total)+' نقطة</span></div>';
      }).join('')+'</div>'+
    '</div>';
  }
  return h;
}

/* ---------- vDash dispatcher ---------- */
function vDash(){
  try {
    var Y = curYear();
    var act = S.enrollments.filter(function(e){ return e.year===Y && e.status==='نشط'; });
    if(!S.students.length){
      var h = vh(t('nav.dash'), 'السنة الدراسية '+esc(Y),
        W('<button type="button" class="btn pri" data-act="newStudent">'+ico('plus')+'أول طالب</button>'));
      h += '<div class="card raise">'+emptyBox('لا توجد بيانات بعد',
        'ابدأ بإضافة أول طالب، أو حمّل بيانات تجريبية لاستكشاف كل أجزاء النظام.',
        W('<div class="btns" style="justify-content:center">'+
          '<button type="button" class="btn pri" data-act="newStudent">'+ico('plus')+'إضافة أول طالب</button>'+
          '<button type="button" class="btn" data-act="loadSamples">تحميل بيانات تجريبية</button>'+
        '</div>'))+'</div>';
      return h;
    }
    var r = myRole();
    if(r === 'teacher') return vDashTeacher(Y, act);
    if(r === 'cs' && canTeach()){
      var meTid = effectiveTeacherId();
      return vDashManager(Y, act) + vDashTeacher(Y, act.filter(function(e){ return e.teacherId===meTid; }));
    }
    return vDashManager(Y, act);
  } catch(e){
    console.error('vDash error:', e);
    return '<div class="card"><p class="note">تعذّر عرض لوحة التحكم.</p></div>';
  }
}

/* ---------- vStudents ---------- */
function vStudents(){
  var q = (S.ui.sq||'').trim().toLowerCase();
  var st = S.ui.sst||'';
  var tk = S.ui.stk||'';
  var rows = S.students.filter(function(s){
    if(st && s.status !== st) return false;
    if(tk && (s.track||'القرآن الكريم') !== tk) return false;
    if(!q) return true;
    return [s.name, s.no, s.self_no, s.phone, s.guardian, s.guardianPhone, s.nationalId, s.city]
      .some(function(x){ return String(x||'').toLowerCase().indexOf(q) >= 0; });
  }).sort(function(a,b){ return num(a.no) - num(b.no); });
  var shown = rows.slice(0, LIMIT);

  var h = vh(t('nav.students')||'الطلاب', 'كل طالب يظهر مرة واحدة، ورقمه الذاتي يُولَّد تلقائياً للدخول',
    '<button type="button" class="btn" data-act="exportStudentsXlsx">'+ico('dl')+'تحميل (Excel)</button>'+
    W('<button type="button" class="btn" data-act="importExcel" data-col="students">'+ico('ul')+'استيراد (Excel)</button>')+
    W('<button type="button" class="btn pri" data-act="newStudent">'+ico('plus')+'طالب جديد</button>'));

  h += '<div class="filters">'+
    '<input id="sq" type="search" data-bind="sq" value="'+esc(S.ui.sq||'')+'" placeholder="بحث بالاسم أو الرقم أو الهاتف" aria-label="بحث">'+
    '<select id="sst" data-bind="sst">'+selOpts(ADM, st, 'كل الحالات')+'</select>'+
    '<select id="stk" data-bind="stk">'+selOpts(['القرآن الكريم','الرشيدي'], tk, 'كل المسارات')+'</select>'+
  '</div>';

  if(!rows.length){
    return h + emptyBox(
      S.students.length ? 'لا نتائج مطابقة' : 'لا يوجد طلاب بعد',
      S.students.length ? 'غيّر كلمات البحث أو الحالة.' : 'أضف أول طالب لتبدأ.',
      S.students.length ? '' : W('<button type="button" class="btn pri" data-act="newStudent">إضافة طالب</button>')
    );
  }

  h += tbl([
    {h:'الرقم', n:1, f:function(s){ return esc(s.no); }},
    {h:'الذاتي', n:1, f:function(s){
      return s.self_no ? '<code dir="ltr">'+esc(s.self_no)+'</code>' : '<span class="note">—</span>';
    }},
    {h:'الطالب', f:function(s){
      return '<button type="button" class="linkb" data-act="profile" data-id="'+s.id+'">'+esc(s.name)+'</button>'+
        (s.ex ? '<span class="sub">بيانات تجريبية</span>' : '');
    }},
    {h:'ولي الأمر', f:function(s){
      return esc(s.guardian||'—')+'<span class="sub">'+esc(s.guardianPhone||s.phone||'')+'</span>';
    }},
    {h:'المدينة', f:function(s){ return esc(s.city||'—'); }},
    {h:'المسار', f:function(s){
      var t2 = s.track||'القرآن الكريم';
      return '<span class="pill '+(t2==='الرشيدي'?'warn':'acc')+'">'+esc(t2)+'</span>';
    }},
    {h:'القبول', f:function(s){ return admPill(s.status); }},
    {h:'آخر تسجيل', f:function(s){
      var e = latestEn(s.id);
      return e ? esc(e.stage+' '+e.section)+'<span class="sub">'+esc(e.year+' · '+e.shift)+'</span>'
               : '<span class="note">لم يُسجَّل</span>';
    }},
    {h:'', a:1, f:function(s){
      return '<button type="button" class="ibtn" data-act="profile" data-id="'+s.id+'" aria-label="ملف">'+ico('eye')+'</button>'+
        '<button type="button" class="ibtn" data-act="report" data-id="'+s.id+'" aria-label="تقرير">'+ico('report')+'</button>'+
        W('<button type="button" class="ibtn" data-act="editStudent" data-id="'+s.id+'" aria-label="تعديل">'+ico('edit')+'</button>'+
          '<button type="button" class="ibtn" data-act="delStudent" data-id="'+s.id+'" aria-label="حذف">'+ico('trash')+'</button>');
    }}
  ], shown) + limitNote(rows.length);

  return h;
}

function studentForm(id){
  var s = id ? find('students', id) : null;
  var v = s ? Object.assign({}, s) : {
    no: nextNo(),
    self_no: nextSelfNo(1),
    status: 'قيد القبول',
    gender: 'ذكر',
    admDate: today(),
    track: 'القرآن الكريم',
    city: ''
  };
  M.push({
    title: s ? 'تعديل بيانات الطالب' : 'طالب جديد',
    values: v, wide: 1,
    fields: [
      {k:'name', l:'اسم الطالب الكامل', req:1, full:1},
      {k:'self_no', l:'الرقم الذاتي (للدخول)', t:'number', ro:1, hint:'يُولَّد تلقائياً. كلمة المرور: 0000'},
      {k:'no', l:'رقم الطالب الداخلي', t:'number', ro:1},
      {k:'status', l:'حالة القبول', t:'select', o:ADM},
      {k:'gender', l:'الجنس', t:'select', o:['ذكر','أنثى']},
      {k:'birth', l:'تاريخ الميلاد', t:'date'},
      {k:'nationalId', l:'الرقم الوطني'},
      {k:'city', l:'المدينة / المحافظة', list:['دمشق','ريف دمشق','حلب','حمص','حماة','إدلب','اللاذقية','طرطوس','درعا','السويداء','القنيطرة','دير الزور','الرقة','الحسكة']},
      {k:'track', l:'نوع الدراسة', t:'select', o:['القرآن الكريم','الرشيدي']},
      {k:'admDate', l:'تاريخ التقديم', t:'date'},
      {k:'guardian', l:'اسم ولي الأمر'},
      {k:'guardianPhone', l:'هاتف ولي الأمر', t:'tel'},
      {k:'phone', l:'هاتف الطالب', t:'tel'},
      {k:'address', l:'العنوان', full:1},
      {k:'notes', l:'ملاحظات', t:'textarea', full:1}
    ],
    submit: function(x){
      x.name = String(x.name||'').trim();
      if(!x.name) return 'أدخل اسم الطالب.';
      x.no = num(x.no) || nextNo();
      x.self_no = num(x.self_no) || nextSelfNo(1);
      if(S.students.some(function(o){ return o.no===x.no && (!s || o.id!==s.id); }))
        return 'رقم الطالب مستخدم.';
      if(S.students.some(function(o){ return o.self_no===x.self_no && (!s || o.id!==s.id); }))
        return 'الرقم الذاتي مستخدم.';
      var data = Object.assign({}, s||{}, x);
      var oldT = s ? (s.track||'القرآن الكريم') : '';
      if(oldT !== x.track){
        data.trackLog = (data.trackLog||[]).concat([{from:oldT, to:x.track, date:today()}]);
      }
      if(!s){
        data.createdBy = SB.user ? SB.user.id : 'local';
        data.createdByRole = myRole();
      }
      return Data.put('students', s ? s.id : uid(), data).then(function(){
        toast(s ? 'تم التحديث' : 'تمت الإضافة — رقمه الذاتي '+x.self_no);
        if(!s && typeof tryCreateAuthAccount === 'function'){
          tryCreateAuthAccount(x.self_no, x.name, 'student');
        }
      });
    }
  });
}

      var c = e.centerId && D.cMap[e.centerId];
      return c ? esc(c.name) : '<span class="note">—</span>';

    {h:'الحلقة', f:function(e){
      var ha = e.halaqaId && S.halaqat.filter(function(x){ return x.id===e.halaqaId; })[0];
      return ha ? esc(ha.name) : '<span class="note">—</span>';

function enrollForm(id, sid){
  var e = id ? S.enrollments.find(function(x){ return x.id===id; }) : null;
  var st = S.settings;
  var role = myRole();
  var myCsCenter = (role==='cs') ? ((S.profile && S.profile.center_id) || '') : '';
  var myTid = (role==='teacher') ? ((S.profile && S.profile.teacher_id) || '') : '';
  var myTeacherCenter = '';
  if(myTid){
    var me = D.tMap[myTid];
    if(me) myTeacherCenter = me.centerId || '';
  }

  // ✅ إصلاح #58/#59: منع الوصول الكامل عند عدم وجود مركز مرتبط
  var centersAvail = S.centers.slice();
  if(role === 'cs'){
    centersAvail = myCsCenter
      ? S.centers.filter(function(c){ return c.id === myCsCenter; })
      : [];   // ← لا مراكز
  } else if(role === 'teacher'){
    centersAvail = myTeacherCenter
      ? S.centers.filter(function(c){ return c.id === myTeacherCenter; })
      : [];   // ← لا مراكز
  }

  function halaqatAvail(cid){
    var all = S.halaqat.filter(function(h){ return !cid || h.centerId===cid; });
    if(role==='teacher' && myTid){
      all = all.filter(function(h){ return h.teacherId===myTid; });
    }
    return all;
  }

  var list = S.students.filter(function(s){
    return s.status==='مقبول' || (e && s.id===e.studentId) || s.id===sid;
  }).sort(function(a,b){ return a.name<b.name?-1:1; });

  if(!list.length){
    toast('لا يوجد طلاب مقبولون. غيّر حالة الطالب إلى «مقبول» أولاً.');
    return;
  }
  if(!centersAvail.length && (role==='cs'||role==='teacher')){
    toast(role==='cs' ? 'لم يتم ربط حسابك بمركز. راجع المشرف العام.' : 'لم يتم ربط حسابك بمعلم. راجع المشرف.');
    return;
  }

  var v = e ? Object.assign({}, e) : {
    studentId: sid || '',
    year: curYear(),
    stage: st.stages[0] || 'الابتدائية',
    section: st.sections[0] || 'أ',
    shift: 'صباحي',
    status: 'نشط',
    date: today(),
    centerId: (centersAvail[0] && centersAvail[0].id) || '',
    halaqaId: '',
    teacherId: '',
    level: ''
  };
  var lastC = v.centerId || '';
  var lastH = v.halaqaId || '';

  M.push({
    title: e ? 'تعديل التسجيل' : 'تسجيل طالب في حلقة',
    values: v, wide: 1,
    fields: [
      {k:'studentId', l:'الطالب', t:'select', req:1, full:1,
        o:[['','اختر الطالب...']].concat(list.map(function(s){
          return [s.id, s.no+' — '+s.name+(s.self_no?' ('+s.self_no+')':'')];
        }))},
      {k:'year', l:'السنة الدراسية', t:'select', o:withCur(yearsList(), v.year)},
      {k:'status', l:'حالة التسجيل', t:'select', o:ENST},
      {k:'centerId', l:'المركز', t:'select',
        o:centersAvail.length ? centersAvail.map(function(c){ return [c.id, c.name]; }) : [['','لا يوجد مركز متاح']],
        hint:role==='cs'?'مقيّد بمركزك':role==='teacher'?'مقيّد بمركز المعلم':''},
      {k:'halaqaId', l:'الحلقة', t:'select', o:haOpts(v.centerId),
        hint:role==='teacher'?'تُعرض حلقاتك فقط':'تُحدَّد معلم الحلقة تلقائياً.'},
      {k:'teacherId', l:'المعلم', t:'select',
        o:[['','بدون معلم']].concat(S.teachers.slice().sort(function(a,b){ return a.name<b.name?-1:1; })
          .map(function(t2){ return [t2.id, t2.name]; }))},
      {k:'level', l:'المستوى', t:'select', o:[['','غير محدد']].concat(withCur(levelsList(), v.level))},
      {k:'stage', l:'المرحلة', t:'select', o:withCur(stageList(), v.stage)},
      {k:'section', l:'القسم', t:'select', o:withCur(st.sections, v.section)},
      {k:'shift', l:'الفترة', t:'select', o:SHIFTS},
      {k:'date', l:'تاريخ التسجيل', t:'date'},
      {k:'notes', l:'ملاحظات', t:'textarea', full:1}
    ],
    onInput: function(form){
      var cEl = form.elements.centerId;
      var hEl = form.elements.halaqaId;
      var tEl = form.elements.teacherId;
      if(!cEl || !hEl || !tEl) return;
      if(cEl.value !== lastC){
        lastC = cEl.value;
        var opts = halaqatAvail(lastC);
        hEl.innerHTML = [['','بدون حلقة']].concat(opts.map(function(h){ return [h.id, h.name]; }))
          .map(function(o){ return '<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>'; }).join('');
        lastH = '';
      }
      if(hEl.value !== lastH){
        lastH = hEl.value;
        var ha = S.halaqat.filter(function(x){ return x.id===lastH; })[0];
        if(ha && ha.teacherId) tEl.value = ha.teacherId;
        var hint = $('#h_halaqaId');
        if(hint){
          hint.textContent = ha && ha.teacherId ? 'معلم الحلقة: '+tName(ha.teacherId) : 'تُحدَّد معلم الحلقة تلقائياً.';
        }
      }
    },
    submit: function(x){
      if(!x.studentId) return 'اختر الطالب.';
      // ✅ إصلاح #60: فحص centerId مقابل centersAvail الفعلي
      if(role==='cs' && centersAvail.length && !centersAvail.some(function(c){ return c.id===x.centerId; }))
        return 'يمكنك التسجيل في مركزك فقط.';
      if(role==='teacher' && centersAvail.length && !centersAvail.some(function(c){ return c.id===x.centerId; }))
        return 'يمكنك التسجيل في مركز معلمك فقط.';
      if(!x.halaqaId) return 'اختر الحلقة.';
      var ha = S.halaqat.filter(function(h){ return h.id===x.halaqaId; })[0];
      if(!ha) return 'الحلقة غير موجودة.';
      if(x.centerId && ha.centerId !== x.centerId) return 'هذه الحلقة لا تتبع المركز المختار.';
      if(role==='teacher' && ha.teacherId !== myTid) return 'يمكنك تسجيل الطالب في حلقاتك فقط.';
      x.centerId = ha.centerId;
      if(!x.teacherId && ha.teacherId) x.teacherId = ha.teacherId;
      if(S.enrollments.some(function(o){
        return o.studentId===x.studentId && o.year===x.year && (!e || o.id!==e.id);
      })) return 'هذا الطالب مسجّل في هذه السنة من قبل.';
      var log = ((e && e.levelLog)||[]).slice();
      var oldLevel = e ? (e.level||'') : '';
      var newLevel = x.level || '';
      if(oldLevel !== newLevel && (newLevel || oldLevel)){
        log.push({from:oldLevel, to:newLevel, date:today()});
      }
      x.levelLog = log;
      var ps = [];
      if(x.status === 'نشط'){
        S.enrollments.forEach(function(o){
          if(o.studentId===x.studentId && o.id !== (e && e.id) && o.status==='نشط' && o.year < x.year){
            ps.push(Data.put('enrollments', o.id, Object.assign({}, o, {status:'منتهٍ'})));
          }
        });
      }
      ps.push(Data.put('enrollments', e ? e.id : uid(), Object.assign({}, e||{}, x)));
      return Promise.all(ps).then(function(){
        toast(e ? 'تم التحديث' : 'تم تسجيل الطالب في الحلقة');
      });
    }
  });
}

/* ---------- vFees / vPay / openAccount ---------- */
function vFees(){
  if(S.settings.hideFinance){
    return '<div class="card">'+emptyBox('البيانات المالية مخفية','يمكن إظهارها من الإعدادات.','')+'</div>';
  }
  var Y = curYear();
  var q = (S.ui.fq||'').trim().toLowerCase();
  var fps = S.ui.fps||'';
  var rows = S.enrollments.filter(function(e){
    if(e.year !== Y) return false;
    if(q && (sName(e.studentId)+' '+sNo(e.studentId)).toLowerCase().indexOf(q)<0) return false;
    var d = due(e.id), p = paid(e.id);
    if(fps==='open' && !(d-p>0)) return false;
    if(fps==='done' && !(d>0 && d-p<=0)) return false;
    if(fps==='none' && d>0) return false;
    return true;
  }).sort(function(a,b){ return bal(b.id) - bal(a.id); });
  var shown = rows.slice(0, LIMIT);
  var tD=0, tP=0;
  rows.forEach(function(e){ tD += due(e.id); tP += paid(e.id); });

  var h = vh(t('nav.fees')||'الرسوم', 'المستحق والمدفوع والمتبقي في '+esc(Y)+' · '+esc(S.settings.currency),
    W('<button type="button" class="btn pri" data-act="bulkFee">'+ico('plus')+'رسم جماعي</button>'));
  h += '<div class="filters">'+
    '<input id="fq" type="search" data-bind="fq" value="'+esc(S.ui.fq||'')+'" placeholder="بحث بالاسم أو الرقم">'+
    '<select id="fps" data-bind="fps">'+
      selOpts([['open','عليه متبقٍ'],['done','مسدّد'],['none','بلا رسوم']], fps, 'كل الحالات')+
    '</select>'+
  '</div>';

  if(!rows.length) return h + emptyBox('لا نتائج','لا توجد تسجيلات مطابقة.','');

  h += tbl([
    {h:'الطالب', f:function(e){
      return '<button type="button" class="linkb" data-act="account" data-e="'+e.id+'">'+
        esc(sName(e.studentId))+'</button>'+
        '<span class="sub">'+esc(e.stage+' '+e.section+' · '+e.shift)+'</span>';
    }},
    {h:'الرسوم', n:1, f:function(e){ return fmt(due(e.id)); }},
    {h:'المدفوع', n:1, f:function(e){ return fmt(paid(e.id)); }},
    {h:'المتبقي', n:1, f:function(e){ return '<b>'+fmt(Math.max(0, bal(e.id)))+'</b>'; }},
    {h:'الحالة', f:function(e){ return balPill(e.id); }},
    {h:'', a:1, f:function(e){ return '<button type="button" class="btn sm" data-act="account" data-e="'+e.id+'">الحساب</button>'; }}
  ], shown,
    '<tfoot><tr>'+
      '<td>المجموع ('+fmt(rows.length)+')</td>'+
      '<td class="n">'+fmt(tD)+'</td>'+
      '<td class="n">'+fmt(tP)+'</td>'+
      '<td class="n">'+fmt(Math.max(0, tD-tP))+'</td>'+
      '<td></td><td></td>'+
    '</tr></tfoot>') + limitNote(rows.length);
  return h;
}

function vPay(){
  if(S.settings.hideFinance){
    return '<div class="card">'+emptyBox('البيانات المالية مخفية','يمكن إظهارها من الإعدادات.','')+'</div>';
  }
  var Y = curYear();
  var q = (S.ui.pq||'').trim().toLowerCase();
  var rows = S.payments.filter(function(p){
    var e = D.eMap[p.enrollmentId];
    if(!e || e.year !== Y) return false;
    if(q && (sName(e.studentId)+' '+p.receiptNo+' '+sNo(e.studentId)).toLowerCase().indexOf(q)<0) return false;
    return true;
  }).sort(function(a,b){
    return a.date<b.date?1:a.date>b.date?-1:num(b.receiptNo)-num(a.receiptNo);
  });
  var shown = rows.slice(0, LIMIT);
  var tot = 0;
  rows.forEach(function(p){ tot += num(p.amount); });

  var h = vh(t('nav.pay')||'الدفعات', 'كل دفعة سجل مستقل · '+esc(Y),
    W('<button type="button" class="btn pri" data-act="newPayment">'+ico('plus')+'تسجيل دفعة</button>'));
  h += '<div class="filters">'+
    '<input id="pq" type="search" data-bind="pq" value="'+esc(S.ui.pq||'')+'" placeholder="بحث بالاسم أو رقم السند">'+
  '</div>';

  if(!rows.length){
    return h + emptyBox('لا توجد دفعات','سجّل أول دفعة.',

  h += tbl([

    {h:'التاريخ', f:function(p){ return esc(p.date); }},

        '<button type="button" class="ibtn" data-act="delPayment" data-id="'+p.id+'" aria-label="حذف">'+ico('trash')+'</button>');
    }}
  ], shown,
    '<tfoot><tr><td></td><td></td><td>المجموع ('+fmt(rows.length)+')</td>'+
    '<td class="n">'+fmt(tot)+'</td><td></td><td></td></tr></tfoot>') + limitNote(rows.length);
  return h;

function payForm(eid, pid){
  if(S.settings.hideFinance) return;
  var p = pid ? S.payments.find(function(x){ return x.id===pid; }) : null;
  var Y = curYear();
  var ens = S.enrollments.filter(function(e){
    return e.year===Y || e.id===eid || (p && e.id===p.enrollmentId);
  }).filter(function(e){ return e.status!=='منسحب'; })
    .sort(function(a,b){ return sName(a.studentId) < sName(b.studentId) ? -1 : 1; });
  if(!ens.length){ toast('لا توجد تسجيلات نشطة.'); return; }
  var cur = p ? p.enrollmentId : (eid||'');
  var v = p ? Object.assign({}, p) : {enrollmentId:cur, date:today(), method:'نقداً', receiptNo:nextReceipt()};
  function room(id){
    if(!id) return '';
    var e = D.eMap[id]; if(!e) return '';
    var r = bal(id) + (p && p.enrollmentId===id ? num(p.amount) : 0);
    return 'المتبقي: '+fmt(Math.max(0, r))+' '+S.settings.currency;
  }
  M.push({
    title: p ? 'تعديل الدفعة' : 'تسجيل دفعة',
    values: v,
    fields: [
      {k:'enrollmentId', l:'الطالب', t:'select', req:1, full:1,
        o:[['','اختر الطالب...']].concat(ens.map(function(e){ return [e.id, enLabel(e)]; }))},
      {k:'amount', l:'المبلغ ('+S.settings.currency+')', t:'number', req:1, hint:room(cur)},
      {k:'date', l:'تاريخ الدفعة', t:'date', req:1},
      {k:'method', l:'طريقة الدفع', t:'select', o:METHODS},
      {k:'receiptNo', l:'رقم السند', t:'number'},
      {k:'note', l:'ملاحظة', full:1}
    ],
    onInput: function(form){
      var hEl = $('#h_amount');
      if(hEl) hEl.textContent = room(form.elements.enrollmentId.value);
    },
    submit: function(x){
      if(!x.enrollmentId) return 'اختر الطالب.';
      x.amount = num(x.amount);
      if(x.amount <= 0) return 'أدخل مبلغاً أكبر من صفر.';
      if(!x.date) return 'حدّد تاريخ الدفعة.';
      var r = bal(x.enrollmentId) + (p && p.enrollmentId===x.enrollmentId ? num(p.amount) : 0);
      if(x.amount > r) return 'المبلغ أكبر من المتبقي ('+fmt(Math.max(0, r))+' '+S.settings.currency+').';
      x.receiptNo = num(x.receiptNo) || nextReceipt();
      return Data.put('payments', p ? p.id : uid(), Object.assign({}, p||{}, x))
        .then(function(){ toast(p?'تم التحديث':'تم تسجيل الدفعة، سند رقم '+x.receiptNo); });
    }
  });
}

            [['p','حاضر'],['l','متأخر'],['a','غائب'],['e','بعذر']].map(function(k){
              return '<button type="button" class="s-'+k[0]+'" data-act="tmark" data-t="'+esc(t2.id)+'" data-st="'+k[0]+

  if(tab === 'rank'){
    var rk = rows.slice().sort(function(a,b){
      var x = stat[a.id], y = stat[b.id];
      return ((y.avg==null?-1:y.avg) - (x.avg==null?-1:x.avg)) ||
             ((y.rate==null?-1:y.rate) - (x.rate==null?-1:x.rate));

      {h:'#', f:function(t2){ var i = rk.indexOf(t2); return '<span class="rk t'+(i<3?i+1:'')+'">'+(i+1)+'</span>'; }},
      {h:'المعلم', f:function(t2){ return esc(t2.name)+'<span class="sub">'+esc(t2.specialty||'')+'</span>'; }},

        var a = stat[t2.id].avg;
        return a==null ? '—' : '<b>'+a+'%</b><div class="pbar"><i style="width:'+a+'%"></i></div>';
      }},
      {h:'التقييمات', n:1, f:function(t2){ return stat[t2.id].ev.length; }},
      {h:'نسبة الحضور', n:1, f:function(t2){ var r = stat[t2.id].rate; return r==null?'—':r+'%'; }},

    ], rk);
    return h;
  }

  h += tbl([
    {h:'المعلم', f:function(t2){
      return esc(t2.name) + (t2.ex ? '<span class="sub">بيانات تجريبية</span>' :
        '<span class="sub">'+esc(t2.self_no||t2.phone||'')+'</span>');
    }},
    {h:'المركز', f:function(t2){
      var c = t2.centerId && D.cMap[t2.centerId];
      return c ? esc(c.name) : '<span class="note">—</span>';
    }},
    {h:'الحلقة / التخصص', f:function(t2){ return esc(t2.specialty||'—'); }},
    {h:'الطلاب', n:1, f:function(t2){ return stat[t2.id].students; }},
    {h:'الحضور', n:1, f:function(t2){ var r = stat[t2.id].rate; return r==null?'—':r+'%'; }},
    {h:'التقييم', n:1, f:function(t2){ var a = stat[t2.id].avg; return a==null?'—':a+'%'; }},
    {h:'الحالة', f:function(t2){
      return '<span class="pill '+(t2.status==='موقوف'?'bad':'good')+'">'+esc(t2.status||'نشط')+'</span>';
    }},
    {h:'', a:1, f:function(t2){
      return W(
        '<button type="button" class="ibtn" data-act="evalTeacher" data-id="'+t2.id+'" aria-label="تقييم">'+ico('star')+'</button>'+
        '<button type="button" class="ibtn" data-act="teacherCert" data-id="'+t2.id+'" aria-label="شهادة">'+ico('cert')+'</button>'
      ) + ADMIN_H(
        '<button type="button" class="ibtn" data-act="editTeacher" data-id="'+t2.id+'" aria-label="تعديل">'+ico('edit')+'</button>'+
        '<button type="button" class="ibtn" data-act="delTeacher" data-id="'+t2.id+'" aria-label="حذف">'+ico('trash')+'</button>'
      );
    }}
  ], rows.slice(0, LIMIT)) + limitNote(rows.length);
  return h;
}

function certMarkup(c){
  var isT = c.recipientType === 'teacher';
  var rec = isT ? D.tMap[c.recipientId] : D.sMap[c.recipientId];
  var name = rec ? rec.name : '—';
  var fem = !isT && rec && rec.gender==='أنثى';
  var who = isT ? 'الأستاذ(ة)' : (fem?'الطالبة':'الطالب');
  var org = S.settings.institution;
  var j = c.juz ? ' '+c.juz : '';
  var txt;
  if(c.kind==='إتمام جزء من القرآن'){
    txt = 'تشهد '+org+' بأن '+who+' المذكور اسمه أعلاه قد '+(fem?'أتمّت':'أتمّ')+' حفظ الجزء'+j+' من القرآن الكريم، نسأل الله أن ينفع به ويجعله من أهل القرآن.';
  } else if(c.kind==='اجتياز اختبار جزء'){
    txt = 'تشهد '+org+' بأن '+who+' المذكور اسمه أعلاه قد '+(fem?'اجتازت':'اجتاز')+' بنجاح اختبار الجزء'+j+' من القرآن الكريم.';
  } else if(c.kind==='إتمام مرحلة تعليمية'){
    txt = 'تشهد '+org+' بأن '+who+' المذكور اسمه أعلاه قد '+(fem?'أتمّت':'أتمّ')+' المرحلة التعليمية بنجاح.';
  } else if(c.kind==='تفوق وتميّز'){
    txt = 'تمنح '+org+' هذه الشهادة إلى '+who+' المذكور اسمه أعلاه نظير تفوّقه وتميّزه.';
  } else if(c.kind==='إتمام الكتاب الرشيدي'){
    txt = 'تشهد '+org+' بأن '+who+' المذكور اسمه أعلاه قد '+(fem?'أتمّت':'أتمّ')+' كتاب «الرشيدي المطور» كاملاً.';
  } else if(c.kind==='اجتياز اختبار الرشيدي'){
    txt = 'تشهد '+org+' بأن '+who+' المذكور اسمه أعلاه قد '+(fem?'اجتازت':'اجتاز')+' الاختبار النهائي لكتاب «الرشيدي المطور» بنجاح.';
  } else {
    txt = 'تتقدّم '+org+' بجزيل الشكر والتقدير إلى '+who+' المذكور اسمه أعلاه على جهوده المبذولة.';
  }
  return '<div class="cert">'+
    '<div class="c-org">'+esc(org)+'</div>'+
    '<div class="c-t">'+esc(certTitle(c))+'</div>'+
    '<p>تُمنح هذه الشهادة إلى</p>'+
    '<div class="c-n">'+esc(name)+'</div>'+
    '<p>'+esc(txt)+'</p>'+
    (c.note?'<p>'+esc(c.note)+'</p>':'')+
    '<div class="c-f">'+
      '<span>التاريخ: '+esc(c.date)+'</span>'+
      '<span>رقم الشهادة: '+esc(certNo(c.certNo))+'</span>'+
      (c.signer?'<span>التوقيع: '+esc(c.signer)+'</span>':'')+
    '</div>'+
  '</div>';
}

function reportData(){
  var Y = curYear();
  var kind = S.ui.rep || 'roster';
  var st = S.ui.rst || '';
  var sh = S.ui.rsh || '';
  var en = S.enrollments.filter(function(e){
    return e.year===Y && (!st || e.stage===st) && (!sh || e.shift===sh);
  });
  var stageIdx = stageList();
  en.sort(function(a,b){
    return (stageIdx.indexOf(a.stage) - stageIdx.indexOf(b.stage)) ||
           (a.section<b.section?-1:a.section>b.section?1:0) ||
           (sName(a.studentId)<sName(b.studentId)?-1:1);
  });
  var r = {title:'', head:[], rows:[], nums:[], total:null};
  if(kind === 'roster'){
    r.title = 'كشف الطلاب — '+Y;
    r.head = ['الرقم','الطالب','المرحلة','القسم','الفترة','حالة التسجيل','ولي الأمر','الهاتف'];
    r.rows = en.map(function(e){
      var s = D.sMap[e.studentId] || {};
      return [s.no||'', s.name||'', e.stage, e.section, e.shift, e.status, s.guardian||'', s.guardianPhone||s.phone||''];
    });
  } else if(kind === 'dues'){
    if(S.settings.hideFinance) return r;
    r.title = 'كشف الذمم المتبقية — '+Y;
    r.head = ['الرقم','الطالب','المرحلة','القسم','الفترة','الرسوم','المدفوع','المتبقي'];
    r.nums = [5,6,7];
    var t2 = [0,0,0];
    en.filter(function(e){ return bal(e.id) > 0; })
      .sort(function(a,b){ return bal(b.id) - bal(a.id); })
      .forEach(function(e){
        var s = D.sMap[e.studentId] || {};
        r.rows.push([s.no||'', s.name||'', e.stage, e.section, e.shift, due(e.id), paid(e.id), bal(e.id)]);
        t2[0] += due(e.id); t2[1] += paid(e.id); t2[2] += bal(e.id);
      });
    r.total = t2;
  } else {
    if(S.settings.hideFinance) return r;
    var from = S.ui.rfrom||'', to = S.ui.rto||'';
    r.title = 'كشف الدفعات'+(from||to?' — '+(from||'…')+' إلى '+(to||'…'):'');
    r.head = ['رقم السند','التاريخ','الطالب','المرحلة','الفترة','المبلغ','الطريقة'];
    r.nums = [5];
    var tt = 0;
    S.payments.filter(function(p){
      var e = D.eMap[p.enrollmentId];
      if(!e) return false;
      if(st && e.stage !== st) return false;
      if(sh && e.shift !== sh) return false;
      if(from && p.date < from) return false;
      if(to && p.date > to) return false;
      return true;
    }).sort(function(a,b){
      return a.date<b.date?-1:a.date>b.date?1:num(a.receiptNo)-num(b.receiptNo);
    }).forEach(function(p){
      var e = D.eMap[p.enrollmentId];
      r.rows.push([p.receiptNo, p.date, sName(e.studentId), e.stage, e.shift, num(p.amount), p.method]);
      tt += num(p.amount);
    });
    r.total = [tt];
  }
  return r;
}

        '</div>';
      }).join('')+'</div></div>';
  }
  return h;
}

function recForm(sid, juz, page){
  var lo = sid ? lastOf(sid) : {mem:null, read:null};
  var a0 = (juz && page) ? absPage(juz, page) : (lo.mem ? Math.min(604, absPage(lo.mem.juz, lo.mem.page)+1) : 1);
  M.push({
    title: 'تسميع القرآن',
    values: {studentId:sid||'', from:a0, to:'', t:'new', g:'good', d:today(), note:''},
    fields: [
      {k:'studentId', l:'الطالب', t:'select', req:1, full:1,
        o:[['','اختر الطالب...']].concat(
          S.students.filter(function(s){ return s.status==='مقبول'; })
            .sort(function(a,b){ return a.name<b.name?-1:1; })
            .map(function(s){ return [s.id, s.no+' — '+s.name]; })
        )},
      {k:'from', l:'من صفحة', t:'number', req:1, min:1, max:604, hint:'رقم صفحة المصحف (1–604)'},
      {k:'to', l:'إلى صفحة', t:'number', min:1, max:604, hint:'اتركه فارغاً لصفحة واحدة'},
      {k:'t', l:'نوع الأداء', t:'select', o:[['new','حفظ جديد'],['review','مراجعة'],['tilawa','تلاوة']]},
      {k:'g', l:'التقدير', t:'select', o:[['good','جيد'],['vgood','جيد جداً'],['excellent','ممتاز'],['redo','إعادة']]},
      {k:'d', l:'التاريخ', t:'date', req:1},
      {k:'note', l:'ملاحظات', full:1}
    ],
    submit: function(x){
      if(!x.studentId) return 'اختر الطالب.';
      var a = Math.round(num(x.from));
      var b = (x.to === '' || x.to == null) ? a : Math.round(num(x.to));
      if(a<1 || a>604 || b<1 || b>604) return 'الصفحة بين 1 و604.';
      if(b < a) return 'الصفحة الأخيرة قبل الأولى.';
      if(b - a >= 60) return 'الحد 60 صفحة في الجلسة.';
      var base = Date.now();
      return saveProg(x.studentId, function(p){
        for(var i=a; i<=b; i++){
          var jp = absToJP(i);
          p.rec.push({
            id:uid(), d:x.d, juz:jp.juz, page:jp.page,
            g:x.g, t:x.t, note:String(x.note||'').trim(),
            ts:base + (i-a)
          });
        }
      }).then(function(){
        S.ui.quranSid = x.studentId;
        toast('سُجّلت '+(b-a+1)+' صفحة');
      });
    }
  });
}

          return '<div class="li"><div>'+
            '<span class="pill '+(pct>=60?'good':'warn')+'">'+pct+'%</span> '+
            fmt(t2.score)+' / '+fmt(t2.max)+
            '<small>'+esc(t2.date)+(t2.note?' · '+esc(t2.note):'')+'</small>'+
          '</div>'+
          W(' <button type="button" class="ibtn" data-act="delRashExam" data-id="'+t2.id+'" aria-label="حذف">'+ico('trash')+'</button>')+
          '</div>';
        }).join('')+'</div>';
    }
    if(exam.finals.length){
      h += '<h3 style="margin:10px 0 6px;font-size:14px">نهائية ('+exam.finals.length+')</h3>'+
        '<div class="list">'+exam.finals.map(function(f){
          var pct = Math.round(num(f.score)/(num(f.max)||100)*100);
          return '<div class="li"><div>'+
            '<span class="pill '+(pct>=60?'good':'bad')+'">'+pct+'%</span> '+
            fmt(f.score)+' / '+fmt(f.max)+
            '<small>'+esc(f.date)+(f.note?' · '+esc(f.note):'')+'</small>'+
          '</div>'+
          (isAtLeast(3) ? '<button type="button" class="ibtn" data-act="delRashExam" data-id="'+f.id+'" aria-label="حذف">'+ico('trash')+'</button>' : '')+
          '</div>';
        }).join('')+'</div>';
    }
    h += '</div>';
  }

  var recent = st.evs.slice().sort(function(a,b){
    return (b.ts||0)-(a.ts||0) || (a.d<b.d?1:-1);
  }).slice(0,10);
  if(recent.length){
    h += '<div class="card"><h2>آخر التسميعات</h2><div class="list">'+
      recent.map(function(e){
        var pg = num(e.page) || num(e.item);
        return '<div class="li"><div>صفحة '+pg+
          ' <span class="pill '+(e.g==='redo'?'warn':'acc')+'">'+GRADES[e.g]+'</span>'+
          '<small>'+esc(e.d)+(e.note?' · '+esc(e.note):'')+'</small>'+
        '</div>'+
        W('<button type="button" class="ibtn" data-act="delRash" data-s="'+esc(sid)+'" data-id="'+e.id+'" aria-label="حذف">'+ico('trash')+'</button>')+
        '</div>';
      }).join('')+'</div></div>';
  }

  if(isAtLeast(3) && st.completed && exam.passed){
    h += '<div class="card"><h2>الانتقال إلى القرآن الكريم</h2>'+
      '<p class="note">الطالب أتمّ الرشيدي ونجح في الاختبار النهائي. جاهز للانتقال إلى مسار القرآن (604 صفحة).</p>'+
      '<div class="btns" style="margin-top:10px">'+
        '<button type="button" class="btn pri" data-act="toQuranTrack" data-s="'+esc(sid)+'">نقل إلى القرآن الكريم</button>'+
      '</div>'+
    '</div>';
  }
  return h;
}

function rashForm(sid, page){

  M.push({
    title: 'تسميع الرشيدي',
    values: {studentId:sid||'', page:suggested, g:'good', d:today()},
    fields: [
      {k:'studentId', l:'الطالب', t:'select', req:1, full:1,
        o:[['','اختر الطالب...']].concat(
          S.students.filter(function(s){
            return s.status==='مقبول' && (s.track||'القرآن الكريم')==='الرشيدي';
          }).sort(function(a,b){ return a.name<b.name?-1:1; })
            .map(function(s){ return [s.id, s.no+' — '+s.name]; })
        )},
      {k:'page', l:'الصفحة (1–'+RASHIDI_PAGES+')', t:'number', req:1, min:1, max:RASHIDI_PAGES},
      {k:'g', l:'النتيجة', t:'select', o:[['good','جيد'],['vgood','جيد جداً'],['excellent','ممتاز'],['redo','إعادة']]},

      {k:'note', l:'ملاحظة المعلم', full:1}

          id:uid(), d:x.d, page:pg, g:x.g,
          note:String(x.note||'').trim(), ts:Date.now()
        });
      }).then(function(){
        S.ui.rashSid = x.studentId;
        toast('سُجّلت صفحة '+pg);
      });

}

function rashExamForm(sid, type){
  var st = rashOf(sid);
  if(!st.completed){

    return;
  }
  if(type==='final' && !isAtLeast(3)){
    toast('الاختبار النهائي متاح للمشرف فما فوق.');
    return;
  }
  var s = D.sMap[sid];
  M.push({
    title: (type==='trial'?'اختبار تجريبي':'اختبار نهائي')+' — '+(s?s.name:''),
    values: {score:'', max:100, date:today()},
    fields: [
      {k:'score', l:'العلامة', t:'number', req:1, min:0},
      {k:'max', l:'من', t:'number', req:1, def:100},
      {k:'date', l:'التاريخ', t:'date', req:1},
      {k:'note', l:'ملاحظات (اختياري)', t:'textarea', full:1}
    ],
    submit: function(x){
      var sc = num(x.score), mx = num(x.max);
      if(mx <= 0) return 'أدخل العلامة العظمى.';
      if(sc > mx) return 'العلامة أكبر من العلامة العظمى.';
      var examId = uid();
      var data = {
        studentId:sid, type:type, score:sc, max:mx, date:x.date,
        note:String(x.note||'').trim(),
        by:SB.user ? SB.user.id : 'local',
        byRole:myRole(), ts:Date.now()
      };
      return Data.put('rashidiExams', examId, data).then(function(){
        toast('سُجّل الاختبار '+(type==='trial'?'التجريبي':'النهائي'));
        if(type === 'final'){
          var pct = Math.round(sc/mx*100);
          if(pct >= 60){
            var exists = S.certificates.find(function(c){
              return c.recipientType==='student' && c.recipientId===sid &&
                (c.kind==='اجتياز اختبار الرشيدي' || c.source==='rashidi-final');
            });
            if(!exists){
              var no = nextCert();
              var certData = {
                recipientType:'student', recipientId:sid,
                kind:'اجتياز اختبار الرشيدي', juz:'',
                date:x.date, signer:'',
                note:'نتيجة اختبار الرشيدي النهائي: '+sc+'/'+mx+' ('+pct+'%)',
                certNo:no, auto:true, source:'rashidi-final'
              };
              Data.put('certificates', uid(), certData).then(function(){
                toast('✓ صدرت الشهادة تلقائياً: '+certNo(no));
              });
            }
          }
        }
      });
    }
  });
}

/* ---------- vPoints ---------- */
function pointsPeriodRange(){
  var k = S.ui.ppd || 'all';
  var t2 = today();
  if(k === 'week'){
    var d = new Date(); d.setDate(d.getDate()-7);
    return {f:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()), t:t2, label:'آخر أسبوع'};
  }
  if(k === 'month'){
    return {f:t2.slice(0,8)+'01', t:t2, label:'هذا الشهر'};
  }
  return {f:'', t:'', label:'كل الفترة'};
}

function vPoints(){
  var pr = pointsPeriodRange();
  var q = (S.ui.pq||'').trim().toLowerCase();
  var pst = S.ui.pst||'', psh = S.ui.psh||'';
  var rows = leaderRows(pr.f, pr.t, function(e){
    if(pst && e.stage !== pst) return false;
    if(psh && e.shift !== psh) return false;
    return true;
  }).filter(function(r){
    if(!q) return true;
    return (r.name+' '+r.no).toLowerCase().indexOf(q) >= 0;
  });
  var mx = Math.max.apply(null, [1].concat(rows.map(function(r){ return r.pt.total; })));

  var h = vh(t('nav.points') || 'النقاط', 'حضور + تسميع + اختبارات + إضافات · '+esc(pr.label),

      '<button type="button" class="btn pri" data-act="newPoints">'+ico('plus')+'إضافة نقاط</button>'));

  h += '<div class="filters">'+
    '<input id="pq" type="search" data-bind="pq" value="'+esc(S.ui.pq||'')+'" placeholder="بحث بالاسم">'+
    '<select id="ppd" data-bind="ppd">'+
      selOpts([['all','كل الفترة'],['month','هذا الشهر'],['week','آخر أسبوع']], S.ui.ppd||'all')+

    '<select id="psh" data-bind="psh">'+selOpts(SHIFTS, psh, 'كل الفترات')+'</select>'+
  '</div>';

  if(!rows.length){
    return h + emptyBox('لا توجد بيانات','سجّل حضوراً أو تسميعاً أو اختبارات.','');
  }

  function cell(v){
    return '<span class="v '+(v>0?'pos':v<0?'neg':'')+'">'+sg(v)+'</span>';
  }
  h += tbl([
    {h:'#', f:function(r){
      var i = rows.indexOf(r);
      return '<span class="rk t'+(i<3?i+1:'')+'">'+(i+1)+'</span>';
    }},
    {h:'الطالب', f:function(r){
      return '<button type="button" class="linkb" data-act="pointsOf" data-id="'+r.sid+'">'+esc(r.name)+'</button>'+
        '<span class="sub">'+esc(r.e.stage+' '+r.e.section+' · '+r.e.shift)+'</span>';
    }},
    {h:'حضور', n:1, f:function(r){ return cell(r.pt.att); }},
    {h:'تسميع', n:1, f:function(r){ return cell(r.pt.rec); }},
    {h:'اختبارات', n:1, f:function(r){ return cell(r.pt.exam); }},
    {h:'إضافات', n:1, f:function(r){ return cell(r.pt.add); }},
    {h:'مكافأة', n:1, f:function(r){ return cell(r.pt.streak); }},
    {h:'المجموع', n:1, f:function(r){
      return '<b>'+fmt(r.pt.total)+'</b>'+
        '<div class="pbar"><i style="width:'+Math.max(0, r.pt.total/mx*100)+'%"></i></div>';
    }}

  return h;

function parseLessonsExcel(rows){
  var byBook = {};
  rows.forEach(function(r){
    var bookName = String(r['الكتاب'] || r['اسم الكتاب'] || r.Book || '').trim();
    var title = String(r['عنوان الدرس'] || r['العنوان'] || r.Title || r['الدرس'] || '').trim();
    if(!bookName || !title) return;
    if(!byBook[bookName]) byBook[bookName] = [];
    byBook[bookName].push({
      order:num(r['رقم الدرس'] || r['الترتيب'] || r.Order || 0),
      title:title,
      pageFrom:num(r['من صفحة'] || r.PageFrom || 0),
      pageTo:num(r['إلى صفحة'] || r.PageTo || 0),
      objectives:String(r['الأهداف'] || r.Objectives || r['أهداف'] || '')
    });
  });
  var preview = Object.keys(byBook).map(function(bn){
    var book = S.books.filter(function(b){ return b.name===bn; })[0];
    return {bookName:bn, matched:!!book, bookId:book?book.id:'', count:byBook[bn].length};
  });
  if(!preview.length){ toast('لم يُعثر على صفوف صالحة.'); return; }
  showLessonsPreview(byBook, preview);
}
function showLessonsPreview(byBook, preview){
  S.ui.__lessonsImport = {byBook:byBook, preview:preview};
  M.push({
    title: 'معاينة استيراد الدروس',
    wide: 1,
    body:function(){
      var p = S.ui.__lessonsImport;
      if(!p) return '<p class="note">لا توجد بيانات.</p>';
      var matched = p.preview.filter(function(x){ return x.matched; });
      var unmatched = p.preview.filter(function(x){ return !x.matched; });
      var s = '<p>كتب صالحة: <b style="color:var(--good)">'+matched.length+'</b> · غير موجودة: <b style="color:var(--bad)">'+unmatched.length+'</b></p>';
      if(matched.length){
        s += '<h3 style="margin-top:12px">كتب موجودة</h3>'+
          '<div class="tw"><table><thead><tr><th>الكتاب</th><th>الدروس</th></tr></thead><tbody>'+
          matched.map(function(x){ return '<tr><td>'+esc(x.bookName)+'</td><td>'+x.count+'</td></tr>'; }).join('')+
          '</tbody></table></div>';
      }
      if(unmatched.length){
        s += '<h3 style="margin-top:12px">كتب غير موجودة</h3>'+
          '<div class="tw"><table><thead><tr><th>الكتاب</th><th>الدروس</th></tr></thead><tbody>'+
          unmatched.map(function(x){ return '<tr><td>'+esc(x.bookName)+'</td><td>'+x.count+'</td></tr>'; }).join('')+
          '</tbody></table></div>';
      }
      s += '<div class="mact" style="margin-top:14px">'+
        '<button type="button" class="btn pri" data-act="doLessonsImport"'+(matched.length?'':' disabled')+'>استيراد '+matched.reduce(function(a,x){ return a+x.count; }, 0)+' درساً</button>'+
        '<button type="button" class="btn" data-act="close">إلغاء</button>'+
      '</div>';
      return s;
    }
  });
}

function audience(aud, stage){
  var out = [];
  if(aud === 'teachers'){
    S.teachers.filter(function(t2){ return t2.status!=='موقوف'; })
      .forEach(function(t2){ out.push({id:t2.id, name:t2.name, phone:t2.phone}); });
  } else if(aud === 'supervisors'){
    S.supervisors.filter(function(t2){ return t2.status!=='موقوف'; })
      .forEach(function(t2){ out.push({id:t2.id, name:t2.name, phone:t2.phone}); });
  } else {
    var Y = curYear();
    S.students.filter(function(s){ return s.status==='مقبول'; }).forEach(function(s){
      if(stage){
        var e = S.enrollments.filter(function(x){
          return x.studentId===s.id && x.year===Y && x.status==='نشط';
        })[0];
        if(!e || e.stage !== stage) return;
      }
      out.push({id:s.id, name:s.name, phone:phoneOfS(s)});
    });
  }
  return out;
}
function msgQueue(){
  var cfg = msgCfg();
  var td = today();
  var mon = td.slice(0,7);
  var items = [];
  var bv = baseVars();
  var sent = {};
  S.msglog.forEach(function(l){ sent[l.id] = 1; });
  function add(key, kind, who, name, phone, text, dueAt){
    items.push({key:key, kind:kind, who:who, name:name, phone:phone, text:text, dueAt:dueAt, sent:!!sent[key]});
  }
  if(cfg.paused) return items;
  var Y = curYear();
  if(cfg.rules.absent.on){
    var marks = D.att[td] || {};
    Object.keys(marks).forEach(function(sid){
      if(marks[sid] !== 'a') return;
      var s = D.sMap[sid]; if(!s) return;
      add('absent_'+td+'_'+sid, 'غياب', 'ولي أمر', s.name, phoneOfS(s),
        fillTpl(cfg.tpl.absent, Object.assign({}, bv, {'الاسم':s.name})),
        td+' '+cfg.rules.absent.time);
    });
  }
  if(cfg.rules.dues.on){
    S.enrollments.filter(function(e){
      return e.year===Y && e.status==='نشط' && bal(e.id) >= num(cfg.rules.dues.minBal||1);
    }).forEach(function(e){
      var s = D.sMap[e.studentId]; if(!s) return;
      add('dues_'+mon+'_'+e.id, 'رسوم', 'ولي أمر', s.name, phoneOfS(s),
        fillTpl(cfg.tpl.dues, Object.assign({}, bv, {'الاسم':s.name, 'المتبقي':fmt(bal(e.id))})),
        td+' '+cfg.rules.dues.time);
    });
  }
  if(cfg.rules.session.on){
    S.sessions.filter(function(x){
      return x.date===td && x.status!=='ملغاة' && x.teacherId;
    }).forEach(function(x){
      var t2 = D.tMap[x.teacherId]; if(!t2) return;
      add('session_'+x.id+'_'+t2.id, 'حصة', 'معلم', t2.name, t2.phone,
        fillTpl(cfg.tpl.session, Object.assign({}, bv, {'الاسم':t2.name, 'الوقت':x.time||'', 'العنوان':x.title||''})),
        addMin(td, x.time||'08:00', -num(cfg.rules.session.lead)));
    });
  }
  S.msgsched.forEach(function(sc){
    if(!sc.when) return;
    var dueAt = String(sc.when).replace('T', ' ');
    audience(sc.aud, sc.stage).forEach(function(r){
      add('sch_'+sc.id+'_'+r.id, 'مجدولة',
        sc.aud==='students'?'ولي أمر':(sc.aud==='teachers'?'معلم':'مشرف'),
        r.name, r.phone,
        fillTpl(sc.text, Object.assign({}, bv, {'الاسم':r.name})),
        dueAt);
    });
  });
  var onLeave = {};
  S.enrollments.forEach(function(e){
    if(e.leave && e.leave.from && e.leave.from <= td && (!e.leave.to || e.leave.to >= td)){
      onLeave[e.studentId] = true;
    }
  });
  return items.filter(function(it){
    if(it.kind !== 'غياب') return true;
    var m = /^absent_[^_]+_(.+)$/.exec(it.key);
    if(!m) return true;
    return !onLeave[m[1]];
  });
}

/* ---------- vNotifs ---------- */
function computeNotifs(){
  var out = [];
  var today0 = today();
  var now = new Date();
  var y = now.getFullYear();
  var m = pad(now.getMonth()+1);
  var d = pad(now.getDate());
  var sevenDaysAgo = (function(){
    var x = new Date(); x.setDate(x.getDate()-7);
    return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
  })();
  var notifsCfg = Object.assign({}, DEF.notifs, S.settings.notifs || {});
  var inact = Object.assign({}, DEF.notifs.inactivity, (notifsCfg.inactivity||{}));
  var role = myRole();
  var lvl = myLevel();
  function add(id, kind, title, desc, link){ out.push({id:id, kind:kind, title:title, desc:desc, link:link, date:today0}); }
  if(lvl >= 2){
    var marks = D.att[today0] || {};
    var absCount = 0;
    Object.keys(marks).forEach(function(sid){ if(marks[sid]==='a') absCount++; });
    if(absCount > 0){
      add('abs_'+today0, 'غياب', absCount+' طالب غائب اليوم', 'راجع الحضور', {act:'nav', v:'att'});
    }
  }
  if(lvl >= 2){
    var stale = 0;
    S.enrollments.filter(function(e){ return e.year===curYear() && e.status==='نشط'; })
      .forEach(function(e){
        var last = lastOf(e.studentId);
        if(!last.read || last.read.d < sevenDaysAgo) stale++;
      });
    if(stale > 0){
      add('stale_rec_'+today0, 'تسميع', stale+' طالب بلا تسميع منذ أسبوع', 'تواصل مع أولياء الأمور', {act:'nav', v:'quran'});
    }
  }
  if(!S.settings.hideFinance && lvl >= 3){
    var overdue = 0, overdueSum = 0;
    S.enrollments.filter(function(e){
      return e.year===curYear() && e.status==='نشط' && bal(e.id) > 0;
    }).forEach(function(e){
      overdue++;
      overdueSum += Math.max(0, bal(e.id));
    });
    if(overdue > 0){
      add('dues_'+m, 'رسوم', overdue+' طالب متبقٍ عليه', 'المجموع: '+fmt(overdueSum), {act:'nav', v:'fees'});
    }
  }
  if(role === 'teacher'){
    var tid = (S.profile && S.profile.teacher_id) || '';
    if(tid){
      var t2 = D.tMap[tid];
      var myBooks = (t2 && t2.selectedBooks) || [];
      var dueBooks = [];
      myBooks.forEach(function(bid){
        var next = nextLessonFor(tid, bid);
        if(next && next.title) dueBooks.push(next.title);
      });
      if(dueBooks.length){
        add('lessons_'+today0, 'دروس', dueBooks.length+' درساً قادماً', dueBooks.slice(0,3).join(' · '), {act:'nav', v:'books'});
      }
    }
  }
  if(lvl >= 3){
    var weekSess = S.sessions.filter(function(x){
      return x.date >= sevenDaysAgo && x.status !== 'ملغاة';
    }).length;
    if(weekSess === 0){
      add('no_sess_'+today0, 'حصص', 'لا حصص هذا الأسبوع', 'تأكد من المتابعة', {act:'nav', v:'sessions'});
    }
  }
  var myLast = S.user && S.user.last_seen;
  if(myLast && inact[role]){
    var daysAgo = Math.floor((Date.now() - new Date(myLast).getTime())/86400000);
    if(daysAgo >= num(inact[role])){
      add('inactivity_'+role+'_'+today0, 'تذكير', 'لم تفتح التطبيق منذ '+daysAgo+' أيام', 'راجع مهامك', null);
    }
  }
  if(lvl >= 5){
    var pending = (SB.users||[]).filter(function(u){ return u.role==='pending'; }).length;
    if(pending > 0){
      add('pending_'+today0, 'إدارة', pending+' مستخدم بانتظار الموافقة', 'افتح «الحسابات»', {act:'nav', v:'acc'});
    }
  }
  var readSet = {};
  S.notifications.filter(function(n){ return n.date===today0; })
    .forEach(function(n){ readSet[n.id] = 1; });
  out.forEach(function(it){ if(readSet[it.id]) it.read = true; });
  return out;
}

  if(!list.length){

function updateNotifCount(){
  var el = $('#notifCount');
  if(!el) return;
  try {
    var list = computeNotifs();
    var unread = list.filter(function(n){ return !n.read; }).length;
    if(unread > 0){
      el.textContent = unread > 99 ? '99+' : String(unread);
      el.hidden = false;
    } else {
      el.hidden = true;
    }
  } catch(e){}
}

function vWeek(){
  var start = S.ui.weekStart || weekStart();
  var end = addDays(start, 6);
  var tid = myRole()==='teacher' ? myTeacherId() : '';
  var cid = myRole()==='cs' ? myCenterId() : '';
  var sessions = S.sessions.filter(function(x){
    if(x.date < start || x.date > end) return false;
    if(x.status === 'ملغاة') return false;
    if(tid && x.teacherId !== tid) return false;
    return true;
  });
  var days = range(0,6).map(function(i){ return addDays(start, i); });
  var h = vh('الجدول الأسبوعي',
    gregDate(start)+' — '+gregDate(end),
    '<button type="button" class="btn" data-act="weekPrev">'+ico('x')+'السابق</button>'+
    '<button type="button" class="btn" data-act="weekToday">اليوم</button>'+
    '<button type="button" class="btn" data-act="weekNext">التالي</button>'+
    W('<button type="button" class="btn pri" data-act="newSession">'+ico('plus')+'حصة</button>'));

  h += '<div class="week-grid">';
  days.forEach(function(d){
    var daySess = sessions.filter(function(x){ return x.date===d; });
    var hd = hijriFromIso(d);
    var isToday = d===today();
    h += '<div class="week-day"'+(isToday?' style="border:2px solid var(--accent)"':'')+'>'+
      '<h4>'+
        esc(WEEKDAYS_AR[new Date(d).getDay()])+
        '<br><small style="font-weight:400;color:var(--ink-2)">'+d.slice(8)+'</small>'+
        (hd?'<br><small style="font-weight:400;color:var(--ink-2);font-size:10px">'+hd.d+' '+HIJRI_MONTHS[hd.m-1]+'</small>':'')+
      '</h4>';
    if(daySess.length){
      daySess.slice(0,4).forEach(function(x){
        var t2 = SESS_TYPES[x.type] || {ar:x.type};
        var cls = x.status==='تمت' ? 'week-sess' : 'week-sess muted';
        h += '<div class="'+cls+'" data-act="openSession" data-id="'+x.id+'" title="'+esc(x.title||t2.ar)+'">'+
          esc((x.time||'').slice(0,5)+' '+t2.ar)+
        '</div>';
      });
      if(daySess.length > 4){
        h += '<div class="note" style="font-size:10px;text-align:center;margin-top:4px">+'+(daySess.length-4)+' أخرى</div>';
      }
    } else {
      h += '<div class="note" style="font-size:11px;text-align:center;color:var(--ink-2);padding:14px 0">لا حصص</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function vQuizTake(){
  var qs = S.ui.quiz;

  if(!q) return vQuiz();
  var h = vh('اختبار — '+(EXAM_TYPES[qs.topic]||qs.topic),
    'السؤال '+(qs.idx+1)+' من '+bank.length,
    '<button type="button" class="btn" data-act="cancelQuiz">'+ico('x')+'إلغاء</button>');
  h += '<div class="card"><h2 style="margin-bottom:16px">'+esc(q.q)+'</h2><div class="cfg">'+
    q.o.map(function(opt, i){
      var sel = qs.answers[qs.idx] === i;
      return '<button type="button" class="btn '+(sel?'pri':'')+'" style="text-align:start;padding:14px;justify-content:flex-start" '+
        'data-act="quizAnswer" data-idx="'+i+'">'+
        (sel?'✓ ':'')+esc(opt)+
      '</button>';
    }).join('')+
  '</div><div class="btns" style="margin-top:14px">'+
    (qs.answers[qs.idx] != null
      ? '<button type="button" class="btn pri" data-act="quizNext">'+ico('check')+(qs.idx===bank.length-1?'إنهاء':'التالي')+'</button>'
      : '')+
  '</div></div>';

function vQuizResult(){
  var qs = S.ui.quiz;
  var bank = EXAMS_BANK[qs.topic] || [];
  var total = bank.length;
  var correct = 0;
  bank.forEach(function(q, i){ if(qs.answers[i]===q.a) correct++; });
  var pct = Math.round(correct/total*100);
  var h = vh('نتيجة الاختبار',
    (EXAM_TYPES[qs.topic]||qs.topic)+' · '+correct+' / '+total,

function predictDropout(sid){
  var Y = curYear();
  var e = S.enrollments.filter(function(x){
    return x.studentId===sid && x.year===Y && x.status==='نشط';
  })[0];
  if(!e) return null;
  var risk = 0, reasons = [];
  var wa = new Date(); wa.setDate(wa.getDate()-30);
  var waStr = wa.getFullYear()+'-'+pad(wa.getMonth()+1)+'-'+pad(wa.getDate());
  var tm = today();
  var p=0, l=0, a=0;
  D.classDates.forEach(function(d){
    if(d < waStr || d > tm) return;
    var st = D.att[d][sid];
    if(st==='p') p++;
    else if(st==='l') l++;
    else if(st==='a') a++;
  });
  var totalDays = p+l+a;
  var attRate = totalDays>0 ? (p+0.5*l)/totalDays : 1;
  if(totalDays>=5 && attRate<0.5){ risk+=40; reasons.push('حضور ضعيف '+Math.round(attRate*100)+'%'); }
  else if(totalDays>=5 && attRate<0.75){ risk+=20; reasons.push('حضور متوسط '+Math.round(attRate*100)+'%'); }
  var last = lastOf(sid);
  if(!last.read || last.read.d < waStr){
    risk+=30; reasons.push('لا تسميع منذ 30 يوماً');
  } else if(last.read.d < (function(){ var x=new Date(); x.setDate(x.getDate()-14); return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()); })()){
    risk+=15; reasons.push('تسميع متأخر');
  }
  var ptNow = pointsOf(sid, waStr, tm);
  var ptPrev = pointsOf(sid, addDays(waStr, -30), waStr);
  if(ptPrev.total>10 && ptNow.total < ptPrev.total*0.5){ risk+=20; reasons.push('تراجع النقاط'); }
  if(!S.settings.hideFinance && bal(e.id)>0){ risk+=10; reasons.push('رسوم متأخرة'); }
  return {risk:Math.min(100, risk), level: risk>=60?'high':risk>=30?'medium':'low', reasons:reasons, enrollment:e};
}
