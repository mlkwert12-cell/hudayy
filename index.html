/* ============================================================
   sessionEnrolls
   ============================================================ */
function sessionEnrolls(st){
  if(!st.stage||!st.section||!st.shift)return [];
  var Y=curYear();
  return S.enrollments.filter(function(e){
    return e.year===Y&&e.status==='نشط'&&
      e.stage===st.stage&&e.section===st.section&&e.shift===st.shift&&
      (!st.teacherId||e.teacherId===st.teacherId);
  }).sort(byName);
}

ACT.newSession=function(d){
  if(!canWrite())return;
  var role=myRole();
  if(role==='teacher'&&!effectiveTeacherId()){toast('حسابك غير مرتبط بمعلم.');return;}
  if(role==='cs'&&!canTeach()){toast('ليست لديك حلقة مُكلَّف بها.');return;}

  var st=newSessionState();
  if(d&&d.book){
    st.bookId=d.book;
    st.type='musahib';
    if(st.teacherId){
      var next=nextLessonFor(st.teacherId,d.book);
      if(next){st.lessonId=next.id;st.lessonOrder=num(next.order);st.title=next.title||'';}
    }
  }
  S.ui.session=st;
  S.ui.openSessionId='new';
  render();
  window.scrollTo(0,0);
};

ACT.openSession=function(d){
  var s=find('sessions',d.id); if(!s)return;
  var st={
    id:s.id, type:s.type||'talqeen',
    date:s.date, time:s.time||'', round:s.round||1,
    title:s.title||'', teacherId:s.teacherId||'',
    stage:s.stage||'', section:s.section||'', shift:s.shift||'',
    status:s.status||'مجدولة',
    bookId:s.bookId||'', lessonId:s.lessonId||'', lessonOrder:s.lessonOrder||0,
    pageFrom:s.pageFrom||0, pageTo:s.pageTo||0,
    content:s.content||'',
    attendance:{}, recitations:[],
    notes:Object.assign({},s.notes||{}),
    creditToStudents:!!s.creditToStudents
  };
  var valid={};
  sessionEnrolls(st).forEach(function(e){valid[e.studentId]=true;});
  var allMarks=D.att[s.date]||{};
  Object.keys(allMarks).forEach(function(sid){
    if(valid[sid])st.attendance[sid]=allMarks[sid];
  });
  S.ui.session=st;
  S.ui.openSessionId=s.id;
  render();
  window.scrollTo(0,0);
};

ACT.closeSession=function(){
  S.ui.session=null;
  S.ui.openSessionId='';
  render();
};

ACT.delSession=function(d){
  var s=find('sessions',d.id); if(!s)return;
  confirmBox('حذف الحصة','ستُحذف حصة «'+s.title+'» بتاريخ '+s.date+'.','حذف',function(){

ACT.sessAllPresent=function(){
  if(!S.ui.session)return;
  var st=S.ui.session;
  var students=sessionEnrolls(st);
  if(!students.length){toast('لا يوجد طلاب.');return;}
  students.forEach(function(e){st.attendance[e.studentId]='p';});
  render();
  toast('حُضّر الجميع');
};

ACT.sessAddRec=function(d){
  if(!S.ui.session)return;
  var st=S.ui.session;
  var existing=st.recitations.find(function(r){return r.sid===d.sid;});
  var suggested=num(d.suggest)||1;

  M.push({
    title:'تسميع — '+sName(d.sid),
    values:existing||{fromPage:suggested,toPage:'',g:'good',note:''},
    fields:[
      {k:'fromPage',l:'من صفحة',t:'number',req:1,min:1,max:604},
      {k:'toPage',l:'إلى صفحة',t:'number',min:1,max:604},
      {k:'g',l:'التقدير',t:'select',o:[['good','جيد'],['vgood','جيد جداً'],['excellent','ممتاز'],['redo','إعادة']]},
      {k:'note',l:'ملاحظة',full:1}
    ],
    submit:function(x){
      var from=Math.round(num(x.fromPage));
      var to=(x.toPage===''||x.toPage==null)?from:Math.round(num(x.toPage));
      if(from<1||from>604)return 'الصفحة بين 1 و604.';
      if(to<from)return 'الصفحة الأخيرة قبل الأولى.';
      if(to-from>=60)return 'الحد 60 صفحة في الجلسة.';
      st.recitations=st.recitations.filter(function(r){return r.sid!==d.sid;});
      st.recitations.push({sid:d.sid,fromPage:from,toPage:to,g:x.g,note:x.note||''});
      toast('أُضيف التسميع — لا تنسَ حفظ الحصة');
    }
  });
};

/* ============================================================
   ACT.saveSession — الحفظ الشامل
   ============================================================ */
ACT.saveSession=function(){
  if(!canWrite())return;
  var st=S.ui.session; if(!st)return;

  if(!st.stage||!st.section||!st.shift){toast('اختر المرحلة والقسم والفترة.');return;}
  if(!st.title)st.title=(SESS_ROUNDS[st.round-1]||'حصة')+' — '+st.date;

  var students=sessionEnrolls(st);
  if(!students.length){toast('لا يوجد طلاب في هذه الفئة.');return;}

  var valid={};
  students.forEach(function(e){valid[e.studentId]=true;});

  var marks={};
  Object.keys(st.attendance).forEach(function(sid){
    if(st.attendance[sid]&&valid[sid])marks[sid]=st.attendance[sid];
  });

  var sessionId=st.id||uid();
  var sessionDoc={
    type:st.type, date:st.date, time:st.time, round:st.round,
    title:st.title, teacherId:st.teacherId,
    stage:st.stage, section:st.section, shift:st.shift,
    status:'تمت',
    bookId:st.bookId||'', lessonId:st.lessonId||'',
    lessonOrder:st.lessonId&&D.lessonMap[st.lessonId]?num(D.lessonMap[st.lessonId].order):0,
    pageFrom:st.pageFrom||0, pageTo:st.pageTo||0,
    content:st.content||'', notes:st.notes||{},
    creditToStudents:!!st.creditToStudents,
    attendanceCount:{p:0,l:0,a:0},
    recitationsCount:st.recitations.length,
    savedAt:Date.now(),
    savedBy:SB.user?SB.user.id:'local'
  };
  Object.keys(marks).forEach(function(sid){
    sessionDoc.attendanceCount[marks[sid]]=(sessionDoc.attendanceCount[marks[sid]]||0)+1;
  });

  var promises=[];

  if(Object.keys(marks).length){
    promises.push(Data.mergeMarks('attendance',st.date,marks));
  }

  st.recitations.forEach(function(r){
    var sessId=sessionId;
    promises.push(saveProg(r.sid,function(p){
      p.rec=p.rec.filter(function(x){return x.sessionId!==sessId;});
      for(var pn=r.fromPage;pn<=r.toPage;pn++){
        var jp=absToJP(pn);
        p.rec.push({
          id:uid(), d:st.date, juz:jp.juz, page:jp.page,
          g:r.g, t:'new', note:r.note||'', sessionId:sessId,
          ts:Date.now()+pn
        });
      }
    }));
  });

  if(st.creditToStudents&&st.pageFrom&&st.pageTo){
    Object.keys(marks).forEach(function(sid){
      if(marks[sid]!=='p'&&marks[sid]!=='l')return;
      var sessId=sessionId;
      promises.push(saveProg(sid,function(p){
        p.rec=p.rec.filter(function(x){return x.sessionId!==sessId;});
        for(var pn=st.pageFrom;pn<=st.pageTo;pn++){
          var jp=absToJP(pn);
          p.rec.push({
            id:uid(), d:st.date, juz:jp.juz, page:jp.page,
            g:'good', t:'new', note:'', sessionId:sessId,
            ts:Date.now()+pn
          });
        }
      }));
    });
  }

  promises.push(Data.put('sessions',sessionId,sessionDoc));

  Promise.all(promises).then(function(){
    toast('حُفظت الحصة مع الحضور'+(st.recitations.length?' والتسميع':''));
    S.ui.session=null;
    S.ui.openSessionId='';
    render();
  },function(e){toast(errMsg(e));});
};

   ============================================================ */
document.addEventListener('input',function(ev){
  if(!S.ui.session)return;
  var t2=ev.target;
  var k=t2.getAttribute&&t2.getAttribute('data-sess');

  if(k){
    if(t2.type==='checkbox')S.ui.session[k]=t2.checked;
    else if(k==='round')S.ui.session[k]=num(t2.value)||1;
    else S.ui.session[k]=t2.value;

    var needsRender=['stage','section','shift','round','bookId','lessonId'].indexOf(k)>=0;

    if(k==='bookId'){
      S.ui.session.lessonId='';
      S.ui.session.lessonOrder=0;
      if(t2.value&&S.ui.session.teacherId){
        var next=nextLessonFor(S.ui.session.teacherId,t2.value);
        if(next){
          S.ui.session.lessonId=next.id;
          S.ui.session.lessonOrder=num(next.order);
          if(!S.ui.session.title)S.ui.session.title=next.title||'';
        }
      }
      needsRender=true;
    }

    if(k==='lessonId'&&t2.value){
      var l=D.lessonMap[t2.value];
      if(l){
        S.ui.session.lessonOrder=num(l.order);
        if(!S.ui.session.pageFrom&&l.pageFrom)S.ui.session.pageFrom=l.pageFrom;
        if(!S.ui.session.pageTo&&l.pageTo)S.ui.session.pageTo=l.pageTo;
      }
    }

    if(needsRender)render();
    return;
  }

  var nk=t2.getAttribute&&t2.getAttribute('data-sess-note');
  if(nk){S.ui.session.notes[nk]=t2.value;}
},true);

    '<span class="pill warn">متأخر '+c.l+'</span>'+
    '<span class="pill bad">غائب '+c.a+'</span>'+
    '<span class="pill">غير محدد '+c.u+'</span>'+

function pointsPeriodRange(){

/* ============================================================
   computeBadges
   ============================================================ */
function computeBadges(sid){
  var badges=[];
  var mm=memoOf(sid);
  var pt=pointsOf(sid,'','');
  var ro=rashOf(sid);

  if(mm.done>=1)badges.push({title:'أتمّ جزءاً',desc:mm.done+' جزءاً',icon:'quran'});
  if(mm.done>=5)badges.push({title:'حافظ متميز',desc:'5 أجزاء',icon:'quran'});
  if(mm.done>=10)badges.push({title:'حافظ متقدم',desc:'10 أجزاء',icon:'quran'});
  if(mm.done>=20)badges.push({title:'حافظ معظم القرآن',desc:'20 جزءاً',icon:'quran'});
  if(mm.done>=30)badges.push({title:'ختم القرآن',desc:'30 جزءاً',icon:'cert',gold:true});

  if(pt.p>=30)badges.push({title:'مواصل',desc:pt.p+' حضور',icon:'att'});
  if(pt.p>=100)badges.push({title:'منتظم',desc:pt.p+' حضور',icon:'att'});

  if(pt.total>=100)badges.push({title:'100 نقطة',desc:'إنجاز',icon:'star'});
  if(pt.total>=500)badges.push({title:'500 نقطة',desc:'إنجاز متميز',icon:'star',gold:true});
  if(pt.total>=1000)badges.push({title:'1000 نقطة',desc:'نجم',icon:'star',gold:true});

  if(pt.nRec>=50)badges.push({title:'مجتهد',desc:pt.nRec+' تسميعة',icon:'quran'});
  if(pt.nRec>=100)badges.push({title:'مثابر',desc:pt.nRec+' تسميعة',icon:'quran'});
  if(pt.nRec>=300)badges.push({title:'تسميع وفير',desc:pt.nRec+' تسميعة',icon:'quran',gold:true});

  if(ro.done>=RLESSONS)badges.push({title:'ختم الرشيدي',desc:'إتمام الكتاب',icon:'quranbook',gold:true});

  if(pt.streak>=15)badges.push({title:'سلسلة الحضور',desc:'حضور متواصل',icon:'att'});

  return badges;
}

/* ============================================================
   vRash — صفحة الرشيدي
   ============================================================ */
function vRash(){
  var list=S.students.filter(function(s){
    return s.status==='مقبول'&&(s.track||'القرآن الكريم')==='الرشيدي';
  }).sort(function(a,b){return a.name<b.name?-1:1;});

  var h=vh(t('nav.rash')||'الرشيدي',
    'الكتاب الرشيدي · '+RASHIDI_PAGES+' صفحة · اختبار تجريبي (معلم) + نهائي (مشرف)',
    W('<button type="button" class="btn pri" data-act="newRash">'+ico('plus')+'تسميع جديد</button>'));

  if(!list.length){
    return h+emptyBox('لا يوجد طلاب في مسار الرشيدي',
      'اختر «الرشيدي» في نوع الدراسة عند إضافة الطالب أو تعديله، ثم يظهر هنا.','');
  }

  var sid=S.ui.rashSid;
  if(!sid||!list.some(function(x){return x.id===sid;}))sid=list[0].id;

  var st=rashOf(sid);
  var exam=rashExamStatus(sid);
  var s=D.sMap[sid];

  h+='<div class="filters">'+
    '<select id="rashSid" data-bind="rashSid">'+
      selOpts(list.map(function(x){return [x.id,x.no+' — '+x.name];}),sid)+
    '</select>'+
  '</div>';

  h+='<section class="kpis">'+
    '<div class="kpi"><small>الصفحات المنجزة</small><b>'+st.done+'</b><i>من '+RASHIDI_PAGES+'</i></div>'+
    '<div class="kpi"><small>نسبة الإنجاز</small><b>'+st.pct+'%</b><i>'+esc(s.name)+'</i></div>'+
    '<div class="kpi"><small>آخر صفحة</small><b>'+(st.reached||'—')+'</b><i>'+(st.last?esc(GRADES[st.last.g])+' · '+esc(st.last.d):'لم يبدأ')+'</i></div>'+
    '<div class="kpi"><small>الاختبار النهائي</small><b>'+(exam.finalPct!=null?exam.finalPct+'%':'—')+'</b><i>'+(exam.passed?'✓ ناجح':exam.bestFinal?'لم يُجز':'لم يُجرَ')+'</i></div>'+
  '</section>';

  h+='<div class="card"><div class="prow"><span>التقدم العام</span><b class="num">'+st.done+' / '+RASHIDI_PAGES+'</b></div>'+
    '<div class="ptrack"><span style="width:'+st.pct+'%"></span></div></div>';

  h+='<div class="card"><h2>الصفحات ('+RASHIDI_PAGES+')</h2>'+
    '<div class="legend" style="margin:10px 0">'+
      '<span class="pg" style="padding:2px 10px;font-size:12px">لم تُسمَّع</span>'+
      '<span class="pg g-good" style="padding:2px 10px;font-size:12px">ج جيد</span>'+
      '<span class="pg g-vgood" style="padding:2px 10px;font-size:12px">جج جيد جداً</span>'+
      '<span class="pg g-excellent" style="padding:2px 10px;font-size:12px">م ممتاز</span>'+
      '<span class="pg g-redo" style="padding:2px 10px;font-size:12px">إعادة</span>'+
    '</div>'+
    '<div class="pages">'+
      range(1,RASHIDI_PAGES).map(function(pg){
        var ev=st.pages[pg];
        return '<button type="button" class="pg'+(ev?' g-'+ev.g:'')+'" '+
          'data-act="pickRashPage" data-s="'+esc(sid)+'" data-p="'+pg+'" '+
          'aria-label="صفحة '+pg+(ev?' '+GRADES[ev.g]:'')+'"'+(canWrite()?'':' disabled')+'>'+
          pg+'<small>'+(ev?GRADES_SHORT[ev.g]:'')+'</small>'+
        '</button>';
      }).join('')+
    '</div>'+
  '</div>';

  if(st.completed){
    h+='<div class="card" style="border:2px solid var(--accent)">'+
      '<h2 style="color:var(--accent)">'+ico('check')+' الطالب أتمّ '+RASHIDI_PAGES+' صفحة — جاهز للاختبار</h2>'+
      '<div class="btns" style="margin-top:12px">'+
        W('<button type="button" class="btn" data-act="newRashExam" data-s="'+esc(sid)+'" data-t="trial">'+ico('plus')+'اختبار تجريبي (معلم)</button>')+
        (isAtLeast(3)?
          '<button type="button" class="btn pri" data-act="newRashExam" data-s="'+esc(sid)+'" data-t="final">'+ico('cert')+'اختبار نهائي (مشرف)</button>'
          :'')+
      '</div>'+
    '</div>';
  }

  if(exam.trials.length||exam.finals.length){
    h+='<div class="card"><h2>سجل الاختبارات</h2>';

    if(exam.trials.length){
      h+='<h3 style="margin:10px 0 6px;font-size:14px">تجريبية ('+exam.trials.length+')</h3>'+
        '<div class="list">'+exam.trials.map(function(t2){
          var pct=Math.round(num(t2.score)/(num(t2.max)||100)*100);
          return '<div class="li">'+
            '<div>'+
              '<span class="pill '+(pct>=60?'good':'warn')+'">'+pct+'%</span> '+
              fmt(t2.score)+' / '+fmt(t2.max)+
              '<small>'+esc(t2.date)+(t2.note?' · '+esc(t2.note):'')+'</small>'+
            '</div>'+
            W(' <button type="button" class="ibtn" data-act="delRashExam" data-id="'+t2.id+'" aria-label="حذف">'+ico('trash')+'</button>')+
          '</div>';
        }).join('')+'</div>';
    }

    if(exam.finals.length){
      h+='<h3 style="margin:10px 0 6px;font-size:14px">نهائية ('+exam.finals.length+')</h3>'+
        '<div class="list">'+exam.finals.map(function(f){
          var pct=Math.round(num(f.score)/(num(f.max)||100)*100);
          return '<div class="li">'+
            '<div>'+
              '<span class="pill '+(pct>=60?'good':'bad')+'">'+pct+'%</span> '+
              fmt(f.score)+' / '+fmt(f.max)+
              '<small>'+esc(f.date)+(f.note?' · '+esc(f.note):'')+'</small>'+
            '</div>'+
            (isAtLeast(3)?'<button type="button" class="ibtn" data-act="delRashExam" data-id="'+f.id+'" aria-label="حذف">'+ico('trash')+'</button>':'')+
          '</div>';
        }).join('')+'</div>';
    }

    h+='</div>';
  }

  var recent=st.evs.slice().sort(function(a,b){
    return (b.ts||0)-(a.ts||0)||(a.d<b.d?1:-1);
  }).slice(0,10);

  if(recent.length){
    h+='<div class="card"><h2>آخر التسميعات</h2><div class="list">'+
      recent.map(function(e){
        var pg=num(e.page)||num(e.item);
        return '<div class="li">'+
          '<div>صفحة '+pg+
            ' <span class="pill '+(e.g==='redo'?'warn':'acc')+'">'+GRADES[e.g]+'</span>'+
            '<small>'+esc(e.d)+(e.note?' · '+esc(e.note):'')+'</small>'+
          '</div>'+
          W('<button type="button" class="ibtn" data-act="delRash" data-s="'+esc(sid)+'" data-id="'+e.id+'" aria-label="حذف">'+ico('trash')+'</button>')+
        '</div>';
      }).join('')+'</div></div>';
  }

  if(isAtLeast(3)&&st.completed&&exam.passed){
    h+='<div class="card"><h2>الانتقال إلى القرآن الكريم</h2>'+
      '<p class="note">الطالب أتمّ الرشيدي ونجح في الاختبار النهائي. جاهز للانتقال إلى مسار القرآن (604 صفحة).</p>'+
      '<div class="btns" style="margin-top:10px">'+
        '<button type="button" class="btn pri" data-act="toQuranTrack" data-s="'+esc(sid)+'">نقل إلى القرآن الكريم</button>'+
      '</div>'+
    '</div>';
  }

  return h;
}
VIEWS.rash=vRash;

/* ============================================================
   rashForm
   ============================================================ */
function rashForm(sid,page){
  var st=sid?rashOf(sid):null;
  var suggested=page||(st?Math.min(RASHIDI_PAGES,st.done+1):1);

  M.push({
    title:'تسميع الرشيدي',
    values:{studentId:sid||'',page:suggested,g:'good',d:today()},
    fields:[
      {k:'studentId',l:'الطالب',t:'select',req:1,full:1,
        o:[['','اختر الطالب…']].concat(
          S.students.filter(function(s){
            return s.status==='مقبول'&&(s.track||'القرآن الكريم')==='الرشيدي';
          }).sort(function(a,b){return a.name<b.name?-1:1;})
          .map(function(s){return [s.id,s.no+' — '+s.name];})
        )},
      {k:'page',l:'الصفحة (1–'+RASHIDI_PAGES+')',t:'number',req:1,min:1,max:RASHIDI_PAGES},
      {k:'g',l:'النتيجة',t:'select',o:[
        ['good','جيد'],['vgood','جيد جداً'],['excellent','ممتاز'],['redo','إعادة']
      ]},
      {k:'d',l:'التاريخ',t:'date',req:1},
      {k:'note',l:'ملاحظة المعلم',full:1}
    ],
    submit:function(x){
      if(!x.studentId)return 'اختر الطالب.';
      var pg=Math.round(num(x.page));
      if(pg<1||pg>RASHIDI_PAGES)return 'الصفحة بين 1 و'+RASHIDI_PAGES+'.';
      return saveProg(x.studentId,function(p){
        p.rash=(p.rash||[]).filter(function(e){
          return (num(e.page)||num(e.item))!==pg;
        });
        p.rash.push({
          id:uid(),d:x.d,page:pg,g:x.g,
          note:String(x.note||'').trim(),ts:Date.now()
        });
      }).then(function(){
        S.ui.rashSid=x.studentId;
        toast('سُجّلت صفحة '+pg);
      });
    }
  });
}

/* ============================================================
   rashExamForm
   ============================================================ */
function rashExamForm(sid,type){
  var st=rashOf(sid);
  if(!st.completed){
    toast('يجب إتمام جميع الصفحات ('+RASHIDI_PAGES+') أولاً.');
    return;
  }

  if(type==='final'&&!isAtLeast(3)){
    toast('الاختبار النهائي متاح للمشرف فما فوق.');
    return;
  }

  var s=D.sMap[sid];

  M.push({
    title:(type==='trial'?'اختبار تجريبي':'اختبار نهائي')+' — '+(s?s.name:''),
    values:{score:'',max:100,date:today()},
    fields:[
      {k:'score',l:'العلامة',t:'number',req:1,min:0},
      {k:'max',l:'من',t:'number',req:1,def:100},
      {k:'date',l:'التاريخ',t:'date',req:1},
      {k:'note',l:'ملاحظات (اختياري)',t:'textarea',full:1}
    ],
    submit:function(x){
      var sc=num(x.score), mx=num(x.max);
      if(mx<=0)return 'أدخل العلامة العظمى.';
      if(sc>mx)return 'العلامة أكبر من العلامة العظمى.';

      var examId=uid();
      var data={
        studentId:sid,type:type,score:sc,max:mx,date:x.date,
        note:String(x.note||'').trim(),
        by:SB.user?SB.user.id:'local',
        byRole:myRole(),ts:Date.now()
      };

      return Data.put('rashidiExams',examId,data).then(function(){
        toast('سُجّل الاختبار '+(type==='trial'?'التجريبي':'النهائي'));

        if(type==='final'){
          var pct=Math.round(sc/mx*100);
          if(pct>=60){
            var exists=S.certificates.find(function(c){
              return c.recipientType==='student'&&c.recipientId===sid&&
                (c.kind==='اجتياز اختبار الرشيدي'||c.source==='rashidi-final');
            });
            if(!exists){
              var no=nextCert();
              var certData={
                recipientType:'student',recipientId:sid,
                kind:'اجتياز اختبار الرشيدي',juz:'',
                date:x.date,signer:'',
                note:'نتيجة اختبار الرشيدي النهائي: '+sc+'/'+mx+' ('+pct+'%)',
                certNo:no,auto:true,source:'rashidi-final'
              };
              Data.put('certificates',uid(),certData).then(function(){
                toast('✓ صدرت الشهادة تلقائياً: '+certNo(no));
              });
            }
          }
        }
      });
    }
  });
}

ACT.newRash=function(d){
  if(!canWrite())return;
  rashForm(d&&d.s,d&&d.p?num(d.p):null);
};
ACT.pickRashPage=function(d){
  if(!canWrite())return;
  rashForm(d.s,num(d.p));
};
ACT.delRash=function(d){
  if(!canWrite())return;
  confirmBox('حذف التسميع','ستُحذف هذه الصفحة من سجل الرشيدي.','حذف',function(){
    saveProg(d.s,function(p){
      p.rash=(p.rash||[]).filter(function(e){return e.id!==d.id;});
    }).then(function(){toast('حُذفت');},function(e){toast(errMsg(e));});
  });
};
ACT.newRashExam=function(d){
  if(!canWrite())return;
  rashExamForm(d.s,d.t);
};
ACT.delRashExam=function(d){
  if(!canWrite())return;
  var e=S.rashidiExams.find(function(x){return x.id===d.id;});
  if(!e)return;
  if(e.type==='final'&&!isAtLeast(3))return;
  confirmBox('حذف الاختبار','سيُحذف سجل هذا الاختبار نهائياً.','حذف',function(){
    Data.del('rashidiExams',e.id).then(function(){toast('حُذف');},function(er){toast(errMsg(er));});
  });
};

ACT.toQuranTrack=function(d){
  if(!isAtLeast(3))return;
  var s=find('students',d.s);
  if(!s)return;
  if((s.track||'القرآن الكريم')!=='الرشيدي'){
    toast('هذا الطالب ليس في مسار الرشيدي.');
    return;
  }
  confirmBox('نقل إلى القرآن الكريم',
    'سيُنقل «'+s.name+'» إلى مسار القرآن الكريم (604 صفحة). يبقى سجل الرشيدي محفوظاً.',
    'نقل',
    function(){
      Data.put('students',s.id,Object.assign({},s,{
        track:'القرآن الكريم',
        trackLog:(s.trackLog||[]).concat([{from:'الرشيدي',to:'القرآن الكريم',date:today()}])
      })).then(function(){toast('نُقل الطالب');},function(e){toast(errMsg(e));});
    });
};

/* ============================================================
   vQuran — صفحة القرآن
   ============================================================ */
function vQuran(){
  var list=S.students.filter(function(s){
    return s.status==='مقبول'&&(s.track||'القرآن الكريم')==='القرآن الكريم';
  }).sort(function(a,b){return a.name<b.name?-1:1;});

  var h=vh(t('nav.quran')||'الحفظ والتسميع',
    'مصحف المدينة · 604 صفحة · 30 جزءاً',
    W('<button type="button" class="btn pri" data-act="newRec">'+ico('plus')+'تسميع جديد</button>'));

  if(!list.length){
    return h+emptyBox('لا يوجد طلاب في مسار القرآن',
      'الطلاب المسجلون في مسار الرشيدي يظهرون في صفحة الرشيدي.',
      '<button type="button" class="btn" data-act="nav" data-v="rash">الرشيدي</button>');
  }

  var sid=S.ui.quranSid;
  if(!sid||!list.some(function(x){return x.id===sid;}))sid=list[0].id;

  var mm=memoOf(sid);
  var s=D.sMap[sid];
  var last=lastOf(sid);

  h+='<div class="filters">'+
    '<select id="quranSid" data-bind="quranSid">'+
      selOpts(list.map(function(x){return [x.id,x.no+' — '+x.name];}),sid)+
    '</select>'+
  '</div>';

  h+='<section class="kpis">'+
    '<div class="kpi"><small>الصفحات المحفوظة</small><b>'+mm.count+'</b><i>من 604</i></div>'+
    '<div class="kpi"><small>نسبة الإنجاز</small><b>'+mm.pct+'%</b><i>'+esc(s.name)+'</i></div>'+
    '<div class="kpi"><small>أجزاء مكتملة</small><b>'+mm.done+'</b><i>من 30</i></div>'+
    '<div class="kpi"><small>المتبقي</small><b>'+(604-mm.count)+'</b><i>صفحة</i></div>'+
  '</section>';

  function evBox(title,ev){
    if(!ev)return '<div class="kpi"><small>'+title+'</small><b>—</b><i>لا يوجد</i></div>';
    var a=absPage(ev.juz,ev.page);
    return '<div class="kpi"><small>'+title+'</small><b>صفحة '+a+'</b><i>الجزء '+ev.juz+' · '+esc(GRADES[ev.g])+' · '+esc(ev.d)+'</i></div>';
  }

  h+='<section class="kpis">'+
    evBox('آخر قراءة',last.read)+
    evBox('آخر حفظ متقن',last.mem)+
  '</section>';

  var rawPage=S.ui.quranPage;
  var dflt=last.read?absPage(last.read.juz,last.read.page):1;
  var qp=Math.min(604,Math.max(1,Math.round(num(rawPage))||dflt));

  h+='<div class="card"><h2>تصفح المصحف</h2>'+
    '<div class="filters">'+
      '<button type="button" class="btn sm" data-act="qprev" data-n="'+qp+'">السابقة</button>'+
      '<input id="qpage" type="number" min="1" max="604" data-bind="quranPage" value="'+esc(rawPage===undefined?dflt:rawPage)+'" style="max-width:110px;flex:0 1 110px">'+
      '<button type="button" class="btn sm" data-act="qnext" data-n="'+qp+'">التالية</button>'+
      '<a class="btn pri sm" href="'+esc(quranLink(qp))+'" target="_blank" rel="noopener">فتح صفحة '+qp+'</a>'+
    '</div>'+
    '<p class="note" style="margin-top:8px">الصفحة '+qp+' · الجزء '+absToJP(qp).juz+'</p>'+
  '</div>';

  h+='<div class="card"><h2>الأجزاء (30)</h2>'+
    '<div class="juzs">'+
      range(1,30).map(function(j){
        var n=mm.per[j], tot=juzPages(j);
        return '<button type="button" class="juz'+(n>=tot?' full':'')+'" '+
          'data-act="pickJuz" data-j="'+j+'" '+
          'aria-pressed="'+(num(S.ui.quranJuz||30)===j)+'">'+
          '<b>'+j+'</b>'+
          '<span class="bar"><i style="width:'+(n/tot*100)+'%"></i></span>'+
          '<small>'+n+'/'+tot+'</small>'+
        '</button>';
      }).join('')+
    '</div>'+
  '</div>';

  var j=num(S.ui.quranJuz)||30;
  var pagesHtml=range(1,juzPages(j)).map(function(p){
    var a=absPage(j,p);
    var ev=mm.pages[a];
    return '<button type="button" class="pg'+(ev?' g-'+ev.g:'')+'" '+
      'data-act="pickQPage" data-s="'+esc(sid)+'" data-j="'+j+'" data-p="'+p+'" '+
      'aria-label="صفحة '+a+(ev?' '+GRADES[ev.g]:'')+'"'+(canWrite()?'':' disabled')+'>'+
      a+'<small>'+(ev?GRADES_SHORT[ev.g]:'')+'</small>'+
    '</button>';
  }).join('');

  h+='<div class="card"><div class="mh2"><h2 style="margin:0">الجزء '+j+'</h2>'+
    (mm.per[j]>=juzPages(j)?W('<button type="button" class="btn sm pri" data-act="juzCert" data-s="'+esc(sid)+'" data-j="'+j+'">'+ico('cert')+'شهادة الجزء '+j+'</button>'):'')+
  '</div>'+
    '<div class="pages" style="margin-top:10px">'+pagesHtml+'</div>'+
    '<p class="note" style="margin-top:8px">اضغط أي صفحة لتسجيل تسميعها.</p>'+
  '</div>';

  var recs=(D.pg[sid]&&D.pg[sid].rec)||[];
  var recent=recs.slice().sort(function(a,b){
    return (b.ts||0)-(a.ts||0)||(a.d<b.d?1:-1);
  }).slice(0,12);

  if(recent.length){
    h+='<div class="card"><h2>آخر التسميعات</h2><div class="list">'+
      recent.map(function(r){
        var a=absPage(r.juz,r.page);
        return '<div class="li">'+
          '<div>'+
            '<a class="linkb" href="'+esc(quranLink(a))+'" target="_blank" rel="noopener">صفحة '+a+'</a>'+
            ' · ج'+r.juz+
            ' <span class="pill '+(r.g==='redo'?'warn':'acc')+'">'+GRADES[r.g]+'</span>'+
            '<small>'+esc(r.d)+(r.note?' · '+esc(r.note):'')+'</small>'+
          '</div>'+
          W('<button type="button" class="ibtn" data-act="delRec" data-s="'+esc(sid)+'" data-id="'+r.id+'" aria-label="حذف">'+ico('trash')+'</button>')+
        '</div>';
      }).join('')+'</div></div>';
  }

  return h;
}

/* ============================================================

function recForm(sid,juz,page){
  var lo=sid?lastOf(sid):{mem:null,read:null};
  var a0=(juz&&page)?absPage(juz,page):(lo.mem?Math.min(604,absPage(lo.mem.juz,lo.mem.page)+1):1);

  M.push({
    title:'تسميع القرآن',
    values:{studentId:sid||'',from:a0,to:'',t:'new',g:'good',d:today(),note:''},
    fields:[
      {k:'studentId',l:'الطالب',t:'select',req:1,full:1,
        o:[['','اختر الطالب…']].concat(
          S.students.filter(function(s){return s.status==='مقبول';})
            .sort(function(a,b){return a.name<b.name?-1:1;})
            .map(function(s){return [s.id,s.no+' — '+s.name];})
        )},
      {k:'from',l:'من صفحة',t:'number',req:1,min:1,max:604,hint:'رقم صفحة المصحف (1–604)'},
      {k:'to',l:'إلى صفحة',t:'number',min:1,max:604,hint:'اتركه فارغاً لصفحة واحدة'},
      {k:'t',l:'نوع الأداء',t:'select',o:[['new','حفظ جديد'],['review','مراجعة'],['tilawa','تلاوة']]},
      {k:'g',l:'التقدير',t:'select',o:[
        ['good','جيد'],['vgood','جيد جداً'],['excellent','ممتاز'],['redo','إعادة']
      ]},
      {k:'d',l:'التاريخ',t:'date',req:1},
      {k:'note',l:'ملاحظات',full:1}
    ],
    submit:function(x){
      if(!x.studentId)return 'اختر الطالب.';
      var a=Math.round(num(x.from));
      var b=(x.to===''||x.to==null)?a:Math.round(num(x.to));
      if(a<1||a>604||b<1||b>604)return 'الصفحة بين 1 و604.';
      if(b<a)return 'الصفحة الأخيرة قبل الأولى.';
      if(b-a>=60)return 'الحد 60 صفحة في الجلسة.';

      var base=Date.now();
      return saveProg(x.studentId,function(p){
        for(var i=a;i<=b;i++){
          var jp=absToJP(i);
          p.rec.push({
            id:uid(),d:x.d,juz:jp.juz,page:jp.page,
            g:x.g,t:x.t,note:String(x.note||'').trim(),
            ts:base+(i-a)
          });
        }
      }).then(function(){
        S.ui.quranSid=x.studentId;
        toast('سُجّلت '+(b-a+1)+' صفحة');
      });
    }
  });
}

/* ============================================================

   ============================================================ */
function certMarkup(c){
  var isT=c.recipientType==='teacher';
  var rec=isT?D.tMap[c.recipientId]:D.sMap[c.recipientId];
  var name=rec?rec.name:'—';
  var fem=!isT&&rec&&rec.gender==='أنثى';
  var who=isT?'الأستاذ(ة)':(fem?'الطالبة':'الطالب');
  var org=S.settings.institution;
  var j=c.juz?' '+c.juz:'';
  var txt;

  if(c.kind==='إتمام جزء من القرآن'){
    txt='تشهد '+org+' بأن '+who+' المذكور اسمه أعلاه قد '+(fem?'أتمّت':'أتمّ')+' حفظ الجزء'+j+' من القرآن الكريم، نسأل الله أن ينفع به ويجعله من أهل القرآن.';
  }else if(c.kind==='اجتياز اختبار جزء'){
    txt='تشهد '+org+' بأن '+who+' المذكور اسمه أعلاه قد '+(fem?'اجتازت':'اجتاز')+' بنجاح اختبار الجزء'+j+' من القرآن الكريم.';
  }else if(c.kind==='إتمام مرحلة تعليمية'){
    txt='تشهد '+org+' بأن '+who+' المذكور اسمه أعلاه قد '+(fem?'أتمّت':'أتمّ')+' المرحلة التعليمية بنجاح.';
  }else if(c.kind==='تفوق وتميّز'){
    txt='تمنح '+org+' هذه الشهادة إلى '+who+' المذكور اسمه أعلاه نظير تفوّقه وتميّزه.';
  }else if(c.kind==='إتمام الكتاب الرشيدي'){
    txt='تشهد '+org+' بأن '+who+' المذكور اسمه أعلاه قد '+(fem?'أتمّت':'أتمّ')+' كتاب «الرشيدي المطور» كاملاً.';
  }else if(c.kind==='اجتياز اختبار الرشيدي'){
    txt='تشهد '+org+' بأن '+who+' المذكور اسمه أعلاه قد '+(fem?'اجتازت':'اجتاز')+' الاختبار النهائي لكتاب «الرشيدي المطور» بنجاح.';
  }else{
    txt='تتقدّم '+org+' بجزيل الشكر والتقدير إلى '+who+' المذكور اسمه أعلاه على جهوده المبذولة.';
  }

  return '<div class="cert">'+
    '<div class="c-org">'+esc(org)+'</div>'+
    '<div class="c-t">'+esc(certTitle(c))+'</div>'+
    '<p>تُمنح هذه الشهادة إلى</p>'+
    '<div class="c-n">'+esc(name)+'</div>'+
    '<p>'+esc(txt)+'</p>'+
    (c.note?'<p>'+esc(c.note)+'</p>':'')+
    '<div class="c-f">'+
      '<span>التاريخ: '+esc(c.date)+'</span>'+
      '<span>رقم الشهادة: '+esc(certNo(c.certNo))+'</span>'+
      (c.signer?'<span>التوقيع: '+esc(c.signer)+'</span>':'')+
    '</div>'+
  '</div>';
}

/* ============================================================
   reportData
   ============================================================ */
function reportData(){
  var Y=curYear();
  var kind=S.ui.rep||'roster';
  var st=S.ui.rst||'';
  var sh=S.ui.rsh||'';

  var en=S.enrollments.filter(function(e){
    return e.year===Y&&(!st||e.stage===st)&&(!sh||e.shift===sh);
  });

  var stageIdx=stageList();
  en.sort(function(a,b){
    return (stageIdx.indexOf(a.stage)-stageIdx.indexOf(b.stage))||
      (a.section<b.section?-1:a.section>b.section?1:0)||
      (sName(a.studentId)<sName(b.studentId)?-1:1);
  });

  var r={title:'',head:[],rows:[],nums:[],total:null};

  if(kind==='roster'){
    r.title='كشف الطلاب — '+Y;
    r.head=['الرقم','الطالب','المرحلة','القسم','الفترة','حالة التسجيل','ولي الأمر','الهاتف'];
    r.rows=en.map(function(e){
      var s=D.sMap[e.studentId]||{};
      return [s.no||'',s.name||'',e.stage,e.section,e.shift,e.status,s.guardian||'',s.guardianPhone||s.phone||''];
    });
  }else if(kind==='dues'){
    if(S.settings.hideFinance)return r;
    r.title='كشف الذمم المتبقية — '+Y;
    r.head=['الرقم','الطالب','المرحلة','القسم','الفترة','الرسوم','المدفوع','المتبقي'];
    r.nums=[5,6,7];
    var t2=[0,0,0];
    en.filter(function(e){return bal(e.id)>0;})
      .sort(function(a,b){return bal(b.id)-bal(a.id);})
      .forEach(function(e){
        var s=D.sMap[e.studentId]||{};
        r.rows.push([s.no||'',s.name||'',e.stage,e.section,e.shift,due(e.id),paid(e.id),bal(e.id)]);
        t2[0]+=due(e.id); t2[1]+=paid(e.id); t2[2]+=bal(e.id);
      });
    r.total=t2;
  }else{
    if(S.settings.hideFinance)return r;
    var from=S.ui.rfrom||'', to=S.ui.rto||'';
    r.title='كشف الدفعات'+(from||to?' — '+(from||'…')+' إلى '+(to||'…'):'');
    r.head=['رقم السند','التاريخ','الطالب','المرحلة','الفترة','المبلغ','الطريقة'];
    r.nums=[5];
    var tt=0;
    S.payments.filter(function(p){
      var e=D.eMap[p.enrollmentId]; if(!e)return false;
      if(st&&e.stage!==st)return false;
      if(sh&&e.shift!==sh)return false;
      if(from&&p.date<from)return false;
      if(to&&p.date>to)return false;
      return true;
    }).sort(function(a,b){
      return a.date<b.date?-1:a.date>b.date?1:num(a.receiptNo)-num(b.receiptNo);
    }).forEach(function(p){
      var e=D.eMap[p.enrollmentId];
      r.rows.push([p.receiptNo,p.date,sName(e.studentId),e.stage,e.shift,num(p.amount),p.method]);
      tt+=num(p.amount);
    });
    r.total=[tt];
  }

  return r;
}

  var kind=S.ui.rep||'roster';

  }

    kinds.map(function(t2){
      return '<button type="button" data-act="repKind" data-k="'+t2[0]+'" aria-pressed="'+(kind===t2[0])+'">'+t2[1]+'</button>';
    }).join('')+
  '</div>';

  h+='<div class="filters">'+
    '<select id="rst" data-bind="rst">'+selOpts(stageList(),S.ui.rst,'كل المراحل')+'</select>'+
    '<select id="rsh" data-bind="rsh">'+selOpts(SHIFTS,S.ui.rsh,'كل الفترات')+'</select>'+
    (kind==='payments'?
      '<label class="note" style="display:flex;gap:6px;align-items:center">من <input id="rfrom" type="date" data-bind="rfrom" value="'+esc(S.ui.rfrom||'')+'"></label>'+
      '<label class="note" style="display:flex;gap:6px;align-items:center">إلى <input id="rto" type="date" data-bind="rto" value="'+esc(S.ui.rto||'')+'"></label>'
      :'')+
  '</div>';

  h+='<div class="card">'+
    '<div class="only-print"><b>'+esc(S.settings.institution)+'</b><br>'+esc(r.title)+' · '+today()+'</div>'+
    '<h2 class="noprint">'+esc(r.title)+'</h2>';

  if(!r.rows.length){
    h+=emptyBox('لا توجد بيانات لهذا التقرير',
      S.settings.hideFinance&&(kind==='dues'||kind==='payments')
        ?'البيانات المالية مخفية.':'غيّر السنة أو المرحلة أو الفترة.','');
  }else{
    var shown=r.rows.slice(0,LIMIT);
    var cols=r.head.map(function(hd,i){
      return{
        h:hd,n:r.nums.indexOf(i)>=0,
        f:function(row){
          return r.nums.indexOf(i)>=0?fmt(row[i]):esc(row[i]);
        }
      };
    });

    var foot='';
    if(r.total){
      foot='<tfoot><tr>'+r.head.map(function(hd,i){
        if(i===0)return '<td>المجموع ('+fmt(r.rows.length)+')</td>';
        var k=r.nums.indexOf(i);
        return k>=0?'<td class="n">'+fmt(r.total[k])+'</td>':'<td></td>';
      }).join('')+'</tr></tfoot>';
    }else{
      foot='<tfoot><tr><td colspan="'+r.head.length+'">العدد: '+fmt(r.rows.length)+'</td></tr></tfoot>';
    }

    h+=tbl(cols,shown,foot)+limitNote(r.rows.length)+
      '<p class="note noprint" style="margin-top:10px">للطباعة استخدم أمر الطباعة في المتصفح.</p>';
  }

  h+='</div>';
  return h;
}

   ============================================================ */
function csvOf(head,rows){
  return '\uFEFF'+[head].concat(rows).map(function(r){
    return r.map(function(c){
      return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';
    }).join(',');
  }).join('\r\n');
}

ACT.exportReport=function(){
  var r=reportData();
  if(!r.rows.length){toast('لا توجد بيانات.');return;}
  var rows=r.rows.slice();
  if(r.total){
    rows.push(r.head.map(function(h,i){
      if(i===0)return 'المجموع';
      var k=r.nums.indexOf(i);
      return k>=0?r.total[k]:'';
    }));
  }
  downloadBlob(fname(r.title)+'.csv',csvOf(r.head,rows),'text/csv;charset=utf-8');
};

ACT.exportReportXlsx=function(){

/* ============================================================
   periodRange + reportMarkup + reportText
   ============================================================ */
function periodRange(){
  var k=S.ui.rpp||'all';
  var t2=today();
  if(k==='30'){
    var d=new Date(); d.setDate(d.getDate()-30);
    return {f:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),t:t2,label:'آخر 30 يوماً'};
  }
  if(k==='month')return {f:t2.slice(0,8)+'01',t:t2,label:'شهر '+t2.slice(0,7)};
  return {f:'',t:'',label:'كل الفترة'};
}

      '<div><b>'+esc(s.name)+'</b>'+

    '<div class="rp-box"><small>إجمالي النقاط</small><b>'+fmt(pt.total)+'</b></div>'+
    '<div class="rp-box"><small>الحضور</small><b>'+(tot?Math.round(pt.p/tot*100)+'%':'—')+'</b>'+

    '<tr><td>التسميع</td><td class="n">'+sg(pt.rec)+'</td></tr>'+
    '<tr><td>الاختبارات</td><td class="n">'+sg(pt.exam)+'</td></tr>'+
    '<tr><td>إضافات المعلم</td><td class="n">'+sg(pt.add)+'</td></tr>'+

    '<tr><td><b>المجموع</b></td><td class="n"><b>'+fmt(pt.total)+'</b></td></tr>'+
  '</tbody></table></div>';

  if(recs.length){
    h+='<div><h3>آخر التسميعات</h3><table><thead><tr><th>التاريخ</th><th>الجزء</th><th>الصفحة</th><th>التقدير</th></tr></thead><tbody>'+

/* ============================================================
   msgCfg
   ============================================================ */
function msgCfg(){
  var m=S.settings.msg||{};
  var r=m.rules||{};
  var dfltRules=(DEF.msg&&DEF.msg.rules)||{};
  var dfltTpl=(DEF.msg&&DEF.msg.tpl)||QUICK_MSG_TEMPLATES;

  return{
    paused:!!m.paused,
    appUrl:m.appUrl||(DEF.msg&&DEF.msg.appUrl)||APP_URL,
    tpl:Object.assign({},QUICK_MSG_TEMPLATES,dfltTpl,m.tpl||{}),
    rules:{
      absent:Object.assign({on:true,time:'14:00'},dfltRules.absent,r.absent),
      dues:Object.assign({on:true,time:'10:00',minBal:1},dfltRules.dues,r.dues),
      session:Object.assign({on:true,lead:60},dfltRules.session,r.session)
    }
  };
}

/* ============================================================
   fillTpl + baseVars + addMin + phoneOfS
   ============================================================ */
function fillTpl(t2,v){
  return String(t2||'').replace(/\{([^}]+)\}/g,function(m,k){
    return v[k]!=null?String(v[k]):m;
  });
}
function baseVars(){
  return{
    'المؤسسة':S.settings.institution,
    'التاريخ':today(),
    'العملة':S.settings.currency,
    'السنة':curYear(),
    'الرابط':msgCfg().appUrl
  };
}
function addMin(date,time,m){
  var p=String(time||'00:00').split(':');
  var d=new Date(date+'T'+pad(num(p[0]))+':'+pad(num(p[1]))+':00');
  d.setMinutes(d.getMinutes()+m);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function phoneOfS(s){return (s&&(s.guardianPhone||s.phone))||'';}

/* ============================================================
   waLink
   ============================================================ */
function waLink(phone,text){
  var d=String(phone||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.indexOf('00')===0)d=d.slice(2);
  else if(d.charAt(0)==='0')d=(S.settings.countryCode||'963')+d.slice(1);
  return 'https://wa.me/'+d+'?text='+encodeURIComponent(text);
}

/* ============================================================
   audience
   ============================================================ */
function audience(aud,stage){
  var out=[];
  if(aud==='teachers'){
    S.teachers.filter(function(t2){return t2.status!=='موقوف';})
      .forEach(function(t2){out.push({id:t2.id,name:t2.name,phone:t2.phone});});
  }else if(aud==='supervisors'){
    S.supervisors.filter(function(t2){return t2.status!=='موقوف';})
      .forEach(function(t2){out.push({id:t2.id,name:t2.name,phone:t2.phone});});
  }else{
    var Y=curYear();
    S.students.filter(function(s){return s.status==='مقبول';}).forEach(function(s){
      if(stage){
        var e=S.enrollments.filter(function(x){
          return x.studentId===s.id&&x.year===Y&&x.status==='نشط';
        })[0];
        if(!e||e.stage!==stage)return;
      }
      out.push({id:s.id,name:s.name,phone:phoneOfS(s)});
    });
  }
  return out;
}

/* ============================================================
   msgQueue
   ============================================================ */
function msgQueue(){
  var cfg=msgCfg();
  var td=today();
  var mon=td.slice(0,7);
  var items=[];
  var bv=baseVars();
  var sent={};
  S.msglog.forEach(function(l){sent[l.id]=1;});

  function add(key,kind,who,name,phone,text,dueAt){
    items.push({key:key,kind:kind,who:who,name:name,phone:phone,text:text,dueAt:dueAt,sent:!!sent[key]});
  }

  if(cfg.paused)return items;
  var Y=curYear();

  if(cfg.rules.absent.on){
    var marks=D.att[td]||{};
    Object.keys(marks).forEach(function(sid){
      if(marks[sid]!=='a')return;
      var s=D.sMap[sid]; if(!s)return;
      add('absent_'+td+'_'+sid,'غياب','ولي أمر',s.name,phoneOfS(s),
        fillTpl(cfg.tpl.absent,Object.assign({},bv,{'الاسم':s.name})),td+' '+cfg.rules.absent.time);
    });
  }

  if(cfg.rules.dues.on){
    S.enrollments.filter(function(e){
      return e.year===Y&&e.status==='نشط'&&bal(e.id)>=num(cfg.rules.dues.minBal||1);
    }).forEach(function(e){
      var s=D.sMap[e.studentId]; if(!s)return;
      add('dues_'+mon+'_'+e.id,'رسوم','ولي أمر',s.name,phoneOfS(s),
        fillTpl(cfg.tpl.dues,Object.assign({},bv,{'الاسم':s.name,'المتبقي':fmt(bal(e.id))})),
        td+' '+cfg.rules.dues.time);
    });
  }

  if(cfg.rules.session.on){
    S.sessions.filter(function(x){
      return x.date===td&&x.status!=='ملغاة'&&x.teacherId;
    }).forEach(function(x){
      var t2=D.tMap[x.teacherId]; if(!t2)return;
      add('session_'+x.id+'_'+t2.id,'حصة','معلم',t2.name,t2.phone,
        fillTpl(cfg.tpl.session,Object.assign({},bv,{'الاسم':t2.name,'الوقت':x.time||'','العنوان':x.title||''})),
        addMin(td,x.time||'08:00',-num(cfg.rules.session.lead)));
    });
  }

  S.msgsched.forEach(function(sc){
    if(!sc.when)return;
    var dueAt=String(sc.when).replace('T',' ');
    audience(sc.aud,sc.stage).forEach(function(r){
      add('sch_'+sc.id+'_'+r.id,'مجدولة',
        sc.aud==='students'?'ولي أمر':(sc.aud==='teachers'?'معلم':'مشرف'),
        r.name,r.phone,fillTpl(sc.text,Object.assign({},bv,{'الاسم':r.name})),dueAt);
    });
  });

  // استثناء الطلاب في إجازة
  var onLeave={};
  S.enrollments.forEach(function(e){
    if(e.leave&&e.leave.from&&e.leave.from<=td&&(!e.leave.to||e.leave.to>=td)){
      onLeave[e.studentId]=true;
    }
  });

  return items.filter(function(it){
    if(it.kind!=='غياب')return true;
    var m=/^absent_[^_]+_(.+)$/.exec(it.key);
    if(!m)return true;
    return !onLeave[m[1]];
  });
}

/* ============================================================
   computeNotifs
   ============================================================ */
function computeNotifs(){
  var out=[];
  var today0=today();
  var now=new Date();
  var y=now.getFullYear();
  var m=pad(now.getMonth()+1);
  var d=pad(now.getDate());
  var sevenDaysAgo=(function(){
    var x=new Date(); x.setDate(x.getDate()-7);
    return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
  })();
  var notifsCfg=Object.assign({},DEF.notifs,S.settings.notifs||{});
  var inact=Object.assign({},DEF.notifs.inactivity,(notifsCfg.inactivity||{}));
  var role=myRole();
  var lvl=myLevel();

  function add(id,kind,title,desc,link){
    out.push({id:id,kind:kind,title:title,desc:desc,link:link,date:today0});
  }

  if(lvl>=2){
    var marks=D.att[today0]||{};
    var absCount=0;
    Object.keys(marks).forEach(function(sid){
      if(marks[sid]==='a')absCount++;
    });
    if(absCount>0){
      add('abs_'+today0,'غياب',absCount+' طالب غائب اليوم','راجع الحضور',{act:'nav',v:'att'});
    }
  }

  if(lvl>=2){
    var stale=0;
    S.enrollments.filter(function(e){return e.year===curYear()&&e.status==='نشط';})
      .forEach(function(e){
        var last=lastOf(e.studentId);
        if(!last.read||last.read.d<sevenDaysAgo)stale++;
      });
    if(stale>0){
      add('stale_rec_'+today0,'تسميع',stale+' طالب بلا تسميع منذ أسبوع','تواصل مع أولياء الأمور',{act:'nav',v:'quran'});
    }
  }

  if(!S.settings.hideFinance&&lvl>=3){
    var overdue=0,overdueSum=0;
    S.enrollments.filter(function(e){
      return e.year===curYear()&&e.status==='نشط'&&bal(e.id)>0;
    }).forEach(function(e){
      overdue++;
      overdueSum+=Math.max(0,bal(e.id));
    });
    if(overdue>0){
      add('dues_'+m,'رسوم',overdue+' طالب متبقٍ عليه','المجموع: '+fmt(overdueSum),{act:'nav',v:'fees'});
 }
  }

  if(role==='teacher'){
    var tid=(S.profile&&S.profile.teacher_id)||'';
    if(tid){
      var t2=D.tMap[tid];
      var myBooks=(t2&&t2.selectedBooks)||[];
      var dueBooks=[];
      myBooks.forEach(function(bid){
        var next=nextLessonFor(tid,bid);
        if(next&&next.title)dueBooks.push(next.title);
      });
      if(dueBooks.length){
        add('lessons_'+today0,'دروس',dueBooks.length+' درساً قادماً',dueBooks.slice(0,3).join(' · '),{act:'nav',v:'books'});
      }
    }
  }

  if(lvl>=3){
    var weekSess=S.sessions.filter(function(x){
      return x.date>=sevenDaysAgo&&x.status!=='ملغاة';
    }).length;
    if(weekSess===0){
      add('no_sess_'+today0,'حصص','لا حصص هذا الأسبوع','تأكد من المتابعة',{act:'nav',v:'sessions'});
    }
  }

  var myLast=S.user&&S.user.last_seen;
  if(myLast&&inact[role]){
    var daysAgo=Math.floor((Date.now()-new Date(myLast).getTime())/86400000);
    if(daysAgo>=num(inact[role])){
      add('inactivity_'+role+'_'+today0,'تذكير','لم تفتح التطبيق منذ '+daysAgo+' أيام','راجع مهامك',null);
    }
  }

  if(lvl>=5){
    var pending=(SB.users||[]).filter(function(u){return u.role==='pending';}).length;
    if(pending>0){
      add('pending_'+today0,'إدارة',pending+' مستخدم بانتظار الموافقة','افتح «الحسابات»',{act:'nav',v:'acc'});
    }
  }

  var readSet={};
  S.notifications.filter(function(n){return n.date===today0;})
    .forEach(function(n){readSet[n.id]=1;});
  out.forEach(function(it){if(readSet[it.id])it.read=true;});

  return out;
}

/* ============================================================
   vNotifs
   ============================================================ */
function vNotifs(){
  var list=computeNotifs();
  var unread=list.filter(function(n){return !n.read;}).length;

  var h=vh(t('nav.notifs')||'الإشعارات',unread+' إشعار جديد من '+list.length);

  if(!list.length){
    return h+emptyBox('لا إشعارات','كل شيء تحت السيطرة.','');
  }

  var ICONS={'غياب':'att','تسميع':'quran','رسوم':'fees','حصص':'sess','دروس':'books','إدارة':'acc','تذكير':'clock'};

  h+='<div class="notif-list card">'+
    list.map(function(n){
      var icon=ICONS[n.kind]||'bell';
      return '<div class="notif-item'+(n.read?'':' unread')+'">'+
        ico(icon)+
        '<div style="flex:1;min-width:0">'+
          '<b>'+esc(n.title)+'</b>'+
          '<small>'+esc(n.desc||'')+'</small>'+
        '</div>'+
        '<div class="btns" style="flex:none">'+
          (n.link?'<button type="button" class="btn sm" data-act="goto" data-a="'+esc(n.link.act)+'" data-v="'+esc(n.link.v||'')+'">فتح</button>':'')+
          (!n.read?'<button type="button" class="ibtn" data-act="markNotifRead" data-id="'+esc(n.id)+'" aria-label="مقروء">'+ico('check')+'</button>':'')+
        '</div>'+
      '</div>';
    }).join('')+
  '</div>';

  h+='<div class="btns" style="margin-top:12px">'+
    '<button type="button" class="btn" data-act="markAllNotifsRead">تحديد الكل كمقروء</button>'+
  '</div>';

  return h;
}

/* updateNotifCount */
function updateNotifCount(){
  var el=$('#notifCount');
  if(!el)return;
  try{
    var list=computeNotifs();
    var unread=list.filter(function(n){return !n.read;}).length;
    if(unread>0){
      el.textContent=unread>99?'99+':String(unread);
      el.hidden=false;
    }else{
      el.hidden=true;
    }
  }catch(e){}
}

var _origRender_p16=render;
render=function(){
  _origRender_p16.apply(this,arguments);
  updateNotifCount();
};

function requirePassword(cb){
  if(!S.settings.requirePwForDanger){cb();return;}
  M.push({
    title:'تأكيد كلمة المرور',
    values:{pw:''},
    fields:[{k:'pw',l:'كلمة المرور',t:'password',req:1,full:1,hint:'مطلوبة للعمليات الحساسة'}],

        if(r.error)return 'كلمة المرور غير صحيحة.';

ACT.restoreBackup=function(){
  if(!canWrite())return;
  var input=document.createElement('input');
  input.type='file'; input.accept='.json'; input.style.display='none';

  input.addEventListener('change',function(){
    var f=input.files&&input.files[0];
    if(!f)return;
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=JSON.parse(e.target.result);
        if(!data.version||!data.settings){
          toast('الملف ليس نسخة احتياطية صالحة.');
          return;
        }
        requirePassword(function(){
          confirmBox('استعادة النسخة',
            'سيتم استبدال كل البيانات الحالية بمحتوى النسخة. لا يمكن التراجع.',
            'استعادة',
            function(){performRestore(data);});
        });
      }catch(err){
        toast('تعذّر تحليل الملف: '+(err.message||''));
      }
    };
    reader.readAsText(f);
  });

  document.body.appendChild(input);
  input.click();
  setTimeout(function(){input.remove();},60000);
};

function performRestore(data){
  toast('جارٍ الاستعادة…');
  var ops=[];
  ops.push(function(){return Data.put('settings','main',data.settings);});
  COLS.forEach(function(c){
    var items=Array.isArray(data[c])?data[c]:[];
    if(!items.length)return;
    ops.push(function(){
      var batch=items.map(function(item){
        var d=Object.assign({},item);
        var id=d.id||uid();
        delete d.id;
        return{id:id,data:d};
      });
      return batchPut(c,batch);
    });
  });

  var p=Promise.resolve();
  ops.forEach(function(op){p=p.then(op);});

  p.then(function(){
    toast('اكتملت الاستعادة');
    render();
  },function(e){toast('فشلت: '+(e.message||errMsg(e)));});
}

function globalSearch(query){
  if(!query)return [];
  var q=query.trim().toLowerCase();
  if(q.length<2)return [];

  var out=[];

  S.students.forEach(function(s){
    var hay=(s.name+' '+(s.self_no||'')+' '+(s.no||'')+' '+(s.phone||'')+' '+(s.guardian||'')).toLowerCase();
    if(hay.indexOf(q)>=0){
      out.push({kind:'طالب',icon:'students',label:s.name,sub:'رقم '+(s.self_no||s.no||''),act:'profile',id:s.id});
    }
  });

  S.teachers.forEach(function(t2){
    var hay=(t2.name+' '+(t2.self_no||'')+' '+(t2.phone||'')+' '+(t2.specialty||'')).toLowerCase();
    if(hay.indexOf(q)>=0){
      out.push({kind:'معلم',icon:'teacher',label:t2.name,sub:t2.specialty||'',act:'editTeacher',id:t2.id});
    }
  });

  S.supervisors.forEach(function(t2){
    var hay=(t2.name+' '+(t2.self_no||'')+' '+(t2.phone||'')+' '+(t2.area||'')).toLowerCase();
    if(hay.indexOf(q)>=0){
      out.push({kind:'مشرف',icon:'sup',label:t2.name,sub:t2.level||'',act:'editSup',id:t2.id});
    }
  });

  S.books.forEach(function(b){
    var hay=(b.name+' '+(b.author||'')).toLowerCase();
    if(hay.indexOf(q)>=0){
      out.push({kind:'كتاب',icon:'books',label:b.name,sub:b.author||'',act:'vLessons',id:b.id});
    }
  });

  S.certificates.forEach(function(c){

      out.push({kind:'شهادة',icon:'cert',label:n,sub:certNo(c.certNo),act:'viewCert',id:c.id});

  });

  return out.slice(0,20);
}

/* ============================================================
   HIJRI_MONTHS + GREG_MONTHS + WEEKDAYS_AR
   ============================================================ */
var HIJRI_MONTHS=['محرّم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
var GREG_MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var WEEKDAYS_AR=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

/* ============================================================
   toHijri — تحويل ميلادي → هجري
   ============================================================ */
function toHijri(y,m,d){
  var a=Math.floor((14-m)/12);
  var y2=y+4800-a;
  var m2=m+12*a-3;
  var jdn=d+Math.floor((153*m2+2)/5)+365*y2+
          Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045;

  var l0=jdn-1948440+10632;
  var n=Math.floor((l0-1)/10631);
  var l1=l0-10631*n+354;
  var j=Math.floor((10985-l1)/5316)*Math.floor((50*l1)/17719)+
        Math.floor(l1/5670)*Math.floor((43*l1)/15238);
  var l2=l1-Math.floor((30-j)/15)*Math.floor((17719*j)/50)-
         Math.floor(j/16)*Math.floor((15238*j)/43)+29;
  var hm=Math.floor((24*l2)/709);
  var hd=l2-Math.floor((709*hm)/24);
  var hy=30*n+j-30;

  return {y:hy,m:hm,d:hd};
}

function hijriFromIso(iso){
  var parts=String(iso||'').split('-');
  if(parts.length<3)return null;
  try{return toHijri(num(parts[0]),num(parts[1]),num(parts[2]));}
  catch(e){return null;}
}

function hijriDate(iso){
  var h=hijriFromIso(iso);
  if(!h)return '';
  var d=String(iso||'').split('-');
  var idx=new Date(num(d[0]),num(d[1])-1,num(d[2])).getDay();
  return WEEKDAYS_AR[idx]+' '+h.d+' '+HIJRI_MONTHS[h.m-1]+' '+h.y+'هـ';
}

function gregDate(iso){
  if(!iso)return '';
  var d=String(iso).split('-');
  if(d.length<3)return iso;
  var idx=new Date(num(d[0]),num(d[1])-1,num(d[2])).getDay();
  return WEEKDAYS_AR[idx]+' '+num(d[2])+' '+GREG_MONTHS[num(d[1])-1]+' '+d[0];
}

/* ============================================================
   weekStart + addDays
   ============================================================ */
function weekStart(iso){
  var d=new Date(iso||today());
  var day=d.getDay();
  var diff=day===6?0:(day+1)%7;
  d.setDate(d.getDate()-diff);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}

function addDays(iso,n){
  var d=new Date(iso);
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}

/* ============================================================
   vWeek
   ============================================================ */
function vWeek(){
  var start=S.ui.weekStart||weekStart();
  var end=addDays(start,6);

  var tid=myRole()==='teacher'?myTeacherId():'';
  var cid=myRole()==='cs'?myCenterId():'';

  var sessions=S.sessions.filter(function(x){
    if(x.date<start||x.date>end)return false;
    if(x.status==='ملغاة')return false;
    if(tid&&x.teacherId!==tid)return false;
    return true;
  });

  var days=range(0,6).map(function(i){return addDays(start,i);});

  var h=vh('الجدول الأسبوعي',
    gregDate(start)+' — '+gregDate(end),
    '<button type="button" class="btn" data-act="weekPrev">'+ico('x')+'السابق</button>'+
    '<button type="button" class="btn" data-act="weekToday">اليوم</button>'+
    '<button type="button" class="btn" data-act="weekNext">التالي</button>'+
    W('<button type="button" class="btn pri" data-act="newSession">'+ico('plus')+'حصة</button>'));

  h+='<div class="week-grid">';

  days.forEach(function(d){
    var daySess=sessions.filter(function(x){return x.date===d;});
    var hd=hijriFromIso(d);
    var isToday=d===today();

    h+='<div class="week-day"'+(isToday?' style="border:2px solid var(--accent)"':'')+'>'+
      '<h4>'+
        esc(WEEKDAYS_AR[new Date(d).getDay()])+
        '<br><small style="font-weight:400;color:var(--ink-2)">'+d.slice(8)+'</small>'+
        (hd?'<br><small style="font-weight:400;color:var(--ink-2);font-size:10px">'+hd.d+' '+HIJRI_MONTHS[hd.m-1]+'</small>':'')+
      '</h4>';

    if(daySess.length){
      daySess.slice(0,4).forEach(function(x){
        var t2=SESS_TYPES[x.type]||{ar:x.type};
        var cls=x.status==='تمت'?'week-sess':'week-sess muted';

/* ============================================================
   predictDropout
   ============================================================ */
function predictDropout(sid){
  var Y=curYear();
  var e=S.enrollments.filter(function(x){
    return x.studentId===sid&&x.year===Y&&x.status==='نشط';
  })[0];
  if(!e)return null;

  var risk=0,reasons=[];

  var wa=new Date(); wa.setDate(wa.getDate()-30);
  var waStr=wa.getFullYear()+'-'+pad(wa.getMonth()+1)+'-'+pad(wa.getDate());
  var tm=today();

  var p=0,l=0,a=0;
  D.classDates.forEach(function(d){
    if(d<waStr||d>tm)return;
    var st=D.att[d][sid];
    if(st==='p')p++;
    else if(st==='l')l++;
    else if(st==='a')a++;
  });
  var totalDays=p+l+a;
  var attRate=totalDays>0?(p+0.5*l)/totalDays:1;

  if(totalDays>=5&&attRate<0.5){risk+=40;reasons.push('حضور ضعيف '+Math.round(attRate*100)+'%');}
  else if(totalDays>=5&&attRate<0.75){risk+=20;reasons.push('حضور متوسط '+Math.round(attRate*100)+'%');}

  var last=lastOf(sid);
  if(!last.read||last.read.d<waStr){
    risk+=30;reasons.push('لا تسميع منذ 30 يوماً');
  }else if(last.read.d<(function(){var x=new Date();x.setDate(x.getDate()-14);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());})()){
    risk+=15;reasons.push('تسميع متأخر');
  }

  var ptNow=pointsOf(sid,waStr,tm);
  var ptPrev=pointsOf(sid,addDays(waStr,-30),waStr);
  if(ptPrev.total>10&&ptNow.total<ptPrev.total*0.5){
    risk+=20;reasons.push('تراجع النقاط');
  }

  if(!S.settings.hideFinance&&bal(e.id)>0){
    risk+=10;reasons.push('رسوم متأخرة');
  }

  return{
    risk:Math.min(100,risk),
    level:risk>=60?'high':risk>=30?'medium':'low',
    reasons:reasons,enrollment:e
  };
}

/* ============================================================
   vAtRisk
   ============================================================ */
function vAtRisk(){
  var Y=curYear();
  var rows=[];

  S.enrollments.filter(function(e){
    return e.year===Y&&e.status==='نشط';
  }).forEach(function(e){
    var r=predictDropout(e.studentId);
    if(r&&r.risk>=30){
      rows.push({sid:e.studentId,e:e,risk:r.risk,level:r.level,reasons:r.reasons});
    }
  });

  rows.sort(function(a,b){return b.risk-a.risk;});

  var h=vh(t('nav.atrisk')||'الطلاب المعرّضون للانقطاع',
    fmt(rows.length)+' طالب يحتاجون متابعة');

  if(!rows.length){
    return h+emptyBox('لا يوجد طلاب في خطر','كل الطلاب منتظمون حالياً.','');
  }

  h+=tbl([
    {h:'المستوى',f:function(r){
      var map={high:'bad',medium:'warn',low:'good'};
      var label={high:'مرتفع',medium:'متوسط',low:'منخفض'};
      return '<span class="pill '+(map[r.level]||'')+'">'+(label[r.level]||'')+'</span>';
    }},
    {h:'الطالب',f:function(r){
      return '<button type="button" class="linkb" data-act="profile" data-id="'+esc(r.sid)+'">'+
        esc(sName(r.sid))+'</button>';
    }},
    {h:'الخطر',n:1,f:function(r){
      return '<b>'+r.risk+'%</b>'+
        '<div class="pbar"><i style="width:'+r.risk+'%;background:'+(r.level==='high'?'var(--bad)':r.level==='medium'?'var(--amber)':'var(--good)')+'"></i></div>';
    }},
    {h:'الأسباب',f:function(r){return esc(r.reasons.join(' · '));}},
    {h:'',a:1,f:function(r){
      return '<button type="button" class="btn sm" data-act="profile" data-id="'+esc(r.sid)+'">متابعة</button>';
    }}
  ],rows.slice(0,LIMIT))+limitNote(rows.length);

  return h;
}

/* ============================================================
   vCompare
   ============================================================ */
function vCompare(){
  var Y=curYear();

  var centers=S.centers.slice().sort(byName);

  var data=centers.map(function(c){
    var ens=S.enrollments.filter(function(e){
      return e.year===Y&&e.status==='نشط'&&e.centerId===c.id;
    });
    var stuIds=ens.map(function(e){return e.studentId;});

    var p=0,l=0,a=0;
    D.classDates.forEach(function(d){
      stuIds.forEach(function(sid){
        var st=D.att[d][sid];
        if(st==='p')p++;
        else if(st==='l')l++;
        else if(st==='a')a++;
      });
    });
    var totalMarks=p+l+a;
    var attRate=totalMarks>0?Math.round((p+0.5*l)/totalMarks*100):null;

    var pts=stuIds.reduce(function(sum,sid){
      return sum+pointsOf(sid,'','').total;
    },0);
    var ptsAvg=stuIds.length?Math.round(pts/stuIds.length):0;

    var memTotal=stuIds.reduce(function(sum,sid){
      return sum+memoOf(sid).count;
    },0);
    var memAvg=stuIds.length?Math.round(memTotal/stuIds.length):0;

    return{
      center:c,
      students:stuIds.length,
      attRate:attRate,
      ptsAvg:ptsAvg,
      memAvg:memAvg
    };
  }).filter(function(x){return x.students>0;});

  data.sort(function(a,b){
    return (b.ptsAvg||0)-(a.ptsAvg||0);
  });

  var h=vh(t('nav.compare')||'مقارنة المراكز',

/* ============================================================
   MEDIA — إدارة تسجيل الصوت
   ============================================================ */
var MEDIA={
  recorder:null,
  chunks:[],
  stream:null,
  startTime:0,

  supported:function(){
    return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
  },

  start:function(){
    var self=MEDIA;
    if(!self.supported())return Promise.reject(new Error('التسجيل غير مدعوم في هذا المتصفح'));

    return navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      self.stream=stream;
      self.chunks=[];
      var mime='';
      if(MediaRecorder.isTypeSupported('audio/webm'))mime='audio/webm';
      else if(MediaRecorder.isTypeSupported('audio/mp4'))mime='audio/mp4';
      else if(MediaRecorder.isTypeSupported('audio/ogg'))mime='audio/ogg';

      self.recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
      self.recorder.ondataavailable=function(ev){
        if(ev.data&&ev.data.size>0)self.chunks.push(ev.data);
      };
      self.recorder.start(1000);
      self.startTime=Date.now();
      return true;
    });
  },

  stop:function(){
    var self=MEDIA;
    return new Promise(function(resolve){
      if(!self.recorder)return resolve(null);
      self.recorder.onstop=function(){
        var blob=new Blob(self.chunks,{type:self.recorder.mimeType||'audio/webm'});
        if(self.stream){
          self.stream.getTracks().forEach(function(t2){t2.stop();});
        }
        var duration=Math.round((Date.now()-self.startTime)/1000);
        self.chunks=[];
        self.recorder=null;
        self.stream=null;
        resolve({blob:blob,duration:duration});
      };
      self.recorder.stop();
    });
  },

  cancel:function(){
    var self=MEDIA;
    if(self.recorder){
      try{self.recorder.stop();}catch(e){}
    }
    if(self.stream){
      self.stream.getTracks().forEach(function(t2){t2.stop();});
    }
    self.chunks=[];
    self.recorder=null;
    self.stream=null;
  }
};

/* ============================================================
   blobToBase64 + saveRecording
   ============================================================ */
function blobToBase64(blob){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){resolve(reader.result);};
    reader.onerror=function(){reject(reader.error);};
    reader.readAsDataURL(blob);
  });
}

function saveRecording(sid,meta,blob,duration){
  return blobToBase64(blob).then(function(dataUrl){
    var id=uid();
    var rec={
      studentId:sid,
      page:meta.page||'',
      type:meta.type||'tilawa',
      note:meta.note||'',
      date:today(),
      duration:duration||0,
      dataUrl:dataUrl,
      ts:Date.now(),
      by:SB.user?SB.user.id:'local'
    };
    return Data.put('recordings',id,rec).then(function(){
      return id;
    });
  });
}

/* ============================================================
   ACT: التسجيل الصوتي
   ============================================================ */
ACT.startRecording=function(){
  if(!canWrite())return;
  var sid=S.ui.recordSid;
  if(!sid){toast('اختر الطالب أولاً.');return;}

  MEDIA.start().then(function(){
    S.ui.recording={startedAt:Date.now()};
    render();
    toast('بدأ التسجيل...');
  },function(err){
    toast('تعذّر التسجيل: '+(err.message||''));
  });
};

ACT.stopRecording=function(){
  var sid=S.ui.recordSid;
  if(!sid)return;

  MEDIA.stop().then(function(res){
    if(!res){toast('لا يوجد تسجيل.');return;}
    if(res.duration<1){toast('التسجيل قصير جداً.');return;}

    toast('جارٍ حفظ التسجيل...');

    saveRecording(sid,{
      page:num(S.ui.recPage)||'',
      type:S.ui.recType||'tilawa'
    },res.blob,res.duration).then(function(){
      S.ui.recording=null;
      S.ui.recPage='';
      toast('حُفظ التسجيل ('+res.duration+' ثانية)');
      render();
    },function(e){
      S.ui.recording=null;
      toast('تعذّر الحفظ: '+(e.message||errMsg(e)));
      render();
    });
  });
};

ACT.cancelRecording=function(){
  MEDIA.cancel();
  S.ui.recording=null;
  render();
};

ACT.delRecording=function(d){
  if(!canWrite())return;
  confirmBox('حذف التسجيل','سيُحذف التسجيل الصوتي نهائياً.','حذف',function(){
    Data.del('recordings',d.id).then(function(){
      toast('حُذف');
      render();
    },function(e){toast(errMsg(e));});
  });
};

  if(r==='student'||r==='parent'){
    if(S.view!=='portal')S.view='portal';
    var navS=$('#nav');
    if(navS){
      navS.innerHTML=
        '<button type="button" data-act="nav" data-v="portal" aria-current="page">'+
          ico('students')+t('nav.portal')+'</button>'+
        '<button type="button" data-act="nav" data-v="quiz">'+ico('check')+t('nav.quiz')+'</button>'+
        '<button type="button" data-act="logout">'+ico('logout')+t('nav.logout')+'</button>';
    }
    var tbS=$('#tabbar');
    if(tbS){
      tbS.innerHTML='<button type="button" data-act="nav" data-v="portal" aria-current="page">'+
        ico('students')+'<span>'+t('nav.portal')+'</span></button>';
    }
    return;
  }

  var h='',g='';
  var hideFin=!!S.settings.hideFinance;
  var lvl=myLevel();
  var isTeachingCS=(r==='cs'&&typeof canTeach==='function'&&canTeach());

  NAV.forEach(function(n){
    var v=n[0];
    if(hideFin&&(v==='fees'||v==='pay'))return;
    if(lvl<5&&v==='acc')return;
    if(lvl<4&&(v==='regions'||v==='compare'))return;
    if(lvl<3&&(v==='centers'||v==='supervisors'||v==='teachers'||v==='atrisk'))return;
    if(lvl<2&&!isTeachingCS&&['msg','sessions','att','quran','rash','points','recordings','tilawat','books','week','leaves'].indexOf(v)>=0)return;

    if(n[4]!==g){g=n[4];if(g)h+='<h4>'+g+'</h4>';}
    h+='<button type="button" data-act="nav" data-v="'+v+'"'+
       (S.view===v?' aria-current="page"':'')+'>'+
       ico(n[3])+esc(t('nav.'+v)||n[1])+'</button>';
  });

  var navEl=$('#nav');
  if(navEl)navEl.innerHTML=h;

  var prim=['dash','att','quran','students'];
  var tb=$('#tabbar');
  if(tb){
    tb.innerHTML=prim.map(function(id){
      var n=NAV.filter(function(x){return x[0]===id;})[0];
      if(!n)return '';
      return '<button type="button" data-act="nav" data-v="'+id+'"'+
             (S.view===id?' aria-current="page"':'')+'>'+
             ico(n[3])+'<span>'+esc(t('nav.'+id)||n[2])+'</span></button>';
    }).join('')+
    '<button type="button" data-act="more"'+
    (prim.indexOf(S.view)<0?' aria-current="page"':'')+'>'+
    ico('more')+'<span>'+t('nav.more')+'</span></button>';
  }
};
