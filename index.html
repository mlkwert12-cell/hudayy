var MEDIA = {
  recorder:null, chunks:[], stream:null, startTime:0,
  supported:function(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },
  start:function(){
    var self = MEDIA;
    if(!self.supported()) return Promise.reject(new Error('التسجيل غير مدعوم في هذا المتصفح'));
    return navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      self.stream = stream; self.chunks = [];
      var mime = '';
      if(MediaRecorder.isTypeSupported('audio/webm')) mime = 'audio/webm';
      else if(MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';
      else if(MediaRecorder.isTypeSupported('audio/ogg')) mime = 'audio/ogg';
      self.recorder = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream);
      self.recorder.ondataavailable = function(ev){
        if(ev.data && ev.data.size > 0) self.chunks.push(ev.data);
      };
      self.recorder.start(1000);
      self.startTime = Date.now();
      return true;
    });
  },
  stop:function(){
    var self = MEDIA;
    return new Promise(function(resolve){
      if(!self.recorder) return resolve(null);
      self.recorder.onstop = function(){
        var blob = new Blob(self.chunks, {type:self.recorder.mimeType||'audio/webm'});
        if(self.stream) self.stream.getTracks().forEach(function(t2){ t2.stop(); });
        var duration = Math.round((Date.now() - self.startTime)/1000);
        self.chunks = []; self.recorder = null; self.stream = null;
        resolve({blob:blob, duration:duration});
      };
      self.recorder.stop();
    });
  },
  cancel:function(){
    var self = MEDIA;
    if(self.recorder) try { self.recorder.stop(); } catch(e){}
    if(self.stream) self.stream.getTracks().forEach(function(t2){ t2.stop(); });
    self.chunks = []; self.recorder = null; self.stream = null;
  }
};
function blobToBase64(blob){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(reader.error); };
    reader.readAsDataURL(blob);
  });
}
function saveRecording(sid, meta, blob, duration){
  return blobToBase64(blob).then(function(dataUrl){
    var id = uid();
    var rec = {
      studentId:sid,
      page:meta.page || '',

      note:meta.note || '',
      date:today(),
      duration:duration || 0,
      dataUrl:dataUrl,
      ts:Date.now(),
      by:SB.user ? SB.user.id : 'local'
    };
    return Data.put('recordings', id, rec).then(function(){ return id; });
  });
}

/* ---------- openReport ---------- */
function periodRange(){
  var k = S.ui.rpp || 'all';
  var t2 = today();
  if(k === '30'){
    var d = new Date(); d.setDate(d.getDate()-30);
    return {f:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()), t:t2, label:'آخر 30 يوماً'};
  }
  if(k === 'month') return {f:t2.slice(0,8)+'01', t:t2, label:'شهر '+t2.slice(0,7)};
  return {f:'', t:'', label:'كل الفترة'};
}
function reportMarkup(sid){
  var s = D.sMap[sid];
  if(!s) return '<p class="note">الطالب غير موجود.</p>';
  var pr = periodRange();
  var pt = pointsOf(sid, pr.f, pr.t);
  var mm = memoOf(sid);
  var tot = pt.p + pt.l + pt.a;
  var p = D.pg[sid] || {};
  var recs = (p.rec||[]).filter(function(e){ return inR(e.d, pr.f, pr.t); })
    .sort(function(a,b){ return a.d < b.d ? 1 : -1; }).slice(0,8);
  var exams = (p.exams||[]).filter(function(e){ return inR(e.d, pr.f, pr.t); })
    .sort(function(a,b){ return a.d < b.d ? 1 : -1; });
  var notes = S.studentnotes.filter(function(n){ return n.studentId===sid; })
    .sort(function(a,b){ return (b.ts||0) - (a.ts||0); }).slice(0,5);
  var en = S.enrollments.filter(function(e){ return e.studentId===sid && e.year===curYear(); })[0];
  var rem = en ? Math.max(0, bal(en.id)) : null;

  var h = '<div class="rp"><div class="rp-h">'+
    '<div><h2>تقرير الطالب</h2><small>'+esc(S.settings.institution)+'</small></div>'+
    '<div><b>'+esc(s.name)+'</b>'+
      '<small>رقم '+esc(s.no)+(en?' · '+esc(en.stage+' '+en.section+' · '+en.shift):'')+'</small>'+
      '<small>'+esc(pr.label)+' · '+today()+'</small>'+
    '</div></div>';

  h += '<div class="rp-grid">'+
    '<div class="rp-box"><small>إجمالي النقاط</small><b>'+fmt(pt.total)+'</b></div>'+
    '<div class="rp-box"><small>الحضور</small><b>'+(tot?Math.round(pt.p/tot*100)+'%':'—')+'</b>'+
      '<small>'+pt.p+' حضور · '+pt.l+' تأخر · '+pt.a+' غياب</small></div>'+
    '<div class="rp-box"><small>الحفظ</small><b>'+mm.count+' / 604</b>'+
      '<small>'+mm.pct+'% · '+mm.done+' جزءاً</small></div>'+
    (!S.settings.hideFinance && rem != null ?
      '<div class="rp-box"><small>المتبقي</small><b>'+fmt(rem)+'</b><small>'+esc(S.settings.currency)+'</small></div>' : '')+
  '</div>';

  h += '<div><h3>تفصيل النقاط</h3><table><tbody>'+
    '<tr><td>الحضور</td><td class="n">'+sg(pt.att)+'</td></tr>'+
    '<tr><td>التسميع</td><td class="n">'+sg(pt.rec)+'</td></tr>'+
    '<tr><td>الاختبارات</td><td class="n">'+sg(pt.exam)+'</td></tr>'+
    '<tr><td>إضافات المعلم</td><td class="n">'+sg(pt.add)+'</td></tr>'+
    '<tr><td>مكافأة الحضور</td><td class="n">'+sg(pt.streak)+'</td></tr>'+
    '<tr><td><b>المجموع</b></td><td class="n"><b>'+fmt(pt.total)+'</b></td></tr>'+
  '</tbody></table></div>';

  if(recs.length){
    h += '<div><h3>آخر التسميعات</h3><table><thead><tr><th>التاريخ</th><th>الجزء</th><th>الصفحة</th><th>التقدير</th></tr></thead><tbody>'+
      recs.map(function(r){
        return '<tr><td>'+esc(r.d)+'</td><td>'+r.juz+'</td><td>'+r.page+'</td><td>'+GRADES[r.g]+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  if(exams.length){
    h += '<div><h3>الاختبارات</h3><table><thead><tr><th>التاريخ</th><th>الاختبار</th><th class="n">العلامة</th></tr></thead><tbody>'+
      exams.map(function(e){
        return '<tr><td>'+esc(e.d)+'</td><td>'+esc(e.title)+'</td><td class="n">'+fmt(e.mark)+' / '+fmt(e.max)+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  if(notes.length){
    h += '<div><h3>ملاحظات</h3>'+notes.map(function(n){
      return '<div class="rp-note">'+esc(n.text)+' <small>'+esc(n.date)+'</small></div>';
    }).join('')+'</div>';
  }
  return h + '<div class="rp-foot">جزاكم الله خيراً على متابعتكم</div></div>';
}
function reportText(sid){
  var s = D.sMap[sid];
  if(!s) return '';
  var pr = periodRange();
  var pt = pointsOf(sid, pr.f, pr.t);
  var mm = memoOf(sid);
  var en = S.enrollments.filter(function(e){ return e.studentId===sid && e.year===curYear(); })[0];
  var rem = en ? Math.max(0, bal(en.id)) : 0;
  var L = [
    'السلام عليكم ورحمة الله،',
    'تقرير الطالب/ة '+s.name+' ('+pr.label+') من '+S.settings.institution+':',
    '- الحضور: '+pt.p+' حضور، '+pt.l+' تأخر، '+pt.a+' غياب',
    '- مجموع النقاط: '+fmt(pt.total),
    '- الحفظ: '+mm.count+' صفحة من 604 ('+mm.pct+'%)، والأجزاء المكتملة: '+mm.done
  ];
  if(!S.settings.hideFinance && rem > 0){
    L.push('- المتبقي من الرسوم: '+fmt(rem)+' '+S.settings.currency);
  }
  L.push('جزاكم الله خيراً على متابعتكم.');
  return L.join('\n');
}
function openReport(sid){
  M.push({
    title: function(){ return 'تقرير الطالب — '+sName(sid); },
    live:1, wide:1,
    body:function(){
      var s = D.sMap[sid];
      if(!s) return '<p class="note">الطالب غير موجود.</p>';
      var text = reportText(sid);
      var link = waLink(s.guardianPhone || s.phone, text);

        '<select data-bind="rpp" aria-label="فترة التقرير">'+

        '<button type="button" class="btn" data-act="printRpt" data-id="'+sid+'">'+ico('rep')+'طباعة</button>'+

      '</div>';
    }
  });
}

ACT.saveSession = function(){
  if(!canWrite()) return;
  var st = S.ui.session; if(!st) return;
  if(!st.stage || !st.section || !st.shift){ toast('اختر المرحلة والقسم والفترة.'); return; }
  if(!st.title) st.title = (SESS_ROUNDS[st.round-1]||'حصة')+' — '+st.date;
  var students = sessionEnrolls(st);
  if(!students.length){ toast('لا يوجد طلاب في هذه الفئة.'); return; }
  var valid = {};
  students.forEach(function(e){ valid[e.studentId] = true; });
  var marks = {};
  Object.keys(st.attendance).forEach(function(sid){
    if(st.attendance[sid] && valid[sid]) marks[sid] = st.attendance[sid];
  });
  var sessionId = st.id || uid();
  var sessionDoc = {
    type:st.type, date:st.date, time:st.time, round:st.round,
    title:st.title, teacherId:st.teacherId,
    stage:st.stage, section:st.section, shift:st.shift,
    status:'تمت',
    bookId:st.bookId||'', lessonId:st.lessonId||'',
    lessonOrder: st.lessonId && D.lessonMap[st.lessonId] ? num(D.lessonMap[st.lessonId].order) : 0,
    pageFrom:st.pageFrom||0, pageTo:st.pageTo||0,
    content:st.content||'', notes:st.notes||{},
    creditToStudents:!!st.creditToStudents,
    attendanceCount:{p:0, l:0, a:0},
    recitationsCount:st.recitations.length,
    savedAt:Date.now(),
    savedBy:SB.user ? SB.user.id : 'local'
  };
  Object.keys(marks).forEach(function(sid){
    sessionDoc.attendanceCount[marks[sid]] = (sessionDoc.attendanceCount[marks[sid]]||0) + 1;
  });
  var promises = [];
  if(Object.keys(marks).length){
    promises.push(Data.mergeMarks('attendance', st.date, marks));
  }
  st.recitations.forEach(function(r){
    promises.push(saveProg(r.sid, function(p){
      p.rec = p.rec.filter(function(x){ return x.sessionId !== sessionId; });
      for(var pn=r.fromPage; pn<=r.toPage; pn++){
        var jp = absToJP(pn);
        p.rec.push({
          id:uid(), d:st.date, juz:jp.juz, page:jp.page,
          g:r.g, t:'new', note:r.note||'', sessionId:sessionId,
          ts:Date.now() + pn
        });
      }
    }));
  });
  if(st.creditToStudents && st.pageFrom && st.pageTo){
    Object.keys(marks).forEach(function(sid){
      if(marks[sid] !== 'p' && marks[sid] !== 'l') return;
      promises.push(saveProg(sid, function(p){
        p.rec = p.rec.filter(function(x){ return x.sessionId !== sessionId; });
        for(var pn=st.pageFrom; pn<=st.pageTo; pn++){
          var jp = absToJP(pn);
          p.rec.push({
            id:uid(), d:st.date, juz:jp.juz, page:jp.page,
            g:'good', t:'new', note:'', sessionId:sessionId,
            ts:Date.now() + pn
          });
        }
      }));
    });
  }
  promises.push(Data.put('sessions', sessionId, sessionDoc));
  Promise.all(promises).then(function(){
    toast('حُفظت الحصة مع الحضور'+(st.recitations.length?' والتسميع':''));
    S.ui.session = null;
    S.ui.openSessionId = '';
    render();
  }, function(e){ toast(errMsg(e)); });
};

ACT.doLessonsImport = function(){
  var p = S.ui.__lessonsImport; if(!p) return;
  var jobs = [];
  p.preview.forEach(function(bk){
    if(!bk.matched) return;
    var items = p.byBook[bk.bookName] || [];
    var existingOrders = {};
    S.lessons.filter(function(l){ return l.bookId===bk.bookId; })
      .forEach(function(l){ existingOrders[num(l.order)] = true; });
    items.forEach(function(it){
      if(existingOrders[it.order]) return;
      jobs.push({bookId:bk.bookId, order:it.order, title:it.title, pageFrom:it.pageFrom, pageTo:it.pageTo, objectives:it.objectives});
    });
  });
  if(!jobs.length){ toast('لا توجد دروس جديدة.'); return; }
  M.pop();
  toast('جارٍ استيراد '+jobs.length+' درساً...');
  var i = 0, fail = null;
  function step(){
    if(i >= jobs.length || fail) return Promise.resolve();
    var j = jobs[i++];
    return Data.put('lessons', uid(), j).then(step, function(e){ fail = e; });
  }
  var workers = [];
  for(var k=0; k<5; k++) workers.push(step());
  Promise.all(workers).then(function(){
    if(fail){ toast(errMsg(fail)); return; }
    toast('تم استيراد '+jobs.length+' درساً');
    S.ui.__lessonsImport = null;
  });
};

ACT.restoreBackup = function(){
  if(!canWrite()) return;
  var input = document.createElement('input');
  input.type = 'file'; input.accept = '.json'; input.style.display = 'none';
  input.addEventListener('change', function(){
    var f = input.files && input.files[0]; if(!f) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var data = JSON.parse(e.target.result);
        if(!data.version || !data.settings){ toast('الملف ليس نسخة احتياطية صالحة.'); return; }
        requirePassword(function(){
          confirmBox('استعادة النسخة','سيتم استبدال كل البيانات الحالية بمحتوى النسخة. لا يمكن التراجع.','استعادة',
            function(){ performRestore(data); });
        });
      } catch(err){ toast('تعذّر تحليل الملف: '+(err.message||'')); }
    };
    reader.readAsText(f);
  });
  document.body.appendChild(input); input.click();
  setTimeout(function(){ input.remove(); }, 60000);
};
function performRestore(data){
  toast('جارٍ الاستعادة...');
  var ops = [];
  ops.push(function(){ return Data.put('settings', 'main', data.settings); });
  COLS.forEach(function(c){
    var items = Array.isArray(data[c]) ? data[c] : [];
    if(!items.length) return;
    ops.push(function(){
      var batch = items.map(function(item){
        var d = Object.assign({}, item);
        var id = d.id || uid();
        delete d.id;
        return {id:id, data:d};
      });
      return batchPut(c, batch);
    });
  });
  var p = Promise.resolve();
  ops.forEach(function(op){ p = p.then(op); });
  p.then(function(){ toast('اكتملت الاستعادة'); render(); },
    function(e){ toast('فشلت: '+(e.message||errMsg(e))); });
}

  var qs = S.ui.quiz; if(!qs) return;
  var bank = EXAMS_BANK[qs.topic] || [];
  if(qs.answers[qs.idx] == null) return;
  if(qs.idx < bank.length-1){ qs.idx++; render(); }
  else {
    var correct = 0;
    bank.forEach(function(q, i){ if(qs.answers[i]===q.a) correct++; });
    qs.done = true;
    qs.score = correct;
    if(qs.studentId){
      Data.put('exams', uid(), {
        studentId:qs.studentId,
        type:qs.topic,
        topic:EXAM_TYPES[qs.topic]||qs.topic,
        score:correct, total:bank.length,
        date:today(), ts:Date.now()
      }).catch(function(){});
    }
    render();
  }
};

/* --- Exports --- */
function xlsxOne(name, sheetName, head, rows){
  if(typeof XLSX === 'undefined'){ toast('مكتبة Excel غير محمّلة.'); return; }
  if(!rows.length){ toast('لا توجد بيانات.'); return; }
  try {
    var wb = XLSX.utils.book_new();
    wb.Workbook = {Views:[{RTL:true}]};
    var ws = XLSX.utils.aoa_to_sheet([head].concat(rows));
    ws['!cols'] = head.map(function(h){ return {wch:Math.max(14, String(h).length+4)}; });
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    downloadBlob(name+'-'+today()+'.xlsx',
      XLSX.write(wb, {type:'array', bookType:'xlsx'}),
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  } catch(e){ toast('تعذّر إنشاء الملف.'); }
}

function maxNum(collection, field, fallback){
  return collection.reduce(function(m, x){ var n = num(x[field]); return n>m?n:m; }, fallback);
}
function maxSelfNo(collection, prefix){
  return collection.reduce(function(m, x){
    var n = num(String(x.self_no||'').replace(/\D/g, ''));
    if(Math.floor(n/1000) === prefix && n > m) return n;
    return m;
  }, prefix*1000);
}
function triggerFile(col){
  if(typeof XLSX === 'undefined'){ toast('مكتبة Excel غير محمّلة.'); return; }
  var input = document.createElement('input');
  input.type = 'file'; input.accept = '.xlsx,.xls,.csv'; input.style.display = 'none';
  input.addEventListener('change', function(){
    var f = input.files && input.files[0]; if(!f) return;
    if(f.size > 5*1024*1024){ toast('الملف أكبر من 5 ميغابايت.'); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var wb = XLSX.read(e.target.result, {type:'array'});
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        if(!rows.length){ toast('الملف فارغ.'); return; }
        parseAndPreview(col, rows);
      } catch(err){ toast('تعذّر قراءة الملف: '+(err.message||'')); }
    };
    reader.onerror = function(){ toast('تعذّر فتح الملف.'); };
    reader.readAsArrayBuffer(f);
  });
  document.body.appendChild(input); input.click();
  setTimeout(function(){ input.remove(); }, 60000);
}
function parseAndPreview(col, rows){
  var def = IMP_DEFS[col];
  var headersRaw = Object.keys(rows[0] || {});
  var mapped = {};
  headersRaw.forEach(function(h){
    var clean = String(h).trim().replace(/^\uFEFF/, '');
    if(def.fieldMap[clean]) mapped[def.fieldMap[clean]] = h;
  });
  if(!mapped.name){ toast('عمود «الاسم» مفقود.'); return; }
  var existingNames = {};
  S[col].forEach(function(x){
    var k = String(x.name||'').trim().toLowerCase();
    if(k) existingNames[k] = true;
  });
  var parsed = [], errors = [], dupes = 0;
  rows.forEach(function(raw, i){
    var r = {};
    Object.keys(mapped).forEach(function(k){ r[k] = raw[mapped[k]]; });
    var nameKey = String(r.name||'').trim().toLowerCase();
    if(nameKey && existingNames[nameKey]){ dupes++; return; }
    if(nameKey) existingNames[nameKey] = true;
    var res = def.build(r);
    if(res.err) errors.push({row:i+2, name:r.name||'', err:res.err});
    else parsed.push({row:i+2, data:res.ok});
  });
  S.ui.__imp = {col:col, parsed:parsed, errors:errors, dupes:dupes, total:rows.length};
  showPreview(col);
}
function showPreview(col){
  var def = IMP_DEFS[col];
  M.push({
    title: 'استيراد '+def.label+' — معاينة',
    wide: 1,
    body:function(){
      var d = S.ui.__imp;
      if(!d) return '<p class="note">لا توجد بيانات.</p>';
      var valid = d.parsed.length, errs = d.errors.length, dupes = d.dupes;
      var s = '<div class="sumrow">'+
        '<div><small>إجمالي</small><b>'+d.total+'</b></div>'+
        '<div><small>صالحة</small><b style="color:var(--good)">'+valid+'</b></div>'+
        '<div><small>مرفوضة</small><b style="color:var(--bad)">'+(errs+dupes)+'</b></div>'+
      '</div>';
      if(dupes > 0) s += '<p class="note" style="margin-top:10px">'+dupes+' صف مكرر (موجود مسبقاً).</p>';
      if(errs > 0){
        s += '<h3 style="margin-top:14px">صفوف مرفوضة ('+errs+')</h3>'+
          '<div class="tw" style="max-height:220px;overflow:auto"><table>'+
          '<thead><tr><th>الصف</th><th>الاسم</th><th>السبب</th></tr></thead><tbody>'+
          d.errors.slice(0,50).map(function(e){
            return '<tr><td>'+e.row+'</td><td>'+esc(e.name||'—')+'</td><td>'+esc(e.err)+'</td></tr>';
          }).join('')+'</tbody></table></div>'+
          (errs>50 ? '<p class="note">... و'+(errs-50)+' صف آخر.</p>' : '');
      }
      if(valid > 0){
        s += '<h3 style="margin-top:14px">عيّنة (5)</h3>'+
          '<div class="tw"><table><thead><tr><th>الاسم</th><th>تفاصيل</th></tr></thead><tbody>'+
          d.parsed.slice(0,5).map(function(p){
            var detail = p.data.phone || p.data.guardianPhone || p.data.area || p.data.specialty || '—';
            return '<tr><td>'+esc(p.data.name)+'</td><td>'+esc(detail)+'</td></tr>';
          }).join('')+'</tbody></table></div>';
      }
      s += '<div class="mact" style="margin-top:14px">'+
        '<button type="button" class="btn pri" data-act="doImportExcel"'+(valid?'':' disabled')+'>استيراد '+valid+' سجل</button>'+
        '<button type="button" class="btn" data-act="close">إلغاء</button>'+
      '</div>';
      return s;
    }
  });
}
ACT.importExcel = function(d){
  var col = d && d.col;
  if(!IMP_DEFS[col]) return;
  if(col === 'students' && !canWrite()){ toast('ليست لديك صلاحية.'); return; }
  if((col === 'teachers' || col === 'supervisors') && !isAtLeast(3)){ toast('متاح للمشرف فما فوق.'); return; }
  triggerFile(col);
};
ACT.doImportExcel = function(){
  var d = S.ui.__imp;
  if(!d || !d.parsed.length){ toast('لا يوجد شيء للاستيراد.'); return; }
  var col = d.col;
  var toAdd = d.parsed.map(function(p){ return p.data; });
  var baseNo = 0, baseSelfNo = 0;
  if(col === 'students'){
    baseNo = maxNum(S.students, 'no', 1000) + 1;
    baseSelfNo = maxSelfNo(S.students, 1) + 1;
  } else if(col === 'teachers'){
    baseSelfNo = maxSelfNo(S.teachers, 2) + 1;
  } else if(col === 'supervisors'){
    baseSelfNo = maxSelfNo(S.supervisors, 3) + 1;
  }
  var items = toAdd.map(function(item, i){
    if(col === 'students'){ item.no = baseNo + i; item.self_no = baseSelfNo + i; }
    else if(col === 'teachers' || col === 'supervisors'){ item.self_no = baseSelfNo + i; }
    item.createdBy = SB.user ? SB.user.id : 'local';
    item.createdByRole = myRole();
    return {id:uid(), data:item};
  });
  M.pop();
  toast('جارٍ استيراد '+items.length+' سجل...');
  batchPut(col, items).then(function(){
    S.ui.__imp = null;
    toast('تم استيراد '+items.length+' سجل بنجاح');
  }, function(e){ toast('تعذّر الاستيراد: '+(e.message||errMsg(e))); });
};
