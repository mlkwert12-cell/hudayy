ACT.newSession = function(d){
  if(!canWrite()) return;
  var st = newSessionState();
  if(d && d.book){
    st.bookId = d.book;
    st.type = 'musahib';
    if(st.teacherId){
      var next = nextLessonFor(st.teacherId, d.book);
      if(next){
        st.lessonId = next.id;
        st.lessonOrder = num(next.order);
        st.title = next.title || '';
      }
    }
  }
  S.ui.session = st;
  S.ui.openSessionId = 'new';
  render();
  window.scrollTo(0,0);
};
ACT.openSession = function(d){
  var s = find('sessions', d.id);
  if(!s) return;
  var st = {
    id:s.id,
    type:s.type || 'talqeen',
    date:s.date,
    time:s.time || '',
    round:s.round || 1,
    title:s.title || '',
    teacherId:s.teacherId || '',
    stage:s.stage || '',
    section:s.section || '',
    shift:s.shift || '',
    status:s.status || 'مجدولة',
    bookId:s.bookId || '',
    lessonId:s.lessonId || '',
    lessonOrder:s.lessonOrder || 0,
    pageFrom:s.pageFrom || 0,
    pageTo:s.pageTo || 0,
    content:s.content || '',
    attendance:{},
    recitations:[],
    notes:Object.assign({},s.notes||{}),
    creditToStudents:!!s.creditToStudents
  };
  // فلترة الحضور للطلاب الحاليين فقط
  var valid = {};
  sessionEnrolls(st).forEach(function(e){valid[e.studentId]=true;});
  var allMarks = D.att[s.date] || {};
  Object.keys(allMarks).forEach(function(sid){
    if(valid[sid]) st.attendance[sid] = allMarks[sid];
  });
  sessionEnrolls(st).forEach(function(e){
    var p = D.pg[e.studentId];
    if(!p) return;
    var q = (p.rec || []).filter(function(x){return x.sessionId === s.id && x.src !== 'talqeen';});
    var r = (p.rash || []).filter(function(x){return x.sessionId === s.id;});
    if(q.length){
      var pgs = q.map(function(x){return absPage(x.juz, x.page);});
      st.recitations.push({sid:e.studentId, fromPage:Math.min.apply(null,pgs), toPage:Math.max.apply(null,pgs), g:q[0].g, note:q[0].note||'', track:'quran'});
    } else if(r.length){
      var pr = r.map(function(x){return num(x.page);});
      st.recitations.push({sid:e.studentId, fromPage:Math.min.apply(null,pr), toPage:Math.max.apply(null,pr), g:r[0].g, note:r[0].note||'', track:'rash'});
    }
  });
  S.ui.session = st;
  S.ui.openSessionId = s.id;
  render();
  window.scrollTo(0,0);
};
ACT.closeSession = function(){
  S.ui.session = null;
  S.ui.openSessionId = '';
  render();
};
ACT.delSession = function(d){
  var s = find('sessions', d.id);
  if(!s) return;
  confirmBox('حذف الحصة',
    'ستُحذف حصة «'+s.title+'» بتاريخ '+s.date+' نهائياً.',
    'حذف',
    function(){
      Data.del('sessions', s.id).then(function(){
        toast('حُذفت');
      },function(e){toast(errMsg(e));});
    });
};
/* ============================================================
   ACT — نوع الحصة
   ============================================================ */
ACT.setSessionType = function(d){
  if(!S.ui.session) return;
  S.ui.session.type = d.t;
  if(d.t !== 'talqeen' && d.t !== 'manhaj' && d.t !== 'musahib'){
    S.ui.session.bookId = '';
    S.ui.session.lessonId = '';
    S.ui.session.lessonOrder = 0;
    S.ui.session.pageFrom = 0;
    S.ui.session.pageTo = 0;
    S.ui.session.creditToStudents = false;
  }
  if(d.t === 'talqeen'){
    S.ui.session.bookId = '';
    S.ui.session.lessonId = '';
    S.ui.session.lessonOrder = 0;
  }
  render();
};
/* ============================================================
   ACT — الحضور
   ============================================================ */
ACT.sessMark = function(d){
  if(!S.ui.session) return;
  var st = S.ui.session;
  if(st.attendance[d.sid] === d.st) delete st.attendance[d.sid];
  else st.attendance[d.sid] = d.st;
  render();

ACT.saveSession = function(){
  if(!canWrite()) return;
  var st = S.ui.session;
  if(!st) return;
  if(!st.stage || !st.section || !st.shift){
    toast('اختر المرحلة والقسم والفترة.');
    return;
  }
  if(!st.title){
    st.title = (SESS_ROUNDS[st.round-1]||'حصة') + ' — ' + st.date;
  }
  var students = sessionEnrolls(st);
  if(!students.length){
    toast('لا يوجد طلاب في هذه الفئة.');
    return;
  }
  var valid = {};
  students.forEach(function(e){valid[e.studentId]=true;});
  var marks = {};
  Object.keys(st.attendance).forEach(function(sid){
    if(st.attendance[sid] && valid[sid]) marks[sid] = st.attendance[sid];
  });
  var sessionId = st.id || uid();
  var recBy = {};
  st.recitations.forEach(function(r){
    if(valid[r.sid] && marks[r.sid] !== 'a') recBy[r.sid] = r;
  });
  var notes = {};
  Object.keys(st.notes || {}).forEach(function(k){
    if(valid[k] && String(st.notes[k]||'').trim()) notes[k] = String(st.notes[k]).trim();
  });
  var sessionDoc = {
    type:st.type,
    date:st.date,
    time:st.time,
    round:st.round,
    title:st.title,
    teacherId:st.teacherId,
    stage:st.stage,
    section:st.section,
    shift:st.shift,
    status:'تمت',
    bookId:st.bookId||'',
    lessonId:st.lessonId||'',
    lessonOrder: st.lessonId && D.lessonMap[st.lessonId] ? num(D.lessonMap[st.lessonId].order) : 0,
    pageFrom:st.pageFrom||0,
    pageTo:st.pageTo||0,
    content:st.content||'',
    notes:notes,
    creditToStudents:!!st.creditToStudents,
    attendanceCount:{p:0,l:0,a:0},
    recitationsCount:Object.keys(recBy).length,
    savedAt:Date.now(),
    savedBy:SB.user ? SB.user.id : 'local'
  };
  Object.keys(marks).forEach(function(sid){
    sessionDoc.attendanceCount[marks[sid]] = (sessionDoc.attendanceCount[marks[sid]]||0) + 1;
  });
  var promises = [];
  if(Object.keys(marks).length){
    promises.push(Data.mergeMarks('attendance', st.date, marks));
  }
  students.forEach(function(e){
    var sid = e.studentId;
    var r = recBy[sid];
    var isR = (D.sMap[sid] && D.sMap[sid].track) === 'الرشيدي';
    var prev = D.pg[sid];
    var had = prev && (prev.rec || []).concat(prev.rash || []).some(function(x){return x.sessionId === sessionId;});
    var talq = st.creditToStudents && st.pageFrom && st.pageTo && !isR &&
      (marks[sid] === 'p' || marks[sid] === 'l');
    if(!r && !had && !talq) return;
    promises.push(saveProg(sid, function(p){
      p.rec = p.rec.filter(function(x){return x.sessionId !== sessionId;});
      p.rash = (p.rash || []).filter(function(x){return x.sessionId !== sessionId;});
      var base = Date.now();
      if(r){
        for(var pn = r.fromPage; pn <= r.toPage; pn++){
          if(r.track === 'rash'){
            p.rash.push({id:uid(), d:st.date, page:pn, g:r.g, note:r.note||'', sessionId:sessionId, ts:base+pn});
          } else {
            var jp = absToJP(pn);
            p.rec.push({id:uid(), d:st.date, juz:jp.juz, page:jp.page, g:r.g, t:'new', note:r.note||'', sessionId:sessionId, ts:base+pn});
          }
        }
      }
      if(talq){
        for(var tn = st.pageFrom; tn <= st.pageTo; tn++){
          var jq = absToJP(tn);
          p.rec.push({id:uid(), d:st.date, juz:jq.juz, page:jq.page, g:'good', t:'new', note:'', sessionId:sessionId, src:'talqeen', ts:base+tn});
        }
      }
    }));
  });
  promises.push(Data.put('sessions', sessionId, sessionDoc));
  Promise.all(promises).then(function(){
    toast('حُفظت الحصة: حضور' + (Object.keys(recBy).length?' وتسميع':'') + ' وملاحظات');
    S.ui.session = null;
    S.ui.openSessionId = '';
    S.view = 'dash';
    render();
    window.scrollTo(0,0);
  },function(e){
    toast(errMsg(e));
  });
};

document.addEventListener('input',function(ev){
  if(!S.ui.session) return;
  var t = ev.target;
  var k = t.getAttribute && t.getAttribute('data-sess');
  if(k){
    if(t.type === 'checkbox') S.ui.session[k] = t.checked;
    else if(k === 'round') S.ui.session[k] = num(t.value) || 1;
    else S.ui.session[k] = t.value;
    var needsRender = ['stage','section','shift','round','bookId','lessonId'].indexOf(k) >= 0;
    if(k === 'bookId'){
      S.ui.session.lessonId = '';
      S.ui.session.lessonOrder = 0;
      if(t.value && S.ui.session.teacherId){
        var next = nextLessonFor(S.ui.session.teacherId, t.value);
        if(next){
          S.ui.session.lessonId = next.id;
          S.ui.session.lessonOrder = num(next.order);
          if(!S.ui.session.title) S.ui.session.title = next.title || '';
        }
      }
      needsRender = true;
    }
    if(k === 'lessonId' && t.value){
      var l = D.lessonMap[t.value];
      if(l){
        S.ui.session.lessonOrder = num(l.order);
        if(!S.ui.session.pageFrom && l.pageFrom) S.ui.session.pageFrom = l.pageFrom;
        if(!S.ui.session.pageTo && l.pageTo) S.ui.session.pageTo = l.pageTo;
      }
    }
    if(needsRender) render();
    return;
  }
  var nk = t.getAttribute && t.getAttribute('data-sess-note');
  if(nk){
    S.ui.session.notes[nk] = t.value;
  }
});

    '<span class="pill warn">متأخر '+c.l+'</span>'+

function computeBadges(sid){
  var badges = [];
  var mm = memoOf(sid);
  var pt = pointsOf(sid, '', '');
  var ro = rashOf(sid);
  if(mm.done >= 1)  badges.push({title:'أتمّ جزءاً', desc:mm.done+' جزءاً', icon:'quran'});
  if(mm.done >= 5)  badges.push({title:'حافظ متميز', desc:'5 أجزاء', icon:'quran'});
  if(mm.done >= 10) badges.push({title:'حافظ متقدم', desc:'10 أجزاء', icon:'quran'});
  if(mm.done >= 20) badges.push({title:'حافظ معظم القرآن', desc:'20 جزءاً', icon:'quran'});
  if(mm.done >= 30) badges.push({title:'ختم القرآن', desc:'30 جزءاً', icon:'cert', gold:true});
  if(pt.p >= 30)  badges.push({title:'مواصل', desc:pt.p+' حضور', icon:'att'});
  if(pt.p >= 100) badges.push({title:'منتظم', desc:pt.p+' حضور', icon:'att'});
  if(pt.total >= 100)  badges.push({title:'100 نقطة', desc:'إنجاز', icon:'star'});
  if(pt.total >= 500)  badges.push({title:'500 نقطة', desc:'إنجاز متميز', icon:'star', gold:true});
  if(pt.total >= 1000) badges.push({title:'1000 نقطة', desc:'نجم', icon:'star', gold:true});
  if(pt.nRec >= 50)  badges.push({title:'مجتهد', desc:pt.nRec+' تسميعة', icon:'quran'});
  if(pt.nRec >= 100) badges.push({title:'مثابر', desc:pt.nRec+' تسميعة', icon:'quran'});
  if(pt.nRec >= 300) badges.push({title:'تسميع وفير', desc:pt.nRec+' تسميعة', icon:'quran', gold:true});
  if(ro.done >= RLESSONS) badges.push({title:'ختم الرشيدي', desc:'إتمام الكتاب', icon:'quranbook', gold:true});
  if(pt.streak >= 15) badges.push({title:'سلسلة الحضور', desc:'حضور متواصل', icon:'att'});
  return badges;
}
// ✅ نهاية الجزء 13 من 20 (بعد التحقق)
 // [الجزء 14: القرآن (604) + الرشيدي (124) + الاختبارات + الشهادة التلقائية]
/* ============================================================
   RASHIDI_PAGES — إعادة تعيين عدد دروس الرشيدي إلى 124
   ============================================================ */
var RASHIDI_PAGES = 124;
RLESSONS = RASHIDI_PAGES;
/* ============================================================
   rashOf — يعيد تعريفه: الصفحات 1..124 (بدل الدروس)
   ============================================================ */
function rashOf(sid){
  var p = D.pg[sid];
  var evs = ((p && p.rash) || []).slice().sort(function(a,b){
    return (a.d < b.d ? -1 : a.d > b.d ? 1 : 0) || ((a.ts||0) - (b.ts||0));
  });
  var pages = {};
  evs.forEach(function(e){
    var n = num(e.page) || num(e.item); // توافق مع البيانات القديمة
    if(n >= 1 && n <= RASHIDI_PAGES) pages[n] = e;
  });
  var done = 0, reached = 0;
  for(var i = 1; i <= RASHIDI_PAGES; i++){
    if(pages[i] && pages[i].g !== 'redo'){ done++; reached = i; }
  }
  return {
    evs: evs,
    pages: pages,
    done: done,
    reached: reached,
    pct: Math.round(done / RASHIDI_PAGES * 100),
    completed: done >= RASHIDI_PAGES,
    last: evs[evs.length-1] || null
  };
}
/* ============================================================
   rashExamStatus — حالة الاختبارات
   ============================================================ */
function rashExamStatus(sid){
  var all = S.rashidiExams.filter(function(e){ return e.studentId === sid; });
  var trials = all.filter(function(e){ return e.type === 'trial'; })
    .sort(function(a,b){ return (b.date||'') < (a.date||'') ? -1 : 1; });
  var finals = all.filter(function(e){ return e.type === 'final'; })
    .sort(function(a,b){ return (b.date||'') < (a.date||'') ? -1 : 1; });
  function best(arr){
    if(!arr.length) return null;
    return arr.reduce(function(b, t){
      var tp = num(t.score) / (num(t.max) || 100);
      var bp = num(b.score) / (num(b.max) || 100);
      return tp > bp ? t : b;
    }, arr[0]);
  }
  var bestFinal = best(finals);
  var bestFinalPct = bestFinal ? Math.round(num(bestFinal.score) / (num(bestFinal.max) || 100) * 100) : null;
  return {
    trials: trials,
    finals: finals,
    bestTrial: best(trials),
    bestFinal: bestFinal,
    finalPct: bestFinalPct,
    passed: bestFinalPct != null && bestFinalPct >= 60
  };
}

function rashForm(sid, page){
  var st = sid ? rashOf(sid) : null;
  var suggested = page || (st ? Math.min(RASHIDI_PAGES, st.done + 1) : 1);
  M.push({
    title: 'تسميع الرشيدي',
    values: {studentId: sid || '', page: suggested, g: 'good', d: today()},
    fields: [
      {k:'studentId', l:'الطالب', t:'select', req:1, full:1,
        o: [['','اختر الطالب…']].concat(
          S.students.filter(function(s){
            return s.status === 'مقبول' && (s.track || 'القرآن الكريم') === 'الرشيدي';
          }).sort(function(a,b){return a.name<b.name?-1:1;})
          .map(function(s){return [s.id, s.no+' — '+s.name];})
        )},
      {k:'page', l:'من صفحة (1–'+RASHIDI_PAGES+')', t:'number', req:1, min:1, max:RASHIDI_PAGES},
      {k:'to', l:'إلى صفحة', t:'number', min:1, max:RASHIDI_PAGES, hint:'اتركه فارغاً لصفحة واحدة'},
      {k:'g', l:'النتيجة', t:'select', o:[
        ['good','جيد'],['vgood','جيد جداً'],['excellent','ممتاز'],['redo','إعادة']
      ]},
      {k:'d', l:'التاريخ', t:'date', req:1},
      {k:'note', l:'ملاحظة المعلم', full:1}
    ],
    submit: function(x){
      if(!x.studentId) return 'اختر الطالب.';
      var pg = Math.round(num(x.page));
      var pto = (x.to === '' || x.to == null) ? pg : Math.round(num(x.to));
      if(pg < 1 || pg > RASHIDI_PAGES || pto < pg || pto > RASHIDI_PAGES) return 'الصفحات بين 1 و'+RASHIDI_PAGES+' والأخيرة بعد الأولى.';
      return saveProg(x.studentId, function(p){
        p.rash = (p.rash || []).filter(function(e){
          var k = num(e.page) || num(e.item);
          return k < pg || k > pto;
        });
        var base = Date.now();
        for(var i = pg; i <= pto; i++){
          p.rash.push({
            id: uid(),
            d: x.d,
            page: i,
            g: x.g,
            note: String(x.note || '').trim(),
            ts: base + (i - pg)
          });
        }
      }).then(function(){
        S.ui.rashSid = x.studentId;
        toast('سُجّلت '+(pto - pg + 1)+' صفحة');
      });
    }
  });
}

      var examId = uid();

        studentId: sid,
        type: type,
        score: sc,
        max: mx,
        date: x.date,
        note: String(x.note || '').trim(),
        by: SB.user ? SB.user.id : 'local',
        byRole: myRole(),
        ts: Date.now()
      };
      return Data.put('rashidiExams', examId, data).then(function(){
        toast('سُجّل الاختبار '+(type === 'trial' ? 'التجريبي' : 'النهائي'));
        if(type === 'final'){
          var pct = Math.round(sc / mx * 100);
          if(pct >= 60){

              return c.recipientType === 'student' &&
                     c.recipientId === sid &&
                     (c.kind === 'اجتياز اختبار الرشيدي' || c.source === 'rashidi-final');
            });

                recipientType:'student',
                recipientId: sid,
                kind: 'اجتياز اختبار الرشيدي',

                date: x.date,
                signer: '',
                note: 'نتيجة اختبار الرشيدي النهائي: '+sc+'/'+mx+' ('+pct+'%)',
                certNo: no,
                auto: true,
                source: 'rashidi-final'
              };
              Data.put('certificates', uid(), certData).then(function(){
                toast('✓ صدرت الشهادة تلقائياً: '+certNo(no));
              });
            }
          }
        }
      });
    }
  });

/* ============================================================
   vQuran — صفحة القرآن (604)
   ============================================================ */
function vQuran(){
  var list = S.students.filter(function(s){
    return s.status === 'مقبول' && (s.track || 'القرآن الكريم') === 'القرآن الكريم';
  }).sort(function(a,b){return a.name<b.name?-1:1;});
  var h = vh('الحفظ والتسميع',
    'مصحف المدينة · 604 صفحة · 30 جزءاً',
    W('<button type="button" class="btn pri" data-act="newRec">'+ico('plus')+'تسميع جديد</button>'));
  if(!list.length){
    return h + emptyBox('لا يوجد طلاب في مسار القرآن',
      'الطلاب المسجلون في مسار الرشيدي يظهرون في صفحة الرشيدي.',
      '<button type="button" class="btn" data-act="nav" data-v="rash">الرشيدي</button>');
  }
  var sid = S.ui.quranSid;
  if(!sid || !list.some(function(x){ return x.id === sid; })) sid = list[0].id;
  var mm = memoOf(sid);
  var s = D.sMap[sid];
  var last = lastOf(sid);
  h += '<div class="filters">'+
    '<select id="quranSid" data-bind="quranSid">'+
      selOpts(list.map(function(x){ return [x.id, x.no+' — '+x.name]; }), sid)+
    '</select>'+
  '</div>';
  h += '<section class="kpis">'+
    '<div class="kpi"><small>الصفحات المحفوظة</small><b>'+mm.count+'</b><i>من 604</i></div>'+
    '<div class="kpi"><small>نسبة الإنجاز</small><b>'+mm.pct+'%</b><i>'+esc(s.name)+'</i></div>'+
    '<div class="kpi"><small>أجزاء مكتملة</small><b>'+mm.done+'</b><i>من 30</i></div>'+
    '<div class="kpi"><small>المتبقي</small><b>'+(604-mm.count)+'</b><i>صفحة</i></div>'+
  '</section>';
  function evBox(title, ev){
    if(!ev) return '<div class="kpi"><small>'+title+'</small><b>—</b><i>لا يوجد</i></div>';
    var a = absPage(ev.juz, ev.page);
    return '<div class="kpi"><small>'+title+'</small><b>صفحة '+a+'</b><i>الجزء '+ev.juz+' · '+esc(GRADES[ev.g])+' · '+esc(ev.d)+'</i></div>';
  }
  h += '<section class="kpis">'+
    evBox('آخر قراءة', last.read)+
    evBox('آخر حفظ متقن', last.mem)+
  '</section>';
  // متصفح المصحف
  var rawPage = S.ui.quranPage;
  var dflt = last.read ? absPage(last.read.juz, last.read.page) : 1;
  var qp = Math.min(604, Math.max(1, Math.round(num(rawPage)) || dflt));
  h += '<div class="card"><h2>تصفح المصحف</h2>'+
    '<div class="filters">'+
      '<button type="button" class="btn sm" data-act="qprev" data-n="'+qp+'">السابقة</button>'+
      '<input id="qpage" type="number" min="1" max="604" data-bind="quranPage" value="'+esc(rawPage === undefined ? dflt : rawPage)+'" style="max-width:110px;flex:0 1 110px">'+
      '<button type="button" class="btn sm" data-act="qnext" data-n="'+qp+'">التالية</button>'+
      '<a class="btn pri sm" href="'+esc(quranLink(qp))+'" target="_blank" rel="noopener">فتح صفحة '+qp+'</a>'+
    '</div>'+
    '<p class="note" style="margin-top:8px">الصفحة '+qp+' · الجزء '+absToJP(qp).juz+'</p>'+
  '</div>';
  // شبكة الأجزاء 30
  h += '<div class="card"><h2>الأجزاء (30)</h2>'+
    '<div class="juzs">'+
      range(1, 30).map(function(j){
        var n = mm.per[j], tot = juzPages(j);
        return '<button type="button" class="juz'+(n>=tot?' full':'')+'" '+
          'data-act="pickJuz" data-j="'+j+'" '+
          'aria-pressed="'+(num(S.ui.quranJuz||30)===j)+'">'+
          '<b>'+j+'</b>'+
          '<span class="bar"><i style="width:'+(n/tot*100)+'%"></i></span>'+
          '<small>'+n+'/'+tot+'</small>'+
        '</button>';
      }).join('')+
    '</div>'+
  '</div>';
  // شبكة الصفحات للجزء المختار
  var j = num(S.ui.quranJuz) || 30;
  var pagesHtml = range(1, juzPages(j)).map(function(p){
    var a = absPage(j, p);
    var ev = mm.pages[a];
    return '<button type="button" class="pg'+(ev ? ' g-'+ev.g : '')+'" '+
      'data-act="pickQPage" data-s="'+esc(sid)+'" data-j="'+j+'" data-p="'+p+'" '+
      'aria-label="صفحة '+a+(ev ? ' '+GRADES[ev.g] : '')+'"'+(canWrite()?'':' disabled')+'>'+
      a+'<small>'+(ev ? GRADES_SHORT[ev.g] : '')+'</small>'+
    '</button>';
  }).join('');
  h += '<div class="card"><div class="mh2"><h2 style="margin:0">الجزء '+j+'</h2>'+
    (mm.per[j] >= juzPages(j) ? W('<button type="button" class="btn sm pri" data-act="juzCert" data-s="'+esc(sid)+'" data-j="'+j+'">'+ico('cert')+'شهادة الجزء '+j+'</button>') : '')+
  '</div>'+
    '<div class="pages" style="margin-top:10px">'+pagesHtml+'</div>'+
    '<p class="note" style="margin-top:8px">اضغط أي صفحة لتسجيل تسميعها.</p>'+
  '</div>';
  // آخر التسميعات
  var recs = (D.pg[sid] && D.pg[sid].rec) || [];
  var recent = recs.slice().sort(function(a,b){
    return (b.ts||0) - (a.ts||0) || (a.d < b.d ? 1 : -1);
  }).slice(0, 12);
  if(recent.length){
    h += '<div class="card"><h2>آخر التسميعات</h2><div class="list">'+
      recent.map(function(r){
        var a = absPage(r.juz, r.page);
        return '<div class="li">'+
          '<div>'+
            '<a class="linkb" href="'+esc(quranLink(a))+'" target="_blank" rel="noopener">صفحة '+a+'</a>'+
            ' · ج'+r.juz+
            ' <span class="pill '+(r.g === 'redo' ? 'warn' : 'acc')+'">'+GRADES[r.g]+'</span>'+
            '<small>'+esc(r.d)+(r.note ? ' · '+esc(r.note) : '')+'</small>'+
          '</div>'+
          W('<button type="button" class="ibtn" data-act="delRec" data-s="'+esc(sid)+'" data-id="'+r.id+'" aria-label="حذف">'+ico('trash')+'</button>')+
        '</div>';
      }).join('')+'</div></div>';
  }
  return h;
}

/* ============================================================
   recForm — تسميع صفحة/صفحات قرآن
   ============================================================ */
function recForm(sid, juz, page){
  var lo = sid ? lastOf(sid) : {mem:null, read:null};
  var a0 = (juz && page) ? absPage(juz, page) : (lo.mem ? Math.min(604, absPage(lo.mem.juz, lo.mem.page) + 1) : 1);
  M.push({
    title: 'تسميع القرآن',
    values: {studentId: sid || '', from: a0, to: '', t:'new', g:'good', d: today(), note:''},
    fields: [
      {k:'studentId', l:'الطالب', t:'select', req:1, full:1,
        o:[['','اختر الطالب…']].concat(
          S.students.filter(function(s){return s.status === 'مقبول';})
            .sort(function(a,b){return a.name<b.name?-1:1;})
            .map(function(s){return [s.id, s.no+' — '+s.name];})
        )},
      {k:'from', l:'من صفحة', t:'number', req:1, min:1, max:604, hint:'رقم صفحة المصحف (1–604)'},
      {k:'to', l:'إلى صفحة', t:'number', min:1, max:604, hint:'اتركه فارغاً لصفحة واحدة'},
      {k:'t', l:'نوع الأداء', t:'select', o:[['new','حفظ جديد'],['review','مراجعة'],['tilawa','تلاوة']]},
      {k:'g', l:'التقدير', t:'select', o:[
        ['good','جيد'],['vgood','جيد جداً'],['excellent','ممتاز'],['redo','إعادة']
      ]},
      {k:'d', l:'التاريخ', t:'date', req:1},
      {k:'note', l:'ملاحظات', full:1}
    ],
    submit: function(x){
      if(!x.studentId) return 'اختر الطالب.';
      var a = Math.round(num(x.from));
      var b = (x.to === '' || x.to == null) ? a : Math.round(num(x.to));
      if(a < 1 || a > 604 || b < 1 || b > 604) return 'الصفحة بين 1 و604.';
      if(b < a) return 'الصفحة الأخيرة قبل الأولى.';
      if(b - a >= 60) return 'الحد 60 صفحة في الجلسة.';
      var base = Date.now();
      return saveProg(x.studentId, function(p){
        for(var i = a; i <= b; i++){
          var jp = absToJP(i);
          p.rec.push({
            id: uid(),
            d: x.d,
            juz: jp.juz,
            page: jp.page,
            g: x.g,
            t: x.t,
            note: String(x.note || '').trim(),
            ts: base + (i - a)
          });
        }
      }).then(function(){
        S.ui.quranSid = x.studentId;
        toast('سُجّلت '+(b - a + 1)+' صفحة');
      });
    }
  });
}

    ],
    submit: function(x){

function reportData(){
  var Y = curYear();
  var kind = S.ui.rep || 'roster';
  var st = S.ui.rst || '';
  var sh = S.ui.rsh || '';
  var en = S.enrollments.filter(function(e){
    return e.year === Y && (!st || e.stage === st) && (!sh || e.shift === sh);
  });
  var stageIdx = stageList();
  en.sort(function(a, b){
    return (stageIdx.indexOf(a.stage) - stageIdx.indexOf(b.stage)) ||
      (a.section < b.section ? -1 : a.section > b.section ? 1 : 0) ||
      (sName(a.studentId) < sName(b.studentId) ? -1 : 1);
  });
  var r = { title: '', head: [], rows: [], nums: [], total: null };
  if(kind === 'roster'){
    r.title = 'كشف الطلاب — ' + Y;
    r.head = ['الرقم', 'الطالب', 'المرحلة', 'القسم', 'الفترة', 'حالة التسجيل', 'ولي الأمر', 'الهاتف'];
    r.rows = en.map(function(e){
      var s = D.sMap[e.studentId] || {};
      return [s.no || '', s.name || '', e.stage, e.section, e.shift, e.status, s.guardian || '', s.guardianPhone || s.phone || ''];
    });
  } else if(kind === 'dues'){
    if(S.settings.hideFinance) return r;
    r.title = 'كشف الذمم المتبقية — ' + Y;
    r.head = ['الرقم', 'الطالب', 'المرحلة', 'القسم', 'الفترة', 'الرسوم', 'المدفوع', 'المتبقي'];
    r.nums = [5, 6, 7];
    var t2 = [0, 0, 0];
    en.filter(function(e){ return bal(e.id) > 0; })
      .sort(function(a, b){ return bal(b.id) - bal(a.id); })
      .forEach(function(e){
        var s = D.sMap[e.studentId] || {};
        r.rows.push([s.no || '', s.name || '', e.stage, e.section, e.shift, due(e.id), paid(e.id), bal(e.id)]);
        t2[0] += due(e.id); t2[1] += paid(e.id); t2[2] += bal(e.id);
      });
    r.total = t2;
  } else {
    if(S.settings.hideFinance) return r;
    var from = S.ui.rfrom || '', to = S.ui.rto || '';
    r.title = 'كشف الدفعات' + (from || to ? ' — ' + (from || '…') + ' إلى ' + (to || '…') : '');
    r.head = ['رقم السند', 'التاريخ', 'الطالب', 'المرحلة', 'الفترة', 'المبلغ', 'الطريقة'];
    r.nums = [5];
    var tt = 0;
    S.payments.filter(function(p){
      var e = D.eMap[p.enrollmentId]; if(!e) return false;
      if(st && e.stage !== st) return false;
      if(sh && e.shift !== sh) return false;
      if(from && p.date < from) return false;
      if(to && p.date > to) return false;
      return true;
    }).sort(function(a, b){
      return a.date < b.date ? -1 : a.date > b.date ? 1 : num(a.receiptNo) - num(b.receiptNo);
    }).forEach(function(p){
      var e = D.eMap[p.enrollmentId];
      r.rows.push([p.receiptNo, p.date, sName(e.studentId), e.stage, e.shift, num(p.amount), p.method]);
      tt += num(p.amount);
    });
    r.total = [tt];
  }
  return r;
}

        var k = r.nums.indexOf(i);
        return k >= 0 ? '<td class="n">' + fmt(r.total[k]) + '</td>' : '<td></td>';
      }).join('') + '</tr></tfoot>';
    } else {
      foot = '<tfoot><tr><td colspan="' + r.head.length + '">العدد: ' + fmt(r.rows.length) + '</td></tr></tfoot>';
    }
    h += tbl(cols, shown, foot) + limitNote(r.rows.length) +
      '<p class="note noprint" style="margin-top:10px">للطباعة استخدم أمر الطباعة في المتصفح.</p>';
  }
  h += '</div>';

function csvOf(head, rows){
  return '\uFEFF' + [head].concat(rows).map(function(r){
    return r.map(function(c){
      return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"';
    }).join(',');
  }).join('\r\n');
}
ACT.exportReport = function(){
  var r = reportData();
  if(!r.rows.length){ toast('لا توجد بيانات.'); return; }
  var rows = r.rows.slice();
  if(r.total){
    rows.push(r.head.map(function(h, i){
      if(i === 0) return 'المجموع';
      var k = r.nums.indexOf(i);
      return k >= 0 ? r.total[k] : '';
    }));
  }
  downloadBlob(fname(r.title) + '.csv', csvOf(r.head, rows), 'text/csv;charset=utf-8');
};

    XLSX.utils.book_append_sheet(wb, ws, 'التقرير');
    downloadBlob(fname(r.title) + '.xlsx',
      XLSX.write(wb, { type: 'array', bookType: 'xlsx' }),

function periodRange(){
  var k = S.ui.rpp || 'all';
  var t = today();
  if(k === '30'){
    var d = new Date(); d.setDate(d.getDate() - 30);
    return { f: d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()), t: t, label: 'آخر 30 يوماً' };
  }
  if(k === 'month') return { f: t.slice(0, 8) + '01', t: t, label: 'شهر ' + t.slice(0, 7) };
  return { f: '', t: '', label: 'كل الفترة' };
}
function reportMarkup(sid){
  var s = D.sMap[sid];
  if(!s) return '<p class="note">الطالب غير موجود.</p>';
  var pr = periodRange();
  var pt = pointsOf(sid, pr.f, pr.t);
  var mm = memoOf(sid);
  var tot = pt.p + pt.l + pt.a;
  var p = D.pg[sid] || {};
  var recs = (p.rec || []).filter(function(e){ return inR(e.d, pr.f, pr.t); })
    .sort(function(a, b){ return a.d < b.d ? 1 : -1; }).slice(0, 8);
  var exams = (p.exams || []).filter(function(e){ return inR(e.d, pr.f, pr.t); })
    .sort(function(a, b){ return a.d < b.d ? 1 : -1; });
  var notes = S.studentnotes.filter(function(n){ return n.studentId === sid; })
    .sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); }).slice(0, 5);
  var en = S.enrollments.filter(function(e){ return e.studentId === sid && e.year === curYear(); })[0];
  var rem = en ? Math.max(0, bal(en.id)) : null;
  var h = '<div class="rp">' +
    '<div class="rp-h">' +
      '<div><h2>تقرير الطالب</h2><small>' + esc(S.settings.institution) + '</small></div>' +
      '<div><b>' + esc(s.name) + '</b>' +
        '<small>رقم ' + esc(s.no) + (en ? ' · ' + esc(en.stage + ' ' + en.section + ' · ' + en.shift) : '') + '</small>' +
        '<small>' + esc(pr.label) + ' · ' + today() + '</small></div>' +
    '</div>';
  h += '<div class="rp-grid">' +
    '<div class="rp-box"><small>إجمالي النقاط</small><b>' + fmt(pt.total) + '</b></div>' +
    '<div class="rp-box"><small>الحضور</small><b>' + (tot ? Math.round(pt.p / tot * 100) + '%' : '—') + '</b>' +
      '<small>' + pt.p + ' حضور · ' + pt.l + ' تأخر · ' + pt.a + ' غياب</small></div>' +
    '<div class="rp-box"><small>الحفظ</small><b>' + mm.count + ' / 604</b>' +
      '<small>' + mm.pct + '% · ' + mm.done + ' جزءاً</small></div>' +
    (!S.settings.hideFinance && rem != null ?
      '<div class="rp-box"><small>المتبقي</small><b>' + fmt(rem) + '</b><small>' + esc(S.settings.currency) + '</small></div>' : '') +
  '</div>';
  h += '<div><h3>تفصيل النقاط</h3><table><tbody>' +
    '<tr><td>الحضور</td><td class="n">' + sg(pt.att) + '</td></tr>' +
    '<tr><td>التسميع</td><td class="n">' + sg(pt.rec) + '</td></tr>' +
    '<tr><td>الاختبارات</td><td class="n">' + sg(pt.exam) + '</td></tr>' +
    '<tr><td>إضافات المعلم</td><td class="n">' + sg(pt.add) + '</td></tr>' +
    '<tr><td>مكافأة الحضور</td><td class="n">' + sg(pt.streak) + '</td></tr>' +
    '<tr><td><b>المجموع</b></td><td class="n"><b>' + fmt(pt.total) + '</b></td></tr>' +
  '</tbody></table></div>';
  if(recs.length){
    h += '<div><h3>آخر التسميعات</h3><table><thead><tr><th>التاريخ</th><th>الجزء</th><th>الصفحة</th><th>التقدير</th></tr></thead><tbody>' +
      recs.map(function(r){
        return '<tr><td>' + esc(r.d) + '</td><td>' + r.juz + '</td><td>' + r.page + '</td><td>' + GRADES[r.g] + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  if(exams.length){
    h += '<div><h3>الاختبارات</h3><table><thead><tr><th>التاريخ</th><th>الاختبار</th><th class="n">العلامة</th></tr></thead><tbody>' +
      exams.map(function(e){
        return '<tr><td>' + esc(e.d) + '</td><td>' + esc(e.title) + '</td><td class="n">' + fmt(e.mark) + ' / ' + fmt(e.max) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  if(notes.length){
    h += '<div><h3>ملاحظات</h3>' + notes.map(function(n){
      return '<div class="rp-note">' + esc(n.text) + ' <small>' + esc(n.date) + '</small></div>';
    }).join('') + '</div>';
  }
  h += '<div class="rp-foot">جزاكم الله خيراً على متابعتكم</div></div>';
  return h;

/* ============================================================
   msgCfg — إعدادات الرسائل مع القيم الافتراضية
   ============================================================ */
function msgCfg(){
  var m = S.settings.msg || {};
  var r = m.rules || {};
  var dfltRules = (DEF.msg && DEF.msg.rules) || {};
  var dfltTpl = (DEF.msg && DEF.msg.tpl) || QUICK_MSG_TEMPLATES;
  return {
    paused: !!m.paused,
    appUrl: m.appUrl || (DEF.msg && DEF.msg.appUrl) || APP_URL,
    tpl: Object.assign({}, QUICK_MSG_TEMPLATES, dfltTpl, m.tpl || {}),
    rules: {
      absent: Object.assign({on:true, time:'14:00'}, dfltRules.absent, r.absent),
      dues: Object.assign({on:true, time:'10:00', minBal:1}, dfltRules.dues, r.dues),
      session: Object.assign({on:true, lead:60}, dfltRules.session, r.session)
    }
  };
}
/* ============================================================
   fillTpl — استبدال المتغيرات
   ============================================================ */
function fillTpl(t, v){
  return String(t||'').replace(/\{([^}]+)\}/g, function(m, k){
    return v[k] != null ? String(v[k]) : m;
  });
}
/* ============================================================
   baseVars — المتغيرات الأساسية
   ============================================================ */
function baseVars(){
  return {
    'المؤسسة': S.settings.institution,
    'التاريخ': today(),
    'العملة': S.settings.currency,
    'السنة': curYear(),
    'الرابط': msgCfg().appUrl
  };
}
/* ============================================================
   addMin — إضافة دقائق إلى تاريخ+وقت
   ============================================================ */
function addMin(date, time, m){
  var p = String(time||'00:00').split(':');
  var d = new Date(date + 'T' + pad(num(p[0])) + ':' + pad(num(p[1])) + ':00');
  d.setMinutes(d.getMinutes() + m);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' +
    pad(d.getHours()) + ':' + pad(d.getMinutes());
}
/* ============================================================
   phoneOfS — هاتف ولي الأمر أو الطالب
   ============================================================ */
function phoneOfS(s){
  return (s && (s.guardianPhone || s.phone)) || '';
}
/* ============================================================
   audience — المستقبلون حسب الفئة
   ============================================================ */
function audience(aud, stage){
  var out = [];
  if(aud === 'teachers'){
    S.teachers.filter(function(t){return t.status !== 'موقوف';})
      .forEach(function(t){out.push({id:t.id, name:t.name, phone:t.phone});});
  } else if(aud === 'supervisors'){
    S.supervisors.filter(function(t){return t.status !== 'موقوف';})
      .forEach(function(t){out.push({id:t.id, name:t.name, phone:t.phone});});
  } else {
    var Y = curYear();
    S.students.filter(function(s){return s.status === 'مقبول';}).forEach(function(s){
      if(stage){
        var e = S.enrollments.filter(function(x){
          return x.studentId === s.id && x.year === Y && x.status === 'نشط';
        })[0];
        if(!e || e.stage !== stage) return;
      }
      out.push({id:s.id, name:s.name, phone:phoneOfS(s)});
    });
  }
  return out;
}
/* ============================================================
   msgQueue — قائمة الرسائل الجاهزة
   ============================================================ */
function msgQueue(){
  var cfg = msgCfg();
  var td = today();
  var mon = td.slice(0,7);
  var items = [];
  var bv = baseVars();
  var sent = {};
  S.msglog.forEach(function(l){sent[l.id] = 1;});
  function add(key, kind, who, name, phone, text, dueAt){
    items.push({
      key: key, kind: kind, who: who, name: name, phone: phone,
      text: text, dueAt: dueAt, sent: !!sent[key]
    });
  }
  if(cfg.paused) return items;
  var Y = curYear();
  // غياب الطلاب
  if(cfg.rules.absent.on){
    var marks = D.att[td] || {};
    Object.keys(marks).forEach(function(sid){
      if(marks[sid] !== 'a') return;
      var s = D.sMap[sid]; if(!s) return;
      add(
        'absent_'+td+'_'+sid,
        'غياب',
        'ولي أمر',
        s.name,
        phoneOfS(s),
        fillTpl(cfg.tpl.absent, Object.assign({}, bv, {'الاسم': s.name})),
        td+' '+cfg.rules.absent.time
      );
    });
  }
  // تذكير بالرسوم (شهري)
  if(cfg.rules.dues.on&&!S.settings.hideFinance){
    S.enrollments.filter(function(e){
      return e.year === Y && e.status === 'نشط' &&
        bal(e.id) >= num(cfg.rules.dues.minBal || 1);
    }).forEach(function(e){
      var s = D.sMap[e.studentId]; if(!s) return;
      add(
        'dues_'+mon+'_'+e.id,
        'رسوم',
        'ولي أمر',
        s.name,
        phoneOfS(s),
        fillTpl(cfg.tpl.dues, Object.assign({}, bv, {
          'الاسم': s.name,
          'المتبقي': fmt(bal(e.id))
        })),
        td+' '+cfg.rules.dues.time
      );
    });
  }
  // تذكير بحصص اليوم للمعلمين
  if(cfg.rules.session.on){
    S.sessions.filter(function(x){
      return x.date === td && x.status !== 'ملغاة' && x.teacherId;
    }).forEach(function(x){
      var t = D.tMap[x.teacherId]; if(!t) return;
      add(
        'session_'+x.id+'_'+t.id,
        'حصة',
        'معلم',
        t.name,
        t.phone,
        fillTpl(cfg.tpl.session, Object.assign({}, bv, {
          'الاسم': t.name,
          'الوقت': x.time || '',
          'العنوان': x.title || ''
        })),
        addMin(td, x.time || '08:00', -num(cfg.rules.session.lead))
      );
    });
  }
  // رسائل مجدولة
  S.msgsched.forEach(function(sc){
    if(!sc.when) return;
    var dueAt = String(sc.when).replace('T',' ');
    audience(sc.aud, sc.stage).forEach(function(r){
      add(
        'sch_'+sc.id+'_'+r.id,
        'مجدولة',
        sc.aud === 'students' ? 'ولي أمر' : (sc.aud === 'teachers' ? 'معلم' : 'مشرف'),
        r.name,
        r.phone,
        fillTpl(sc.text, Object.assign({}, bv, {'الاسم': r.name})),
        dueAt
      );
    });
  });
  return items;
}
/* ============================================================
   msgItem — عرض رسالة واحدة
   ============================================================ */
function msgItem(it, when){
  var link = waLink(it.phone, it.text);
  var sendBtn = link
    ? '<a class="btn pri sm" href="'+esc(link)+'" target="_blank" rel="noopener" data-act="msgSent" data-key="'+esc(it.key)+'" data-kind="'+esc(it.kind)+'" data-name="'+esc(it.name)+'">'+ico('wa')+'إرسال</a>'
    : '<span class="pill bad">لا رقم</span>';
  return '<div class="li"><div style="min-width:0">'+
    '<b>'+esc(it.name)+'</b> '+
    '<span class="pill acc">'+esc(it.kind)+'</span> '+
    '<span class="pill">'+esc(it.who)+'</span>'+
    '<small>'+(when ? 'يحين '+esc(it.dueAt.slice(11))+((it.dueAt.slice(0,10) !== today()) ? ' · '+esc(it.dueAt.slice(0,10)) : '') : '')+
    ' '+esc(it.text.length > 110 ? it.text.slice(0, 110)+'…' : it.text)+'</small></div>'+
    '<div class="btns" style="flex:none">'+
      (when ? '' : sendBtn +
        W('<button type="button" class="btn sm" data-act="msgDone" data-key="'+esc(it.key)+'" data-kind="'+esc(it.kind)+'" data-name="'+esc(it.name)+'">تم</button>'))+
    '</div></div>';
}
/* ============================================================
   vMsg — صفحة الرسائل
   ============================================================ */
function vMsg(){
  var tab = S.ui.mtab || 'queue';
  var cfg = msgCfg();
  var h = vh('الرسائل',
    'رسائل واتساب جاهزة تظهر في موعدها وتتحكم بتوقيتها');
  h += '<div class="tabs" role="group" aria-label="أقسام الرسائل">'+
    [['queue','اليوم'],['compose','رسالة جديدة'],['rules','القوالب والمواعيد']].map(function(t){
      return '<button type="button" data-act="mtab" data-k="'+t[0]+'" aria-pressed="'+(tab===t[0])+'">'+t[1]+'</button>';
    }).join('')+
  '</div>';
  h += '<div class="banner">واتساب لا يسمح للصفحات بالإرسال التلقائي. تجهّز الصفحة النص والرقم، وعند حلول الموعد تظهر الرسالة هنا ويضغط المستخدم «إرسال» فيُفتح واتساب والنص جاهز. لا يُرسَل شيء والصفحة مغلقة.</div>';
  if(tab === 'queue'){
    if(cfg.paused){
      return h+'<div class="card">'+emptyBox('الرسائل الجاهزة متوقفة',
        'أوقفتها من «القوالب والمواعيد». أعد تشغيلها لتظهر رسائل اليوم.',
        W('<button type="button" class="btn pri" data-act="msgResume">استئناف</button>'))+'</div>';
    }
    var q = msgQueue();
    var n = nowStr();
    var due = q.filter(function(i){ return !i.sent && i.dueAt <= n; });
    var up = q.filter(function(i){ return !i.sent && i.dueAt > n; })
      .sort(function(a,b){ return a.dueAt < b.dueAt ? -1 : 1; });
    var dn = q.filter(function(i){ return i.sent; });
    h += '<div class="kpis">'+
      '<div class="kpi"><small>جاهزة للإرسال الآن</small><b>'+due.length+'</b></div>'+
      '<div class="kpi"><small>قادمة اليوم</small><b>'+up.length+'</b></div>'+
      '<div class="kpi"><small>أُرسلت</small><b>'+dn.length+'</b></div>'+
    '</div>';
    h += '<div class="card"><h2>جاهزة الآن</h2>'+
      (due.length
        ? '<div class="list">'+due.slice(0, LIMIT).map(function(i){ return msgItem(i, false); }).join('')+'</div>'
        : '<p class="note">لا توجد رسائل جاهزة الآن. تظهر هنا رسائل الغياب بعد تسجيل الحضور، وتذكير الرسوم، وتذكير الحصص، والرسائل المجدولة عند حلول موعدها.</p>')+
    '</div>';
    if(up.length){
      h += '<div class="card"><h2>قادمة</h2><div class="list">'+
        up.slice(0, 50).map(function(i){ return msgItem(i, true); }).join('')+
      '</div></div>';
    }
    return h;
  }
  if(tab === 'compose'){
    var c = S.ui.cmp || {aud:'students', stage:'', text:'', when:''};
    var rec = audience(c.aud, c.stage);
    var txt = c.text || '';
    var bv = baseVars();
    h += '<div class="card"><h2>رسالة جديدة</h2><div class="cfg">'+
      '<div class="fld"><label>المرسَل إليهم</label>'+
        '<select data-bind="cmp.aud">'+
          selOpts([
            ['students','أولياء أمور الطلاب المقبولين'],
            ['teachers','المعلمون'],
            ['supervisors','المشرفون']
          ], c.aud)+
        '</select>'+
      '</div>'+
      (c.aud === 'students' ?
        '<div class="fld"><label>المرحلة</label>'+
          '<select data-bind="cmp.stage">'+
            selOpts(stageList(), c.stage, 'كل المراحل')+
          '</select>'+
        '</div>' : '')+
      '<div class="fld"><label>قالب جاهز</label>'+
        '<select data-act-change="tplPick">'+
          '<option value="">اختر قالباً…</option>'+
          Object.keys(TPL_NAMES).map(function(k){
            return '<option value="'+k+'">'+esc(TPL_NAMES[k])+'</option>';
          }).join('')+
        '</select>'+
      '</div>'+
      '<div class="fld full"><label>نص الرسالة</label>'+
        '<textarea data-bind="cmp.text" placeholder="اكتب الرسالة. يمكنك استخدام {الاسم} و{المؤسسة} و{التاريخ}">'+esc(txt)+'</textarea>'+
        '<span class="hint">يُستبدل {الاسم} باسم كل مستلم.</span>'+
      '</div>'+
      '<div class="fld"><label>موعد الإرسال (للجدولة)</label>'+
        '<input type="datetime-local" data-bind="cmp.when" value="'+esc(c.when||'')+'">'+
      '</div>'+
    '</div>'+
    '<div class="btns" style="margin-top:12px">'+
      W('<button type="button" class="btn pri" data-act="msgSchedule">'+ico('sess')+'جدولة الرسالة</button>')+
    '</div>'+
    '<p class="note" style="margin-top:8px">الجدولة تضع الرسالة في قائمة «اليوم» عند حلول الموعد. أو أرسل الآن من القائمة التالية.</p></div>';
    h += '<div class="card"><h2>المستلمون ('+fmt(rec.length)+')</h2>'+
      (!txt.trim() ? '<p class="note">اكتب نص الرسالة لتظهر أزرار الإرسال.</p>' : '')+
      (rec.length
        ? '<div class="list">'+rec.slice(0, LIMIT).map(function(r){
            var it = {
              key: 'man_'+Date.now().toString(36)+'_'+r.id,
              kind: 'يدوية',
              name: r.name,
              phone: r.phone,
              text: fillTpl(txt, Object.assign({}, bv, {'الاسم': r.name}))
            };
            var link = txt.trim() ? waLink(r.phone, it.text) : '';
            return '<div class="li">'+
              '<div><b>'+esc(r.name)+'</b><small>'+esc(r.phone||'لا رقم هاتف')+'</small></div>'+
              (!txt.trim() ? '' :
                link
                  ? '<a class="btn pri sm" href="'+esc(link)+'" target="_blank" rel="noopener">'+ico('wa')+'إرسال</a>'
                  : '<span class="pill bad">لا رقم</span>')+
            '</div>';
          }).join('')+'</div>'
        : '<p class="note">لا يوجد مستلمون مطابقون.</p>')+
    '</div>';
    var sc = S.msgsched.slice().sort(function(a,b){ return a.when < b.when ? -1 : 1; });
    h += '<div class="card"><h2>رسائل مجدولة</h2>'+
      (sc.length
        ? tbl([
            {h:'الموعد', f:function(x){ return esc(String(x.when).replace('T',' ')); }},
            {h:'المستلمون', f:function(x){
              return esc({students:'أولياء الأمور', teachers:'المعلمون', supervisors:'المشرفون'}[x.aud] || '')+
                (x.stage ? ' · '+esc(x.stage) : '');
            }},
            {h:'النص', f:function(x){
              return esc(x.text.length > 70 ? x.text.slice(0,70)+'…' : x.text);
            }},
            {h:'', a:1, f:function(x){
              return W('<button type="button" class="ibtn" data-act="delSched" data-id="'+x.id+'" aria-label="حذف">'+ico('trash')+'</button>');
            }}
          ], sc)
        : '<p class="note">لا توجد رسائل مجدولة.</p>')+
    '</div>';
    return h;
  }
  // rules
  var R = cfg.rules;
  function chk(n,l,on){
    return '<label class="chk"><input type="checkbox" name="'+n+'"'+(on?' checked':'')+'> '+l+'</label>';
  }
  h += '<form class="card" id="msgform" novalidate><h2>متى تظهر الرسائل</h2><div class="cfg">'+
    '<div class="fld full">'+chk('paused','إيقاف كل الرسائل الجاهزة مؤقتاً',cfg.paused)+'</div>'+
    '<div class="fld">'+chk('absent_on','رسالة غياب الطالب لولي الأمر',R.absent.on)+
      '<label>تظهر بعد الساعة</label>'+
      '<input type="time" name="absent_time" value="'+esc(R.absent.time)+'"></div>'+
    '<div class="fld">'+chk('dues_on','تذكير شهري بالرسوم المتبقية',R.dues.on)+
      '<label>تظهر بعد الساعة</label>'+
      '<input type="time" name="dues_time" value="'+esc(R.dues.time)+'">'+
      '<label>أقل مبلغ متبقٍ للتذكير</label>'+
      '<input type="number" min="0" name="dues_min" value="'+esc(R.dues.minBal)+'"></div>'+
    '<div class="fld">'+chk('session_on','تذكير المعلم بحصة اليوم',R.session.on)+
      '<label>قبل موعد الحصة بـ (دقيقة)</label>'+
      '<input type="number" min="0" name="session_lead" value="'+esc(R.session.lead)+'"></div>'+
  '</div>';
  h += '<h2 style="margin-top:18px">نصوص القوالب</h2><div class="cfg">'+
    Object.keys(TPL_NAMES).map(function(k){
      return '<div class="fld"><label>'+esc(TPL_NAMES[k])+'</label>'+
        '<textarea name="tpl_'+k+'">'+esc(cfg.tpl[k] || QUICK_MSG_TEMPLATES[k] || '')+'</textarea></div>';
    }).join('')+
    '<div class="fld full"><label>رابط التطبيق في رسالة الحساب</label>'+
      '<input name="appUrl" value="'+esc(cfg.appUrl)+'"></div>'+
  '</div>'+
  '<p class="note" style="margin-top:8px">المتغيرات: {الاسم} {المؤسسة} {التاريخ} {الوقت} {العنوان} {المتبقي} {العملة} {السنة} {الرابط}</p>'+
  '<div class="ferr" id="mferr" role="alert"></div>'+
  W('<div class="mact" style="margin-top:12px"><button type="submit" class="btn pri">حفظ</button></div>')+
  '</form>';
  return h;
}
VIEWS.msg = vMsg;
ACT.mtab = function(d){ S.ui.mtab = d.k; render(); };
ACT.msgSent = function(d){
  if(!canWrite()) return;
  Data.put('msglog', d.key, {
    ts: Date.now(),
    kind: d.kind,
    name: d.name,
    date: today()
  });
};
ACT.msgDone = function(d){
  if(!canWrite()) return;
  Data.put('msglog', d.key, {
    ts: Date.now(),
    kind: d.kind,
    name: d.name,
    date: today(),
    manual: true
  }).then(function(){ toast('سُجّلت كمُرسَلة'); });
};
ACT.msgResume = function(){
  if(!canWrite()) return;
  var m = Object.assign({}, S.settings.msg || {}, {paused:false});
  saveSettings({msg: m}).then(function(){ toast('استؤنفت الرسائل'); });
};
ACT.msgSchedule = function(){
  if(!canWrite()) return;
  var c = S.ui.cmp || {};
  if(!String(c.text || '').trim()){ toast('اكتب نص الرسالة أولاً.'); return; }
  if(!c.when){ toast('حدّد موعد الإرسال.'); return; }
  Data.put('msgsched', uid(), {
    aud: c.aud || 'students',
    stage: c.stage || '',
    text: c.text,
    when: c.when,
    ts: Date.now()
  }).then(function(){
    S.ui.cmp = {aud:c.aud || 'students', stage:c.stage || '', text:'', when:''};
    render();
    toast('جُدولت الرسالة');
  }, function(e){ toast(errMsg(e)); });
};
ACT.delSched = function(d){
  confirmBox('حذف الرسالة المجدولة','لن تظهر هذه الرسالة في موعدها.','حذف',function(){
    Data.del('msgsched', d.id).then(function(){ toast('حُذفت'); }, function(e){ toast(errMsg(e)); });
  });
};
/* ============================================================
   مستمع تعديلات cmp (dotted keys)
   ============================================================ */
document.addEventListener('input', function(ev){
  var k = ev.target.getAttribute && ev.target.getAttribute('data-bind');
  if(!k || k.indexOf('cmp.') !== 0) return;
  ev.stopImmediatePropagation();
  S.ui.cmp = Object.assign({aud:'students', stage:'', text:'', when:''}, S.ui.cmp || {});
  S.ui.cmp[k.slice(4)] = ev.target.value;
  if(k === 'cmp.aud') S.ui.cmp.stage = '';
  render();
}, true);
document.addEventListener('change', function(ev){
  var t = ev.target;
  if(t.getAttribute && t.getAttribute('data-act-change') === 'tplPick'){
    var k = t.value;
    if(!k) return;
    S.ui.cmp = Object.assign({aud:'students', stage:'', when:''}, S.ui.cmp || {}, {
      text: msgCfg().tpl[k] || QUICK_MSG_TEMPLATES[k] || ''
    });
    if(k === 'session') S.ui.cmp.aud = 'teachers';
    if(k === 'absent' || k === 'dues') S.ui.cmp.aud = 'students';
    render();
  }
});

/* ============================================================
   computeNotifs — الإشعارات الذكية
   ============================================================ */
function computeNotifs(){
  var out = [];
  var today0 = today();
  var now = new Date();
  var y = now.getFullYear();
  var m = pad(now.getMonth()+1);
  var d = pad(now.getDate());
  var sevenDaysAgo = (function(){
    var x = new Date(); x.setDate(x.getDate()-7);
    return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
  })();
  var notifsCfg = Object.assign({}, DEF.notifs, S.settings.notifs || {});
  var inact = Object.assign({}, DEF.notifs.inactivity, (notifsCfg.inactivity || {}));
  var role = myRole();
  var lvl = myLevel();
  function add(id, kind, title, desc, link){
    out.push({id:id, kind:kind, title:title, desc:desc, link:link, date:today0});
  }
  // غياب اليوم
  if(lvl >= 2){
    var marks = D.att[today0] || {};
    var absCount = 0;
    Object.keys(marks).forEach(function(sid){
      if(marks[sid] === 'a') absCount++;
    });
    if(absCount > 0){
      add('abs_'+today0, 'غياب',
        absCount+' طالب غائب اليوم',
        'راجع الحضور وأرسل تنبيهات لأولياء الأمور',
        {act:'nav', v:'sessions'});
    }
  }
  // طلاب بلا تسميع منذ أسبوع
  if(lvl >= 2){
    var staleStudents = [];
    S.enrollments.filter(function(e){
      return e.year === curYear() && e.status === 'نشط';
    }).forEach(function(e){
      var last = lastOf(e.studentId);
      if(!last.read || last.read.d < sevenDaysAgo){
        staleStudents.push(e.studentId);
      }
    });
    if(staleStudents.length){
      add('stale_rec_'+today0, 'تسميع',
        staleStudents.length+' طالب بلا تسميع منذ أسبوع',
        'تواصل مع معلميهم أو أولياء الأمور',
        {act:'nav', v:'quran'});
    }
  }
  // رسوم متأخرة
  if(!S.settings.hideFinance && lvl >= 3){
    var overdue = 0;
    S.enrollments.filter(function(e){
      return e.year === curYear() && e.status === 'نشط' && bal(e.id) > 0;
    }).forEach(function(){ overdue++; });
    if(overdue > 0){
      add('dues_'+m, 'رسوم',
        overdue+' طالب متبقٍ عليه رسوم',
        'المجموع: '+fmt(S.enrollments.reduce(function(s,e){
          return s + Math.max(0, bal(e.id));
        }, 0))+' '+S.settings.currency,
        {act:'nav', v:'fees'});
    }
  }
  // للمعلم: دروس قادمة
  if(role === 'teacher'){
    var tid = myTeacherId();
    if(tid){
      var t = D.tMap[tid];
      var myBooks = (t && t.selectedBooks) || [];
      var dueBooks = [];
      myBooks.forEach(function(bid){
        var next = nextLessonFor(tid, bid);
        if(next && next.title) dueBooks.push(next.title);
      });
      if(dueBooks.length){
        add('lessons_'+today0, 'دروس',
          dueBooks.length+' درساً قادماً في كتبك',
          dueBooks.slice(0,3).join(' · '),
          {act:'nav', v:'books'});
      }
    }
  }
  // للمشرف: لا حصص هذا الأسبوع
  if(lvl >= 3){
    var weekSess = S.sessions.filter(function(x){
      return x.date >= sevenDaysAgo && x.status !== 'ملغاة';
    }).length;
    if(weekSess === 0){
      add('no_sess_'+today0, 'حصص',
        'لا توجد حصص مسجلة هذا الأسبوع',
        'تأكد من متابعة المعلمين',
        {act:'nav', v:'sessions'});
    }
  }
  // تقصير المستخدم نفسه
  var myLast = S.user && S.user.last_seen;
  if(myLast && inact[role]){
    var daysAgo = Math.floor((Date.now() - new Date(myLast).getTime()) / 86400000);
    if(daysAgo >= num(inact[role])){
      add('inactivity_'+role+'_'+today0, 'تذكير',
        'لم تفتح التطبيق منذ '+daysAgo+' أيام',
        'رجاءً راجع مهامك ومتابعة طلابك',
        null);
    }
  }
  // مهام إدارية
  if(lvl >= 6){
    var pending = (SB.users || []).filter(function(u){ return u.role === 'pending'; }).length;
    if(pending > 0){
      add('pending_'+today0, 'إدارة',
        pending+' مستخدم بانتظار الموافقة',
        'افتح «الحسابات» لمنح الصلاحيات',
        {act:'nav', v:'acc'});
    }
  }
  // تحديد المُقروء
  S.notifications.filter(function(n){ return n.date === today0; }).forEach(function(n){
    out.forEach(function(it){
      if(it.id === n.id) it.read = true;
    });
  });
  return out;
}

function requirePassword(cb){
  if(!S.settings.requirePwForDanger){
    cb();
    return;
  }
  M.push({
    title:'تأكيد كلمة المرور',
    values:{pw:''},
    fields:[
      {k:'pw', l:'كلمة المرور', t:'password', req:1, full:1, hint:'مطلوبة للعمليات الحساسة'}
    ],
    submit:function(x){
      if(S.mode==='local'){
        setTimeout(cb,50);
        return;
      }
      var email = S.user && S.user.email;
      if(!email) return 'لا يوجد بريد مسجل.';
      var p = SB.client.auth.signInWithPassword({email:email, password:x.pw});
      return p.then(function(r){
        if(r.error) return 'كلمة المرور غير صحيحة.';
        setTimeout(cb,50);
      },function(){ return 'كلمة المرور غير صحيحة.'; });
    }
  });
}

function performRestore(data){
  toast('جارٍ الاستعادة…');
  var ops = [];
  // الإعدادات
  ops.push(function(){
    return Data.put('settings','main', data.settings);
  });
  // باقي المجموعات
  COLS.forEach(function(c){
    var items = Array.isArray(data[c]) ? data[c] : [];
    if(!items.length) return;
    ops.push(function(){
      var batch = items.map(function(item){
        var d = Object.assign({}, item);
        var id = d.id || uid();
        delete d.id;
        return {id: id, data: d};
      });
      return batchPut(c, batch);
    });
  });
  // تنفيذ بالتسلسل
  var p = Promise.resolve();
  ops.forEach(function(op){ p = p.then(op); });
  p.then(function(){
    toast('اكتملت الاستعادة');
    render();
  },function(e){
    toast('فشلت الاستعادة: '+(e.message||errMsg(e)));

function globalSearch(query){
  if(!query) return [];
  var q = query.trim().toLowerCase();
  if(q.length < 2) return [];
  var out = [];
  S.students.forEach(function(s){
    var hay = (s.name+' '+(s.self_no||'')+' '+(s.no||'')+' '+(s.phone||'')+' '+(s.guardian||'')).toLowerCase();
    if(hay.indexOf(q) >= 0){
      out.push({
        kind:'طالب',
        icon:'students',
        label:s.name,
        sub:'رقم '+(s.self_no||s.no||''),
        act:'profile',
        id:s.id
      });
    }
  });
  S.teachers.forEach(function(t){
    var hay = (t.name+' '+(t.self_no||'')+' '+(t.phone||'')+' '+(t.specialty||'')).toLowerCase();
    if(hay.indexOf(q) >= 0){
      out.push({
        kind:'معلم',
        icon:'teacher',
        label:t.name,
        sub:t.specialty||'',
        act:'editTeacher',
        id:t.id
      });
    }
  });
  S.supervisors.forEach(function(t){
    var hay = (t.name+' '+(t.self_no||'')+' '+(t.phone||'')+' '+(t.area||'')).toLowerCase();
    if(hay.indexOf(q) >= 0){
      out.push({
        kind:'مشرف',
        icon:'sup',
        label:t.name,
        sub:t.level||'',
        act:'editSup',
        id:t.id
      });
    }
  });
  S.books.forEach(function(b){
    var hay = (b.name+' '+(b.author||'')).toLowerCase();
    if(hay.indexOf(q) >= 0){
      out.push({
        kind:'كتاب',
        icon:'books',
        label:b.name,
        sub:b.author||'',
        act:'vLessons',
        id:b.id
      });
    }
  });
  S.certificates.forEach(function(c){
    var n = certName(c);
    if(n.toLowerCase().indexOf(q) >= 0 || String(c.certNo).indexOf(q) >= 0){
      out.push({
        kind:'شهادة',
        icon:'cert',
        label:n,
        sub:certNo(c.certNo),
        act:'viewCert',
        id:c.id
      });
    }
  });
  return out.slice(0, 20);
}

/* ============================================================
   toHijri — تحويل ميلادي → هجري (خوارزمية أم القرى المبسطة)
   ============================================================ */
var HIJRI_MONTHS = ['محرّم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
var GREG_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var WEEKDAYS_AR = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function toHijri(y, m, d){
  var a = Math.floor((14 - m) / 12);
  var y2 = y + 4800 - a;
  var m2 = m + 12 * a - 3;
  var jdn = d + Math.floor((153 * m2 + 2) / 5) + 365 * y2 +
            Math.floor(y2 / 4) - Math.floor(y2 / 100) + Math.floor(y2 / 400) - 32045;
  var l0 = jdn - 1948440 + 10632;
  var n = Math.floor((l0 - 1) / 10631);
  var l1 = l0 - 10631 * n + 354;
  var j = Math.floor((10985 - l1) / 5316) * Math.floor((50 * l1) / 17719) +
          Math.floor(l1 / 5670) * Math.floor((43 * l1) / 15238);
  var l2 = l1 - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) -
           Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
  var hm = Math.floor((24 * l2) / 709);
  var hd = l2 - Math.floor((709 * hm) / 24);
  var hy = 30 * n + j - 30;
  return {y: hy, m: hm, d: hd};
}
function hijriFromIso(iso){
  var parts = String(iso||'').split('-');
  if(parts.length < 3) return null;
  try{
    return toHijri(num(parts[0]), num(parts[1]), num(parts[2]));
  }catch(e){ return null; }
}
function hijriDate(iso){
  var h = hijriFromIso(iso);
  if(!h) return '';
  var d = String(iso||'').split('-');
  var idx = new Date(num(d[0]), num(d[1])-1, num(d[2])).getDay();
  return WEEKDAYS_AR[idx] + ' ' + h.d + ' ' + HIJRI_MONTHS[h.m-1] + ' ' + h.y + 'هـ';
}
function gregDate(iso){
  if(!iso) return '';
  var d = String(iso).split('-');
  if(d.length < 3) return iso;
  var idx = new Date(num(d[0]), num(d[1])-1, num(d[2])).getDay();
  return WEEKDAYS_AR[idx] + ' ' + num(d[2]) + ' ' + GREG_MONTHS[num(d[1])-1] + ' ' + d[0];
}

/* ============================================================
   weekStart — بداية الأسبوع (السبت)
   ============================================================ */
function weekStart(iso){
  var d = new Date((iso || today()) + 'T00:00:00');
  var day = d.getDay(); // 0=أحد … 6=سبت
  // السبت = 6 → نرجع 0 أيام (نفس اليوم)
  // الأحد = 0 → نرجع 1
  // الاثنين = 1 → نرجع 2
  var diff = day === 6 ? 0 : (day + 1) % 7;
  d.setDate(d.getDate() - diff);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function addDays(iso, n){
  var d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
/* ============================================================
   vWeek — الجدول الأسبوعي
   ============================================================ */
function vWeek(){
  var start = S.ui.weekStart || weekStart();
  var end = addDays(start, 6);
  var tid = myRole()==='teacher' ? myTeacherId() : '';
  var cid = myRole()==='cs' ? myCenterId() : '';
  var sessions = S.sessions.filter(function(x){
    if(x.date < start || x.date > end) return false;
    if(x.status === 'ملغاة') return false;
    if(tid && x.teacherId !== tid) return false;
    return true;
  });
  var days = range(0, 6).map(function(i){ return addDays(start, i); });
  var h = vh('الجدول الأسبوعي',
    gregDate(start) + ' — ' + gregDate(end),
    '<button type="button" class="btn" data-act="weekPrev">'+ico('x')+'السابق</button>'+
    '<button type="button" class="btn" data-act="weekToday">اليوم</button>'+
    '<button type="button" class="btn" data-act="weekNext">التالي</button>'+
    W('<button type="button" class="btn pri" data-act="newSession">'+ico('plus')+'حصة</button>'));
  h += '<div class="week-grid">';
  days.forEach(function(d){
    var daySess = sessions.filter(function(x){ return x.date === d; });
    var hd = hijriFromIso(d);
    var isToday = d === today();
    h += '<div class="week-day"'+(isToday?' style="border:2px solid var(--accent)"':'')+'>'+
      '<h4>'+
        esc(WEEKDAYS_AR[new Date(d+'T00:00:00').getDay()])+
        '<br><small style="font-weight:400;color:var(--ink-2)">'+d.slice(8)+'</small>'+
        (hd?'<br><small style="font-weight:400;color:var(--ink-2);font-size:10px">'+hd.d+' '+HIJRI_MONTHS[hd.m-1]+'</small>':'')+
      '</h4>';
    if(daySess.length){
      daySess.slice(0, 4).forEach(function(x){
        var t = SESS_TYPES[x.type] || {ar:x.type};
        var cls = x.status === 'تمت' ? 'week-sess' : 'week-sess muted';
        h += '<div class="'+cls+'" data-act="openSession" data-id="'+x.id+'" title="'+esc(x.title||t.ar)+'">'+
          esc((x.time||'').slice(0,5)+' '+t.ar)+'</div>';
      });
      if(daySess.length > 4){
        h += '<div class="note" style="font-size:10px;text-align:center;margin-top:4px">+'+(daySess.length-4)+' أخرى</div>';
      }
    } else {
      h += '<div class="note" style="font-size:11px;text-align:center;color:var(--ink-2);padding:14px 0">لا حصص</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  return h;
}

/* ============================================================
   computeInactivityRisk — التنبؤ بالانقطاع
   ============================================================ */
function computeInactivityRisk(){
  var Y = curYear();
  var now = Date.now();
  var risks = [];
  S.enrollments.filter(function(e){
    return e.year === Y && e.status === 'نشط' && !e.leave;
  }).forEach(function(e){
    var sid = e.studentId;
    var s = D.sMap[sid];
    if(!s) return;
    var pt = pointsOf(sid, '', '');
    var tot = pt.p + pt.l + pt.a;
    var attRate = tot ? Math.round(pt.p / tot * 100) : 0;
    var last = lastOf(sid);
    var lastSeen = last.read ? new Date(last.read.d).getTime() : 0;
    var daysSinceRec = lastSeen ? Math.floor((now - lastSeen) / 86400000) : 999;
    var lastSession = S.sessions.filter(function(x){
      return x.date && x.teacherId === e.teacherId &&
        x.status === 'تمت' && x.date <= today();
    }).sort(function(a, b){ return a.date < b.date ? 1 : -1; })[0];
    var daysSinceSess = lastSession
      ? Math.floor((now - new Date(lastSession.date).getTime()) / 86400000)
      : 999;
    var score = 0;
    if(daysSinceRec > 14) score += 3;
    else if(daysSinceRec > 7) score += 2;
    else if(daysSinceRec > 3) score += 1;
    if(attRate < 50) score += 3;
    else if(attRate < 70) score += 2;
    else if(attRate < 85) score += 1;
    if(daysSinceSess > 14) score += 2;
    else if(daysSinceSess > 7) score += 1;
    if(pt.total < 10) score += 1;
    if(score >= 5){
      risks.push({
        sid: sid,
        name: s.name,
        no: s.no,
        score: score,
        attRate: attRate,
        daysSinceRec: daysSinceRec,
        daysSinceSess: daysSinceSess,
        enrolled: e.id,
        reasons: [
          daysSinceRec > 7 ? 'لا تسميع منذ '+daysSinceRec+' يوم' : '',
          attRate < 70 ? 'نسبة حضور منخفضة ('+attRate+'%)' : '',
          daysSinceSess > 7 ? 'لا حصة له منذ '+daysSinceSess+' يوم' : '',
          pt.total < 10 ? 'نقاط منخفضة ('+fmt(pt.total)+')' : ''
        ].filter(Boolean)
      });
    }
  });
  risks.sort(function(a, b){ return b.score - a.score; });
  return risks;
}

/* ============================================================

/* ============================================================
   MEDIA — إدارة تسجيل الصوت
   ============================================================ */
var MEDIA = {
  recorder: null,
  chunks: [],
  stream: null,
  startTime: 0,
  supported: function(){
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  },
  start: function(){
    var self = MEDIA;
    if(!self.supported()) return Promise.reject(new Error('التسجيل غير مدعوم في هذا المتصفح'));
    return navigator.mediaDevices.getUserMedia({audio: true}).then(function(stream){
      self.stream = stream;
      self.chunks = [];
      var mime = '';
      if(MediaRecorder.isTypeSupported('audio/webm')) mime = 'audio/webm';
      else if(MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';
      else if(MediaRecorder.isTypeSupported('audio/ogg')) mime = 'audio/ogg';
      self.recorder = mime ? new MediaRecorder(stream, {mimeType: mime}) : new MediaRecorder(stream);
      self.recorder.ondataavailable = function(ev){
        if(ev.data && ev.data.size > 0) self.chunks.push(ev.data);
      };
      self.recorder.start(1000);
      self.startTime = Date.now();
      return true;
    });
  },
  stop: function(){
    var self = MEDIA;
    return new Promise(function(resolve){
      if(!self.recorder) return resolve(null);
      self.recorder.onstop = function(){
        var blob = new Blob(self.chunks, {type: self.recorder.mimeType || 'audio/webm'});
        if(self.stream){
          self.stream.getTracks().forEach(function(t){ t.stop(); });
        }
        var duration = Math.round((Date.now() - self.startTime) / 1000);
        self.chunks = [];
        self.recorder = null;
        self.stream = null;
        resolve({blob: blob, duration: duration});
      };
      self.recorder.stop();
    });
  },
  cancel: function(){
    var self = MEDIA;
    if(self.recorder){
      try{ self.recorder.stop(); }catch(e){}
    }
    if(self.stream){
      self.stream.getTracks().forEach(function(t){ t.stop(); });
    }
    self.chunks = [];
    self.recorder = null;
    self.stream = null;
  }
};
/* ============================================================
   blobToBase64 — تحويل إلى base64 (للتخزين الصغير)
   ============================================================ */
function blobToBase64(blob){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(reader.error); };
    reader.readAsDataURL(blob);
  });
}
/* ============================================================
   saveRecording — حفظ تسجيل مرتبط بطالب
   ============================================================ */
function saveRecording(sid, meta, blob, duration){
  return blobToBase64(blob).then(function(dataUrl){
    var id = uid();
    var rec = {
      studentId: sid,
      page: meta.page || '',
      type: meta.type || 'tilawa',
      note: meta.note || '',
      date: today(),
      duration: duration || 0,
      dataUrl: dataUrl,
      ts: Date.now(),
      by: SB.user ? SB.user.id : 'local'
    };
    return Data.put('recordings', id, rec).then(function(){
      return id;
    });
  });
}

        '</div>'+
      '</div>';
    } else {
      h += '<div class="card"><h2>تسجيل جديد</h2>'+
        '<div class="cfg">'+
          '<div class="fld"><label>الصفحة / الدرس</label>'+
            '<input type="number" min="1" max="604" data-bind="recPage" value="'+esc(S.ui.recPage||'')+'" placeholder="رقم الصفحة (اختياري)"></div>'+
          '<div class="fld"><label>نوع التسجيل</label>'+

          W('<button type="button" class="btn pri" data-act="startRecording">'+ico('att')+'بدء التسجيل</button>')+
        '</div>'+
      '</div>';
    }
  }
  h += '<div class="card"><h2>التسجيلات السابقة ('+recordings.length+')</h2>';
  if(!recordings.length){
    h += '<p class="note">لا توجد تسجيلات لهذا الطالب بعد.</p>';
  } else {
    h += '<div class="list">'+recordings.map(function(r){
      return '<div class="li">'+
        '<div>'+
          (r.page?'<b>صفحة '+esc(r.page)+'</b> · ':'')+

ACT.startRecording = function(){
  if(!canWrite()) return;
  var sid = S.ui.recordSid;
  if(!sid){ toast('اختر الطالب أولاً.'); return; }
  MEDIA.start().then(function(){
    S.ui.recording = {startedAt: Date.now()};
    render();
    toast('بدأ التسجيل...');
  },function(err){
    toast('تعذّر التسجيل: '+(err.message||''));
  });
};
ACT.stopRecording = function(){
  var sid = S.ui.recordSid;
  if(!sid) return;
  MEDIA.stop().then(function(res){
    if(!res){ toast('لا يوجد تسجيل.'); return; }
    if(res.duration < 1){
      toast('التسجيل قصير جداً.');
      return;
    }
    toast('جارٍ حفظ التسجيل...');
    saveRecording(sid, {
      page: num(S.ui.recPage) || '',
      type: S.ui.recType || 'tilawa'
    }, res.blob, res.duration).then(function(){
      S.ui.recording = null;
      S.ui.recPage = '';
      toast('حُفظ التسجيل ('+res.duration+' ثانية)');
      render();
    },function(e){
      S.ui.recording = null;
      toast('تعذّر الحفظ: '+(e.message||errMsg(e)));
      render();
    });
  });
};
ACT.cancelRecording = function(){
  MEDIA.cancel();
  S.ui.recording = null;
  render();
};

/* ============================================================
   absToAyah — 604 صفحة → رقم آية تقريبي للصوت
   ============================================================ */
function absToAyah(page){
  // cdn.islamic.network يستخدم رقم الآية العالمي (1-6236)
  // تحويل تقريبي: 6236/604 ≈ 10.3 آية لكل صفحة
  return Math.max(1, Math.min(6236, Math.round(page * 6236 / 604)));
}

});
