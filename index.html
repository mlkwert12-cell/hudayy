<script>
/* التقاط الأخطاء مبكراً لتُرسل للدعم عند الطلب */
window.__hbErrs=[];
(function(){
  function add(kind,msg,src){
    try{
      window.__hbErrs.push({t:new Date().toISOString(),k:kind,m:String(msg||'').slice(0,400),s:String(src||'').slice(0,200)});
      if(window.__hbErrs.length>12)window.__hbErrs.shift();
      window.dispatchEvent(new CustomEvent('hb-error'));
    }catch(e){}
  }
  window.__hbAddErr=add;
  window.addEventListener('error',function(e){
    if(e&&e.target&&e.target!==window)return; // أخطاء تحميل الموارد تُتجاهل
    add('error',e.message,(e.filename||'')+':'+(e.lineno||''));
  });
  window.addEventListener('unhandledrejection',function(e){
    var r=e&&e.reason;add('promise',(r&&r.message)||r,'');
  });
})();
</script>

  --wm-op:.06;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3);
  --overlay:rgba(0,0,0,.65);
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
/* الأساس */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}
html.lock body{overflow:hidden}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
body::after{content:"";position:fixed;inset:0;margin:auto;width:min(72vmin,560px);height:min(72vmin,560px);
  background:var(--wm-img) center/contain no-repeat;opacity:var(--wm-op,.06);pointer-events:none;z-index:2}
body.fin-hidden .fin{display:none!important}
/* الشل */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto;align-items:start}
.side{background:var(--side);color:var(--side-ink);border-radius:14px;padding:18px 12px;position:sticky;top:16px;
  display:flex;flex-direction:column;gap:18px}
.logo{display:block;flex:none;width:44px;height:44px;border-radius:50%;background:var(--logo-img) center/cover no-repeat}
.brand{padding:4px 10px 12px;border-bottom:1px solid rgba(255,255,255,.14);display:flex;gap:10px;align-items:center}
.brand .logo{width:52px;height:52px;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.brand div{min-width:0}
.brand b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.3}
.brand span{font-size:12px;color:var(--side-dim)}
.logo-top{display:none;width:40px;height:40px;box-shadow:0 0 0 1px var(--line)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-ink);
  padding:10px 12px;border-radius:9px;text-align:start;font-weight:500}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:var(--side-on);color:#fff;box-shadow:inset -3px 0 0 var(--accent)}
.nav h4{margin:12px 12px 2px;font:600 11px var(--f-body);color:var(--side-dim);letter-spacing:.06em}
.side .foot{font-size:12px;color:var(--side-dim);padding:0 10px}
.work{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gsearch{position:relative;flex:1 1 240px;min-width:0}
.gsearch input{width:100%;padding:10px 40px 10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gsearch .si{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.gres{display:none;position:absolute;z-index:20;top:calc(100% + 6px);inset-inline:0;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:340px;overflow:auto;padding:6px}
.gsearch:focus-within .gres:not(:empty){display:block}
.gres button{display:flex;width:100%;justify-content:space-between;gap:10px;align-items:center;background:none;
  border:0;text-align:start;padding:9px 10px;border-radius:8px}
.gres button:hover{background:var(--surface-2)}
.gres small{color:var(--ink-2)}
.top select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chip{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.ok{color:var(--good);border-color:var(--good)}
.chip.warn{color:var(--amber);border-color:var(--amber)}
.banner{padding:10px 14px;border-radius:10px;background:var(--amber-soft);color:var(--ink);border:1px solid var(--amber);font-size:14px}
/* العناوين والأزرار */
.vh{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.vh h1{font-size:26px}
.vh p{color:var(--ink-2);font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);font-weight:500;color:inherit;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ibtn{background:none;border:1px solid transparent;border-radius:8px;padding:5px;color:var(--ink-2);display:inline-flex}
.ibtn:hover{border-color:var(--line);color:var(--ink)}
.ibtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* الكروت */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.raise{box-shadow:var(--shadow)}
.card h2{font-size:17px;margin-bottom:12px}
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.kpi small{display:block;color:var(--ink-2);font-size:13px}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi i{font-style:normal;font-size:12px;color:var(--ink-2)}
.kpi.fin b{font-size:22px}
.kpi.rem b{color:var(--amber)}
.prog{margin-top:6px}
.ptrack{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.ptrack span{display:block;height:100%;background:var(--accent)}
.prow{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-bottom:6px}
/* الرسوم البيانية */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-2);margin-bottom:10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.c-a{background:var(--accent)}.c-b{background:var(--s2)}.c-m{background:var(--amber)}
.brow{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.blabel{font-size:14px;overflow-wrap:anywhere}
.btrack{display:flex;gap:2px;height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.btrack .seg{display:block;height:100%}
.bval{text-align:end;line-height:1.3;white-space:nowrap}
.bval b{display:block;font-variant-numeric:tabular-nums}
.bval small{color:var(--ink-2);font-size:12px}
/* القوائم */
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li small{color:var(--ink-2);display:block}
.li .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.linkb{background:none;border:0;padding:0;text-align:start;font-weight:600;color:var(--ink);cursor:pointer}
.linkb:hover{color:var(--accent);text-decoration:underline}
/* الجداول */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters input,.filters select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);min-width:0}
.filters input[type="search"]{flex:1 1 220px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--surface-2);font-weight:600;font-size:13px;color:var(--ink-2);text-align:start;
  padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tbody tr:hover td{background:var(--surface-2)}
td.n,th.n{text-align:end;white-space:nowrap}
td.act{white-space:nowrap;text-align:end}
tfoot td{font-weight:700;background:var(--surface-2)}
.sub{display:block;color:var(--ink-2);font-size:12px}
.note{font-size:13px;color:var(--ink-2)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;
  display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--ink-2)}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:18px}
.skel{height:14px;border-radius:6px;background:var(--surface-2);margin:10px 0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
/* التابات */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* النوافذ */
.ov{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-start;justify-content:center;
  overflow:auto;padding:24px max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.md{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;
  box-shadow:var(--shadow);margin-block:auto}
.md.wide{max-width:860px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{font-size:18px}
.mb{padding:18px;display:flex;flex-direction:column;gap:16px}
.ff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;color:var(--ink-2);font-weight:500}
.fld input,.fld select,.fld textarea,.cfg input,.cfg select,.cfg textarea{
  padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);width:100%;min-width:0}
.fld input[readonly]{background:var(--surface-2);color:var(--ink-2)}
.fld textarea{min-height:76px;resize:vertical}
.hint{font-size:12px;color:var(--ink-2)}
.ferr{color:var(--bad);font-size:14px;min-height:0}
.ferr:empty{display:none}
.mact{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sumrow div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.sumrow small{display:block;color:var(--ink-2);font-size:12px}
.sumrow b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px}
.kv small{display:block;color:var(--ink-2);font-size:12px}
.mh2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mh2 h3{font-size:16px}
.cfg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.cfg textarea{min-height:110px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.cfg .chk input{width:auto;padding:0}
/* Toast */
#toast{position:fixed;inset-inline:0;bottom:calc(80px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;
  pointer-events:none;z-index:80}
#toast span{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;
  opacity:0;transform:translateY(8px);transition:.2s}
#toast.show span{opacity:1;transform:none}
/* Segmented */
.seg3{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg3 button{border:0;background:none;padding:7px 14px;font-size:14px;border-inline-start:1px solid var(--line)}
.seg3 button:first-child{border-inline-start:0}
.seg3 button[disabled]{cursor:default;opacity:.6}
.seg3 button[aria-pressed="true"].s-p{background:var(--good-soft);color:var(--good);font-weight:700}
.seg3 button[aria-pressed="true"].s-l{background:var(--amber-soft);color:var(--amber);font-weight:700}
.seg3 button[aria-pressed="true"].s-a{background:var(--bad-soft);color:var(--bad);font-weight:700}
.seg3 button[aria-pressed="true"].s-e{background:var(--accent-soft);color:var(--accent);font-weight:700}
/* قوائم الحضور */
.alist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow small{display:block;color:var(--ink-2);font-size:12px}
.sumpills{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* خريطة القرآن */
.juzs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.juz{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;text-align:center;
  display:flex;flex-direction:column;gap:4px;align-items:center}
.juz b{font-family:var(--f-display);font-size:18px;line-height:1.2}
.juz small{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.juz .bar{width:100%;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.juz .bar i{display:block;height:100%;background:var(--accent)}
.juz.full{background:var(--accent-soft)}
.juz[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.pg{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.3;text-align:center}
.pg small{display:block;font-size:10px;font-weight:500;min-height:13px}
.pg.g-good{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pg.g-vgood{background:color-mix(in srgb,var(--accent) 55%,var(--surface));color:var(--ink);border-color:transparent}
.pg.g-excellent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pg.g-redo{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
/* النقاط */
.rk{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;
  background:var(--surface-2);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.rk.t1{background:var(--amber);color:var(--accent-ink)}
.rk.t2,.rk.t3{background:var(--accent-soft);color:var(--accent)}
.pbar{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:56px;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--accent)}
.bdrow{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 70px;gap:10px;align-items:center;padding:6px 0}
.bdrow small{display:block;color:var(--ink-2);font-size:12px}
.bdrow .v{text-align:end;font-weight:700;font-variant-numeric:tabular-nums}
.v.neg{color:var(--bad)}.v.pos{color:var(--good)}
.morelist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.morelist .btn{justify-content:flex-start}
.crit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
textarea.cp{width:100%;min-height:120px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);font-size:14px}
/* الحصة الموحدة */
.sess-type{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.sess-type button{padding:16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);
  text-align:center;cursor:pointer;font-weight:600;display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--ink)}
.sess-type button svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.6}
.sess-type button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sess-type button small{font-size:12px;font-weight:400;color:var(--ink-2)}
.sess-row{border-top:1px solid var(--line);padding:12px 0}
.sess-row:first-child{border-top:0}
.sess-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px;margin-top:8px}
/* الشارات */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;
  font-weight:600;background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
.badge.gold{background:var(--amber);color:var(--accent-ink)}
.badge.big{font-size:14px;padding:8px 16px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.badge-card{display:flex;flex-direction:column;gap:6px;align-items:center;padding:14px 10px;border:1px solid var(--line);
  border-radius:12px;background:var(--surface);text-align:center}
.badge-card svg{width:32px;height:32px;stroke:var(--accent);fill:none;stroke-width:1.8}
.badge-card.locked{opacity:.4}
.badge-card small{font-size:11px;color:var(--ink-2)}
/* الجدول الأسبوعي */
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week-day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:130px}
.week-day h4{font-size:12px;color:var(--ink-2);margin:0 0 6px;text-align:center;font-family:var(--f-body);font-weight:600}
.week-sess{font-size:11px;background:var(--accent-soft);color:var(--accent);padding:4px 6px;border-radius:6px;
  margin-bottom:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week-sess:hover{background:var(--accent);color:var(--accent-ink)}
.week-sess.muted{background:var(--surface-2);color:var(--ink-2)}
@media(max-width:600px){.week-grid{grid-template-columns:repeat(3,1fr)}}
/* الإشعارات */
.notif-list{max-height:400px;overflow:auto}
.notif-item{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.notif-item:first-child{border-top:0}
.notif-item.unread{background:var(--accent-soft)}
.notif-item svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8;flex:none}
.notif-item small{color:var(--ink-2);display:block;font-size:12px}
.notif-bell{position:relative}
.notif-count{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:10px;
  min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* الطباعة والجوال */
.only-print{display:none}
.tabbar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  body{padding-bottom:88px}
  .side{display:none}
  .logo-top{display:block}
  .tabbar{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--side);color:var(--side-ink);
    border-radius:14px 14px 0 0;

    if(col==='sessions'&&myLevel()<3){var ex=find('sessions',id);if(ex&&window.__sess&&window.__sess.locked(ex)){var le=new Error('الحصة مغلقة: لا يمكن التعديل إلا بعد موافقة مشرف المركز على طلب تعديل.');le.sessGuard=1;return Promise.reject(le);}}
    if(col==='sessions'&&data&&data.status==='تمت'){var gm=window.__sess?window.__sess.guard(data):'';if(gm){var ge=new Error(gm);ge.sessGuard=1;return Promise.reject(ge);}}
    var d=Object.assign({},data);
    delete d.id;
    if(Data.db)return Data.db.collection(col).doc(id).set(d);
    if(!Data.local[col])Data.local[col]={};
    Data.local[col][id]=d;
    Data.saveLocal();
    Data.pull();
    refresh();
    return Promise.resolve();
  },
  del:function(col,id){
    if(col==='sessions'&&myLevel()<3){var ex=find('sessions',id);if(ex&&window.__sess&&window.__sess.locked(ex)){var le=new Error('الحصة مغلقة: لا يمكن التعديل إلا بعد موافقة مشرف المركز على طلب تعديل.');le.sessGuard=1;return Promise.reject(le);}}
    if(Data.db)return Data.db.collection(col).doc(id).delete();
    if(Data.local[col])delete Data.local[col][id];
    Data.saveLocal();
    Data.pull();
    refresh();
    return Promise.resolve();
  },
  mergeMarks:function(col,id,marks){
    if(!Data.db){
      if(!Data.local[col])Data.local[col]={};
      var old=Data.local[col][id]||{};
      Data.local[col][id]={date:id,marks:Object.assign({},old.marks||{},marks)};
      Data.saveLocal();
      Data.pull();
      refresh();
      return Promise.resolve();
    }
    var ref=Data.db.collection(col).doc(id);
    return ref.update({marks:marks}).catch(function(e){
      if(e&&e.code==='invalid_argument')return ref.set({date:id,marks:marks});
      throw e;
    });
  },
  subscribe:function(){
    if(!Data.db)return;
    COLS.forEach(function(c){
      Data.db.collection(c).onSnapshot(function(snap){
        RAW[c]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
        S[c]=RAW[c];
        S.loaded[c]=true;
        refresh();
      },dbError);
    });
    Data.db.doc('settings/main').onSnapshot(function(d){
      S.settings=Object.assign(JSON.parse(JSON.stringify(DEF)),d.exists?d.data():{});
      S.loaded.settings=true;
      refresh();
    },dbError);
  }
};

/* ============================================================

function render(){
  derive();
  document.body.classList.toggle('fin-hidden',!!S.settings.hideFinance);
  if(S.settings.hideFinance&&(S.view==='fees'||S.view==='pay'))S.view='dash';

  if(!main)return;
  var f=document.activeElement;
  var keep=(f&&main.contains(f)&&f.id!=='gq'&&(f.id||f.getAttribute('data-bind')))
    ?{id:f.id,b:f.getAttribute('data-bind'),s:f.selectionStart,e:f.selectionEnd}
    :null;
  var ready=S.mode==='local'||(S.mode==='shared'&&
    COLS.concat(['settings']).every(function(c){return S.loaded[c];}));
  if(!ready){
    main.innerHTML='<div class="card">'+
      '<div class="skel" style="width:40%"></div>'+
      '<div class="skel"></div>'+
      '<div class="skel" style="width:80%"></div>'+
      '<div class="skel" style="width:60%"></div></div>';
  }else{
    var view=VIEWS[S.view];
    try{main.innerHTML=view?view():'<div class="card"><p class="note">هذه الصفحة قيد التطوير.</p></div>';}
    catch(err){console.error(err);main.innerHTML='<div class="card"><h2>تعذّر عرض الصفحة</h2><p class="note">'+esc(err.message||String(err))+'</p></div>';}
  }
  renderNav();
  var bn=$('#brandName');
  if(bn)bn.textContent=S.settings.institution||'حلقات أنوار الهداية';
  var ys=$('#yearSel');
  if(ys){
    var cy=curYear();
    var opt=yearsList().map(function(y){
      return '<option value="'+esc(y)+'"'+(y===cy?' selected':'')+'>السنة '+esc(y)+'</option>';
    }).join('');
    if(ys.getAttribute('data-k')!==opt){ys.innerHTML=opt;ys.setAttribute('data-k',opt);}
    ys.value=cy;
  }
  var chip=$('#modeChip');
  if(chip){
    chip.className='chip'+(S.mode==='shared'?' ok':S.mode==='local'?' warn':'');
    chip.textContent=S.mode==='shared'
      ?'بيانات محفوظة ومشتركة'
      :S.mode==='local'?'محلي: هذا المتصفح فقط':'جارٍ التحميل';
  }
  var b='';
  if(S.dbErr)b='<div class="banner">'+esc(S.dbErr)+'</div>';
  else if(S.mode==='local')b='<div class="banner">وضع محلي: البيانات تُحفظ في هذا المتصفح فقط ولا تُشارَك مع أحد.</div>';
  else if(S.mode==='shared'&&!canWrite())b='<div class="banner">عرض فقط: ليست لديك صلاحية تعديل البيانات.</div>';
  var banner=$('#banner');
  if(banner)banner.innerHTML=b;
  if(keep){
    var el=keep.id?document.getElementById(keep.id):main.querySelector('[data-bind="'+keep.b+'"]');
    if(el){
      el.focus();
      try{if(keep.s!=null)el.setSelectionRange(keep.s,keep.e);}catch(e){}
    }
  }
}
/* ============================================================
   renderNav() — القائمة الجانبية والشريط السفلي
   ============================================================ */
function renderNav(){
  var h='',g='';
  var hideFin=!!S.settings.hideFinance;
  var lvl=myLevel();
  NAV.forEach(function(n){
    var v=n[0];
    if(hideFin&&(v==='fees'||v==='pay'))return;
    if(lvl<6&&v==='acc')return;
    if(lvl<4&&(v==='regions'||v==='tickets'))return;
    if(lvl<3&&(v==='centers'||v==='supervisors'||v==='teachers'||v==='books'))return;
    if(lvl<2&&(v==='editreq'||v==='msg'||v==='sessions'||v==='att'||v==='quran'||v==='rash'||v==='points'))return;
    if(n[4]!==g){g=n[4];if(g)h+='<h4>'+g+'</h4>';}
    h+='<button type="button" data-act="nav" data-v="'+v+'"'+
       (S.view===v?' aria-current="page"':'')+'>'+
       ico(n[3])+esc(n[1])+'</button>';
  });
  var navEl=$('#nav');
  if(navEl)navEl.innerHTML=h;
  var prim=['dash','sessions','quran','students'];
  var tb=$('#tabbar');
  if(tb){
    tb.innerHTML=prim.map(function(id){
      var n=NAV.filter(function(x){return x[0]===id;})[0];
      if(!n)return '';
      return '<button type="button" data-act="nav" data-v="'+id+'"'+
             (S.view===id?' aria-current="page"':'')+'>'+
             ico(n[3])+'<span>'+esc(n[2])+'</span></button>';
    }).join('')+
    '<button type="button" data-act="more"'+
    (prim.indexOf(S.view)<0?' aria-current="page"':'')+'>'+

  }
}

/* ============================================================
   field() — بناء حقل واحد داخل نموذج
   ============================================================ */
function field(f, v){
  var id='f_'+f.k;
  var val=(v && v[f.k]!=null) ? v[f.k] : (f.def!=null ? f.def : '');
  var req=f.req ? ' required' : '';
  var c;
  if(f.t==='select'){
    c='<select id="'+id+'" name="'+f.k+'"'+req+'>'+
      (f.o||[]).map(function(o){
        var ov=Array.isArray(o)?o[0]:o;
        var ol=Array.isArray(o)?o[1]:o;
        return '<option value="'+esc(ov)+'"'+(String(ov)===String(val)?' selected':'')+'>'+esc(ol)+'</option>';
      }).join('')+'</select>';
  }else if(f.t==='textarea'){
    c='<textarea id="'+id+'" name="'+f.k+'">'+esc(val)+'</textarea>';
  }else{
    c='<input id="'+id+'" name="'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(val)+'"'+req+
      (f.ro?' readonly':'')+
      (f.t==='number'
        ? ' min="'+(f.min!=null?f.min:0)+'"'+(f.max!=null?' max="'+f.max+'"':'')+' step="any" inputmode="decimal"'
        : '')+
      (f.list?' list="dl_'+f.k+'"':'')+'>';
    if(f.list){
      c+='<datalist id="dl_'+f.k+'">'+
        f.list.map(function(x){return '<option value="'+esc(x)+'">';}).join('')+
        '</datalist>';
    }
  }
  return '<div class="fld'+(f.full?' full':'')+'">'+
    '<label for="'+id+'">'+esc(f.l)+(f.req?' *':'')+'</label>'+
    c+
    (f.hint?'<span class="hint" id="h_'+f.k+'">'+esc(f.hint)+'</span>':'')+
    '</div>';
}

/* ============================================================
   stackBars() — مخطط أعمدة مكدسة
   ============================================================ */
function stackBars(rows, series){
  var max=Math.max.apply(null, [1].concat(rows.map(function(r){
    return r.vals.reduce(function(a,b){return a+b;}, 0);
  })));
  return '<div class="legend">'+
    series.map(function(s){return '<span><i class="sw '+s.c+'"></i>'+s.n+'</span>';}).join('')+
  '</div>'+
  rows.map(function(r){
    return '<div class="brow">'+
      '<div class="blabel">'+esc(r.label)+'</div>'+
      '<div class="btrack">'+
        r.vals.map(function(v,i){
          return v>0?'<span class="seg '+series[i].c+'" style="width:'+(v/max*100).toFixed(2)+'%"></span>':'';
        }).join('')+
      '</div>'+
      '<div class="bval"><b>'+r.total+'</b><small>'+r.detail+'</small></div>'+
    '</div>';
  }).join('');
}

/* ============================================================
   القرآن: صفحات الأجزاء والتحويل المطلق
   ============================================================ */
function juzPages(j){return j===1?21:j===30?23:20;}
function absPage(j,p){return j===1?p:20*j-19+p;}
function absToJP(a){
  a=Math.max(1,Math.min(604,Math.round(num(a))||1));
  if(a<=21)return{juz:1,page:a};
  if(a>=582)return{juz:30,page:a-581};
  var j=Math.floor((a-2)/20)+1;
  return{juz:j,page:a-(20*j-19)};
}
function quranLink(n){
  var t=safeUrl(S.settings.quranUrl)||DEF.quranUrl;
  return t.indexOf('{n}')>=0?t.replace('{n}',n):t.replace(/\/+$/,'')+'/'+n;
}
/* ============================================================
   pointsOf() — حساب نقاط طالب في فترة
   ============================================================ */
function pointsOf(sid,f,t){
  var R=rules();
  var o={att:0,rec:0,exam:0,add:0,streak:0,p:0,l:0,a:0,nRec:0,nExam:0,nAdd:0,total:0};
  var run=0;
  D.classDates.forEach(function(d){
    if(!inR(d,f,t))return;
    var st=D.att[d][sid];
    if(st==='p'){
      o.p++;o.att+=num(R.present);run++;
      if(num(R.streakDays)>0&&run%num(R.streakDays)===0)o.streak+=num(R.streakBonus);
    }else{
      if(st==='l'){o.l++;o.att+=num(R.late);}
      else if(st==='a'){o.a++;o.att+=num(R.absent);}
      run=0;
    }
  });
  var p=D.pg[sid];
  if(p){
    (p.rec||[]).forEach(function(e){
      if(inR(e.d,f,t)){o.rec+=num(R[e.g]);o.nRec++;}
    });
    (p.exams||[]).forEach(function(e){
      if(inR(e.d,f,t)){
        o.exam+=Math.round(num(e.mark)/(num(e.max)||100)*100*num(R.examFactor));
        o.nExam++;
      }
    });
    (p.adds||[]).forEach(function(e){
      if(inR(e.d,f,t)){o.add+=num(e.points);o.nAdd++;}
    });
  }
  o.total=o.att+o.rec+o.exam+o.add+o.streak;
  return o;
}
/* ============================================================
   memoOf() — خريطة حفظ الطالب
   ============================================================ */
function memoOf(sid){
  var p=D.pg[sid],pages={},cnt=0,j;
  ((p&&p.rec)||[])
    .filter(function(e){return e.t!=='tilawa';})
    .slice()
    .sort(function(a,b){return (a.ts||0)-(b.ts||0)||(a.d<b.d?-1:1);})
    .forEach(function(e){pages[absPage(e.juz,e.page)]=e;});
  var per={};
  for(j=1;j<=30;j++)per[j]=0;
  Object.keys(pages).forEach(function(k){
    var e=pages[k];
    if(e.g!=='redo'&&per[e.juz]!=null){cnt++;per[e.juz]++;}
  });
  var done=0;
  for(j=1;j<=30;j++)if(per[j]>=juzPages(j))done++;
  return {pages:pages,count:cnt,per:per,done:done,pct:Math.round(cnt/604*100)};
}
/* ============================================================
   lastOf() — آخر قراءة وآخر حفظ
   ============================================================ */
function lastOf(sid){
  var recs=((D.pg[sid]&&D.pg[sid].rec)||[])
    .slice()
    .sort(function(a,b){
      return (a.d<b.d?-1:a.d>b.d?1:0)||
             ((a.ts||0)-(b.ts||0))||
             (absPage(a.juz,a.page)-absPage(b.juz,b.page));
    });
  var mem=null;
  recs.forEach(function(e){if(e.t!=='tilawa'&&e.g!=='redo')mem=e;});
  return {read:recs[recs.length-1]||null,mem:mem};
}
/* ============================================================
   leaderRows() — ترتيب الطلاب حسب النقاط
   ============================================================ */
function leaderRows(f,t,filt){
  var seen={},out=[];
  S.enrollments.forEach(function(e){
    if(e.year!==curYear()||e.status!=='نشط'||seen[e.studentId])return;
    if(filt&&!filt(e))return;
    var s=D.sMap[e.studentId];
    if(!s)return;
    seen[e.studentId]=1;
    out.push({sid:e.studentId,e:e,name:s.name,no:s.no,pt:pointsOf(e.studentId,f,t)});
  });
  out.sort(function(a,b){
    return b.pt.total-a.pt.total||(a.name<b.name?-1:1);
  });
  return out;
}

      var m=memoOf(sid),c=0;

      return sum+c;
    },0))+'</b></div>'+
  '</section>';
  // الدروس القادمة (من الكتب المختارة)
  var upcoming=[];
  var _tt=D.tMap[tid];
  S.books.filter(function(b){return _tt&&(_tt.selectedBooks||[]).indexOf(b.id)>=0;}).forEach(function(b){
    var lessons=S.lessons.filter(function(l){return l.bookId===b.id;})
      .sort(function(a,b){return num(a.order)-num(b.order);});
    var last=mySessions.filter(function(x){return x.bookId===b.id;})
      .sort(function(a,b){return a.date<b.date?1:-1;})[0];
    var lastOrder=last?num(last.lessonOrder):0;
    var next=lessons.find(function(l){return num(l.order)>lastOrder;});
    if(next)upcoming.push({book:b,lesson:next});
  });
  if(upcoming.length){
    h+='<div class="card"><h2>الدروس القادمة</h2><div class="list">'+
      upcoming.slice(0,6).map(function(u){
        return '<div class="li"><div>'+
          '<b>'+esc(u.book.name)+'</b>'+
          '<small>'+esc(u.lesson.title||'')+' · درس '+esc(u.lesson.order)+'</small>'+
        '</div>'+
        W('<button type="button" class="btn sm pri" data-act="newSession" data-book="'+u.book.id+'">إعطاؤه</button>')+
        '</div>';
      }).join('')+
    '</div></div>';
  }
  // حضور اليوم
  var todayMarks=D.att[td]||{};
  var c={p:0,l:0,a:0,u:0};
  myEnrolls.forEach(function(e){
    var m=todayMarks[e.studentId];
    if(m)c[m]++;
    else c.u++;
  });
  h+='<div class="card"><h2>حضور اليوم</h2>'+
    (D.att[td]?
      '<div class="sumpills">'+
        '<span class="pill good">حاضر '+c.p+'</span>'+
        '<span class="pill warn">متأخر '+c.l+'</span>'+
        '<span class="pill bad">غائب '+c.a+'</span>'+
        '<span class="pill">غير محدد '+c.u+'</span>'+
      '</div>':
      '<p class="note">لم يُسجَّل حضور اليوم بعد.</p>'
    )+
    W('<div style="margin-top:12px"><button type="button" class="btn sm" data-act="newSession">فتح حصة</button></div>')+
  '</div>';
  // طلابي حسب النقاط
  var myLeader=myStudentIds.map(function(sid){
    var s=D.sMap[sid];
    if(!s)return null;
    return {sid:sid,name:s.name,pt:pointsOf(sid,'','')};
  }).filter(Boolean).sort(function(a,b){return b.pt.total-a.pt.total;}).slice(0,8);
  if(myLeader.length){
    h+='<div class="card"><h2>طلابي (حسب النقاط)</h2>'+
      '<div class="list">'+myLeader.map(function(r,i){

        '</div><span class="amt">'+fmt(r.pt.total)+' نقطة</span></div>';
      }).join('')+'</div>'+
    '</div>';
  }
  return h;

function nextSelfNo(prefix){
  var all=[].concat(ALL('students'), ALL('teachers'), ALL('supervisors'))
    .map(function(x){
      var n=num(String(x.self_no||'').replace(/\D/g,''));

function sbMsg(e){
  var m=String((e&&e.message)||'');
  if(/invalid login/i.test(m))return 'الرقم الذاتي أو كلمة المرور غير صحيحة.';
  if(/email not confirmed/i.test(m))return 'لم يُفعَّل الحساب بعد. تواصل مع المشرف.';
  if(/already registered|already been registered/i.test(m))return 'هذا الحساب مسجّل بالفعل.';
  if(/rate limit|too many/i.test(m))return 'محاولات كثيرة. انتظر قليلاً.';
  if(/password/i.test(m))return 'كلمة المرور ضعيفة أو غير صحيحة.';
  if(/user not found/i.test(m))return 'لا يوجد حساب بهذا الرقم الذاتي. تحقق من رقمك.';
  return 'تعذّر إتمام العملية: '+(e.message||'خطأ غير معروف');
}

      '<div class="fld"><label for="a_selfno">الرقم الذاتي أو البريد الإلكتروني</label>'+

        'الطالب: 1001 وما بعده · المعلم: 2001 وما بعده · المشرف: 3001 وما بعده.<br>'+
        'كلمة المرور المبدئية: <b dir="ltr">000000</b> (تتغيّر عند أول دخول).'+
      '</p>'+
    '</form>'
  );
  var f=$('#authform'), er=$('#aerr');
  function busy(b){
    var bi=$('#a_in');if(bi)bi.disabled=b;
    var bl=$('#a_local');if(bl)bl.disabled=b;
  }
  f.addEventListener('submit', function(ev){
    ev.preventDefault();
    var raw=String(f.selfno.value||'').trim();
    var isEm=raw.indexOf('@')>0;
    var no=raw.replace(/\D/g,'');
    var pw=String(f.password.value||'');
    if((!no&&!isEm)||!pw){er.textContent='أدخل الرقم الذاتي (أو البريد الإلكتروني) وكلمة المرور.';return;}
    er.textContent='';busy(true);
    var remEl=$('#a_rem');
    setRemember(!remEl||remEl.checked);
    var em=isEm?raw.toLowerCase():authEmail(no);
    SB.client.auth.signInWithPassword({email:em,password:pw}).then(function(r){
      if(r.error&&pw==='0000'){return SB.client.auth.signInWithPassword({email:em,password:'000000'});}
      return r;
    }).then(function(r){
      busy(false);
      if(r.error){er.textContent=sbMsg(r.error);return;}
      gate(r.data.session);
    },function(e){busy(false);er.textContent=sbMsg(e);});
  });
  $('#a_local').addEventListener('click',function(){localBoot();});
}

/* ============================================================
   Gate — التحقق من الصلاحية
   ============================================================ */
function gate(session){
  if(!session||!session.user){showLogin();return;}
  SB.user=session.user;
  SB.dbg='';
  SB.client.auth.getSession().then(function(g){
    var ses=(g&&g.data&&g.data.session)||session;
    return SB.client.from('profiles').select('*').eq('id',SB.user.id).maybeSingle();
  }).then(function(r){
    if(r.error){SB.dbg+=' | profile-error='+(r.error.code||'');}
    var prof=r.data;
    if(!prof){
      return SB.client.rpc('create_profile').then(function(q){
        if(q&&q.data&&q.data.length){
          var row=q.data[0];
          S.profile=row;
          if(row.must_change){showMustChange();return;}
          startApp(row.role);
        } else {
          showPending();
        }
      },function(){showPending();});
    }
    S.profile=prof;
    var role=prof.role||'pending';
    if(role==='pending'){showPending();return;}
    if(prof.must_change){showMustChange();return;}
    startApp(role);
  }).catch(function(e){
    authScreen('تعذّر التحقق من الحساب',
      '<p>تحقق من الاتصال ثم أعد المحاولة.</p>'+
      '<p dir="ltr" class="note">'+esc(String((e&&e.message)||e))+'</p>'+
      '<div class="mact"><button type="button" class="btn pri" onclick="location.reload()">إعادة المحاولة</button></div>'
    );
  });
}

/* ============================================================
   Supabase Adapter — طبقة تكيّف لـ Data
   ============================================================ */
function sbAdapter(cl){
  var cache={}, subs={}, loaded=false;
  function notify(c){(subs[c]||[]).forEach(function(f){try{f();}catch(e){}});}
  function snap(c){
    var o=cache[c]||{};
    return {docs:Object.keys(o).map(function(id){
      return {id:id,data:function(){return o[id];}};
    })};
  }
  function fail(e){
    var x=new Error((e&&e.message)||'error');
    x.code=(e&&e.code==='42501')?'invalid_argument':'sb';
    return x;
  }
  function load(){
    var all={},from=0;
    function page(){
      return cl.from('docs').select('col,id,data').order('col').order('id').range(from,from+999).then(function(r){
        if(r.error)throw fail(r.error);
        r.data.forEach(function(x){(all[x.col]=all[x.col]||{})[x.id]=x.data;});
        if(r.data.length===1000){from+=1000;return page();}
      });
    }
    return page().then(function(){
      cache=all;
      loaded=true;
      COLS.concat(['settings']).forEach(notify);
    });
  }
  function listen(){
    cl.channel('docs-sync').on('postgres_changes',
      {event:'*',schema:'public',table:'docs'},
      function(p){
        var n=(p.new&&p.new.col)?p.new:p.old;
        if(!n||!n.col)return;
        if(p.eventType==='DELETE'){
          if(cache[n.col])delete cache[n.col][n.id];
        }else{
          (cache[n.col]=cache[n.col]||{})[n.id]=p.new.data;
        }
        notify(n.col);
      }
    ).subscribe(function(st){SB.rt=(st==='SUBSCRIBED');});
    setInterval(function(){
      if(!SB.rt&&!document.hidden)load().catch(function(){});
    },45000);
  }
  function put(c,id,d){
    return cl.from('docs').upsert({
      col:c,id:id,data:d,
      updated_at:new Date().toISOString(),
      updated_by:SB.user&&SB.user.id
    }).then(function(r){
      if(r.error)throw fail(r.error);
      (cache[c]=cache[c]||{})[id]=d;
      notify(c);
    });
  }
  function del(c,id){
    return cl.from('docs').delete().eq('col',c).eq('id',id).then(function(r){
      if(r.error)throw fail(r.error);
      if(cache[c])delete cache[c][id];
      notify(c);
    });
  }
  function update(c,id,patch){
    var current=(cache[c]||{})[id]||{};
    var merged=Object.assign({},current,patch);
    if(patch.marks&&current.marks){
      merged.marks=Object.assign({},current.marks,patch.marks);
    }
    return put(c,id,merged);
  }
  return {
    collection:function(c){
      return {
        doc:function(id){
          return {
            set:function(d){return put(c,id,d);},
            update:function(p){return update(c,id,p);},
            delete:function(){return del(c,id);}
          };
        },
        onSnapshot:function(cb){
          (subs[c]=subs[c]||[]).push(function(){cb(snap(c));});
          if(loaded)cb(snap(c));
        }
      };
    },
    doc:function(path){
      var p=path.split('/');
      return {onSnapshot:function(cb){
        function f(){
          var o=(cache[p[0]]||{})[p[1]];
          cb({exists:!!o,data:function(){return o;}});
        }
        (subs[p[0]]=subs[p[0]]||[]).push(f);
        if(loaded)f();
      }};
    },
    cacheSet:function(c,id,d){(cache[c]=cache[c]||{})[id]=d;},
    start:function(){return load().then(listen);}
  };
}

/* ============================================================
   Supabase boot
   ============================================================ */
var REM_KEY='hb_remember',TS_KEY='hb_login_ts',REM_MS=30*24*3600*1000;
function remOn(){try{return localStorage.getItem(REM_KEY)!=='0';}catch(e){return true;}}
function setRemember(on){
  try{
    localStorage.setItem(REM_KEY,on?'1':'0');
    if(on)localStorage.setItem(TS_KEY,String(Date.now()));
    // انقل الجلسة الحالية (إن وُجدت) إلى المخزن الصحيح
    [localStorage,sessionStorage].forEach(function(a){
      var b=a===localStorage?sessionStorage:localStorage;
      Object.keys(a).forEach(function(k){
        if(k.indexOf('sb-')===0&&((on&&a===sessionStorage)||(!on&&a===localStorage))){b.setItem(k,a.getItem(k));a.removeItem(k);}
      });
    });
  }catch(e){}
}
var authStore={
  getItem:function(k){try{return sessionStorage.getItem(k)||localStorage.getItem(k);}catch(e){return null;}},
  setItem:function(k,v){try{var on=remOn();(on?localStorage:sessionStorage).setItem(k,v);(on?sessionStorage:localStorage).removeItem(k);}catch(e){}},
  removeItem:function(k){try{localStorage.removeItem(k);sessionStorage.removeItem(k);}catch(e){}}
};
function sbBoot(){
  SB.on=true;
  SB.client=window.supabase.createClient(SB_URL,SB_KEY,{auth:{storage:authStore,persistSession:true,autoRefreshToken:true}});
  S.mode='wait';
  render();
  authScreen('جارٍ التحميل…','<p class="note">لحظات…</p>');
  var expired=false;
  try{var ts=+localStorage.getItem(TS_KEY)||0;expired=remOn()&&ts&&(Date.now()-ts>REM_MS);}catch(e){}
  if(expired){
    try{localStorage.removeItem(TS_KEY);}catch(e){}
    SB.client.auth.signOut().then(function(){showLogin();},function(){showLogin();});
    return;
  }
  SB.client.auth.getSession().then(function(r){
    var ses=r&&r.data&&r.data.session;
    if(ses){gate(ses);}
    else{showLogin();}
  },function(){
    showLogin('تعذّر الاتصال. أعد المحاولة.');
  });
  SB.client.auth.onAuthStateChange(function(ev){
    if(ev==='SIGNED_OUT'){location.reload();}
  });
}

      {k:'no',l:'رقم الطالب الداخلي',t:'number',ro:1,hint:'يُولَّد تلقائياً'},
      {k:'status',l:'حالة القبول',t:'select',o:ADM},
      {k:'gender',l:'الجنس',t:'select',o:['ذكر','أنثى']},
      {k:'birth',l:'تاريخ الميلاد',t:'date'},
      {k:'nationalId',l:'الرقم الوطني'},
      {k:'city',l:'المدينة / المحافظة',list:['دمشق','ريف دمشق','حلب','حمص','حماة','إدلب','اللاذقية','طرطوس','درعا','السويداء','القنيطرة','دير الزور','الرقة','الحسكة']},
      {k:'track',l:'نوع الدراسة',t:'select',o:['القرآن الكريم','الرشيدي'],hint:'الرشيدي: تأسيس القراءة قبل القرآن (124 صفحة).'},
      {k:'admDate',l:'تاريخ التقديم',t:'date'},
      {k:'guardian',l:'اسم ولي الأمر'},
      {k:'guardianPhone',l:'هاتف ولي الأمر',t:'tel'},
      {k:'phone',l:'هاتف الطالب',t:'tel'},
      {k:'address',l:'العنوان',full:1},
      {k:'notes',l:'ملاحظات',t:'textarea',full:1}
    ],
    submit:function(x){
      x.name=String(x.name||'').trim();
      if(!x.name)return 'أدخل اسم الطالب.';
      x.no=num(x.no)||nextNo();
      x.self_no=num(x.self_no)||nextSelfNo(1);
      if(!s){
        var dNo=S.students.filter(function(o){return o.no===x.no;})[0];
        var dSn=S.students.filter(function(o){return o.self_no===x.self_no;})[0];
        var dd=dNo||dSn;
        if(dd&&String(dd.name||'').trim()===x.name)return 'يبدو أن الطالب «'+dd.name+'» أُضيف مسبقاً. راجع قائمة الطلاب.';
        if(dNo)x.no=nextNo();
        if(dSn)x.self_no=nextSelfNo(1);
      }
      if(S.students.some(function(o){return o.no===x.no&&(!s||o.id!==s.id);}))
        return 'رقم الطالب مستخدم من قبل.';
      if(S.students.some(function(o){return o.self_no===x.self_no&&(!s||o.id!==s.id);}))
        return 'الرقم الذاتي مستخدم من قبل.';
      var data=Object.assign({},s||{},x);
      var oldT=s?(s.track||'القرآن الكريم'):'';
      if(oldT!==x.track){
        data.trackLog=(data.trackLog||[]).concat([{from:oldT,to:x.track,date:today()}]);
      }
      if(!s){
        data.createdBy=SB.user?SB.user.id:'local';
        data.createdByRole=myRole();
      }
      return Data.put('students',s?s.id:uid(),data).then(function(){
        toast(s?'تم تحديث بيانات الطالب':'تمت إضافة الطالب — رقمه الذاتي '+x.self_no);
        if(!s)tryCreateAuthAccount(x.self_no,x.name,'student');
      });
    }
  });
}

    p_self_no:String(selfNo),

    p_role:role,
    p_initial_password:'000000'
  }).then(function(r){

      toast('تعذّر إنشاء حساب الدخول للرقم '+selfNo+': '+(r.error.message||r.error));

  },function(e){
    console.warn('auth account creation failed:',e);

/* ============================================================
   vPortal — البوابة الموحّدة (طالب + ولي أمر)
   ============================================================ */
function vPortal(){
  if(myRole()!=='student'&&myRole()!=='parent'){
    return '<div class="card"><p class="note">هذه الصفحة للطلاب وأولياء الأمور فقط.</p></div>';
  }
  var p=S.profile||{};
  var sid=p.student_id||(S.me&&S.me.studentId)||(S.user&&S.user.student_id)||'';
  var s=sid?D.sMap[sid]:null;
  if(!s){
    return '<div class="card"><h2>لم يتم ربط حسابك بطالب</h2>'+
      '<p class="note">تواصل مع المشرف لربط حسابك بملف الطالب.</p></div>';
  }
  var pt=pointsOf(sid,'','');
  var mm=memoOf(sid);
  var tot=pt.p+pt.l+pt.a;
  var last=lastOf(sid);
  var h=vh('بوابة '+esc(s.name),
    'الرقم الذاتي: <code dir="ltr">'+esc(s.self_no||'—')+'</code>',
    '<button type="button" class="btn" data-act="logout">'+ico('logout')+'خروج</button>');
  h+='<section class="kpis">'+
    '<div class="kpi"><small>النقاط</small><b>'+fmt(pt.total)+'</b></div>'+
    '<div class="kpi"><small>الحفظ</small><b>'+mm.count+' / 604</b><i>'+mm.done+' جزءاً مكتملاً</i></div>'+
    '<div class="kpi"><small>الحضور</small><b>'+(tot?Math.round(pt.p/tot*100)+'%':'—')+'</b><i>'+pt.p+' حاضر</i></div>'+
    '<div class="kpi"><small>آخر صفحة</small><b style="font-size:20px">'+(last.read?absPage(last.read.juz,last.read.page):'—')+'</b></div>'+
  '</section>';
  var recs=((D.pg[sid]&&D.pg[sid].rec)||[]).slice()
    .sort(function(a,b){return (b.ts||0)-(a.ts||0);})
    .slice(0,10);
  if(recs.length){
    h+='<div class="card"><h2>آخر التسميعات</h2>'+
      '<div class="list">'+recs.map(function(r){
        var a=absPage(r.juz,r.page);
        return '<div class="li"><div>'+
          '<a class="linkb" href="'+esc(quranLink(a))+'" target="_blank" rel="noopener">صفحة '+a+'</a>'+
          ' · الجزء '+r.juz+
          ' <span class="pill '+(r.g==='redo'?'warn':'acc')+'">'+GRADES[r.g]+'</span>'+
          '<small>'+esc(r.d)+(r.note?' · '+esc(r.note):'')+'</small>'+
        '</div></div>';
      }).join('')+'</div>'+
    '</div>';
  }
  var myEn=S.enrollments.filter(function(e){
    return e.studentId===sid&&e.year===curYear()&&e.status==='نشط';
  })[0];
  if(myEn&&myEn.teacherId){
    var _mt=D.tMap[myEn.teacherId];
    var myBooks=S.books.filter(function(b){return _mt&&(_mt.selectedBooks||[]).indexOf(b.id)>=0;});
    if(myBooks.length){
      h+='<div class="card"><h2>كتبي والدرس القادم</h2><div class="list">'+
        myBooks.map(function(b){
          var lessons=S.lessons.filter(function(l){return l.bookId===b.id;})
            .sort(function(a,b){return num(a.order)-num(b.order);});
          var lastS=S.sessions.filter(function(x){
            return x.teacherId===myEn.teacherId&&x.bookId===b.id;
          }).sort(function(a,b){return a.date<b.date?1:-1;})[0];
          var lastO=lastS?num(lastS.lessonOrder):0;
          var next=lessons.find(function(l){return num(l.order)>lastO;});
          if(!next)return '';
          return '<div class="li"><div>'+
            '<b>'+esc(b.name)+'</b>'+
            '<small>الدرس القادم: '+esc(next.title||'')+' (درس '+esc(next.order)+')</small>'+
          '</div></div>';
        }).join('')+
      '</div></div>';
    }
  }
  var certs=S.certificates.filter(function(c){
    return c.recipientType==='student'&&c.recipientId===sid;
  }).sort(function(a,b){return num(b.certNo)-num(a.certNo);});
  if(certs.length){
    h+='<div class="card"><h2>شهاداتي</h2><div class="list">'+
      certs.map(function(c){
        return '<div class="li"><div>'+
          '<b>'+esc(certTitle(c))+'</b>'+
          '<small>رقم '+esc(certNo(c.certNo))+' · '+esc(c.date)+'</small>'+
        '</div><button type="button" class="btn sm" data-act="viewCert" data-id="'+c.id+'">عرض</button></div>';
      }).join('')+'</div>'+
    '</div>';
  }
  var badges=computeBadges(sid);
  if(badges.length&&S.settings.badges.enabled){
    h+='<div class="card"><h2>الشارات</h2><div class="badge-grid">'+
      badges.map(function(b){
        return '<div class="badge-card"><svg viewBox="0 0 24 24">'+IC.badge+'</svg>'+
          '<b>'+esc(b.title)+'</b><small>'+esc(b.desc||'')+'</small></div>';
      }).join('')+'</div></div>';
  }
  return h;
}

ACT.exportStudentsXlsx=function(){
  if(typeof XLSX==='undefined'){
    toast('مكتبة Excel غير محمّلة. تحقق من الاتصال.');
    return;
  }
  derive();
  var head=['الرقم','الرقم الذاتي','الاسم','حالة القبول','الجنس','تاريخ الميلاد','الرقم الوطني','المدينة','ولي الأمر','هاتف ولي الأمر','هاتف الطالب','العنوان','نوع الدراسة','ملاحظات'];
  var rows=S.students.slice().sort(function(a,b){return num(a.no)-num(b.no);}).map(function(s){
    return [
      num(s.no),
      s.self_no||'',
      s.name,
      s.status,
      s.gender||'',
      s.birth||'',
      s.nationalId||'',
      s.city||'',
      s.guardian||'',
      s.guardianPhone||'',
      s.phone||'',
      s.address||'',
      s.track||'',
      s.notes||''
    ];
  });
  try{
    var wb=XLSX.utils.book_new();
    wb.Workbook={Views:[{RTL:true}]};
    var ws=XLSX.utils.aoa_to_sheet([head].concat(rows));
    ws['!cols']=head.map(function(){return {wch:16};});
    XLSX.utils.book_append_sheet(wb,ws,'الطلاب');
    var out=XLSX.write(wb,{type:'array',bookType:'xlsx'});
    var blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='الطلاب-'+today()+'.xlsx';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
    toast('تم تنزيل الملف');
  }catch(e){
    toast('تعذّر إنشاء الملف.');
  }
};

function enrollForm(id,sid){
  var e=id?S.enrollments.find(function(x){return x.id===id;}):null;
  var st=S.settings;
  var list=S.students.filter(function(s){
    return s.status==='مقبول'||(e&&s.id===e.studentId)||s.id===sid;
  }).sort(function(a,b){return a.name<b.name?-1:1;});
  if(!list.length){
    toast('لا يوجد طلاب مقبولون. غيّر حالة الطالب إلى «مقبول» أولاً.');
    return;
  }
  var v=e?Object.assign({},e):{
    studentId:sid||'',
    year:curYear(),
    stage:st.stages[0]||'الابتدائية',
    section:st.sections[0]||'أ',
    shift:SHIFTS[0]||'ذكور',
    status:'نشط',
    date:today(),
    centerId:'',
    halaqaId:'',
    teacherId:'',
    level:''
  };
  var lastC=v.centerId||'';
  var lastH=v.halaqaId||'';
  M.push({
    title:e?'تعديل التسجيل':'تسجيل جديد',
    values:v,
    wide:1,
    fields:[
      {k:'studentId',l:'الطالب',t:'select',req:1,full:1,
        o:[['','اختر الطالب…']].concat(list.map(function(s){
          return [s.id,s.no+' — '+s.name+(s.self_no?' ('+s.self_no+')':'')];
        }))},
      {k:'year',l:'السنة الدراسية',t:'select',o:withCur(yearsList(),v.year)},
      {k:'status',l:'حالة التسجيل',t:'select',o:ENST},
      {k:'centerId',l:'المركز',t:'select',
        o:[['','بدون مركز']].concat(S.centers.slice().sort(function(a,b){return a.name<b.name?-1:1;})
          .map(function(c){return [c.id,c.name];}))},
      {k:'halaqaId',l:'الحلقة',t:'select',o:haOpts(v.centerId),
        hint:'تُحدَّد معلم الحلقة تلقائياً.'},
      {k:'teacherId',l:'المعلم',t:'select',
        o:[['','بدون معلم']].concat(S.teachers.slice().sort(function(a,b){return a.name<b.name?-1:1;})
          .map(function(t){return [t.id,t.name];}))},
      {k:'level',l:'المستوى',t:'select',
        o:[['','غير محدد']].concat(withCur(levelsList(),v.level))},
      {k:'stage',l:'المرحلة',t:'select',o:withCur(stageList(),v.stage)},
      {k:'section',l:'القسم',t:'select',o:withCur(st.sections,v.section)},
      {k:'shift',l:'ذكور / إناث',t:'select',o:SHIFTS},
      {k:'date',l:'تاريخ التسجيل',t:'date'},
      {k:'notes',l:'ملاحظات',t:'textarea',full:1}
    ],
    onInput:function(form){
      var cEl=form.elements.centerId;
      var hEl=form.elements.halaqaId;
      var tEl=form.elements.teacherId;
      if(!cEl||!hEl||!tEl)return;
      if(cEl.value!==lastC){
        lastC=cEl.value;
        hEl.innerHTML=haOpts(lastC).map(function(o){
          return '<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>';
        }).join('');
        lastH='';
      }
      if(hEl.value!==lastH){
        lastH=hEl.value;
        var ha=S.halaqat.filter(function(x){return x.id===lastH;})[0];
        if(ha&&ha.teacherId)tEl.value=ha.teacherId;
        var hint=$('#h_halaqaId');
        if(hint){
          hint.textContent=ha&&ha.teacherId
            ?'معلم الحلقة: '+tName(ha.teacherId)
            :'تُحدَّد معلم الحلقة تلقائياً.';
        }
      }
    },
    submit:function(x){
      if(!x.studentId)return 'اختر الطالب.';
      if(S.halaqat.length&&!x.halaqaId){
        return 'اختر الحلقة. أنشئ الحلقات من قسم «المراكز والحلقات» إن لم تكن موجودة.';
      }
      if(x.halaqaId){
        var ha=S.halaqat.filter(function(h){return h.id===x.halaqaId;})[0];
        if(ha){
          if(x.centerId&&ha.centerId!==x.centerId){
            return 'هذه الحلقة لا تتبع المركز المختار.';
          }
          x.centerId=ha.centerId;
          if(!x.teacherId&&ha.teacherId)x.teacherId=ha.teacherId;
        }
      }
      if(S.enrollments.some(function(o){
        return o.studentId===x.studentId&&o.year===x.year&&(!e||o.id!==e.id);
      })){
        return 'هذا الطالب مسجّل في هذه السنة من قبل. عدّل التسجيل الموجود.';
      }
      var log=((e&&e.levelLog)||[]).slice();
      var oldLevel=e?(e.level||''):'';
      var newLevel=x.level||'';
      if(oldLevel!==newLevel&&(newLevel||oldLevel)){
        log.push({from:oldLevel,to:newLevel,date:today()});
      }
      x.levelLog=log;
      var ps=[];
      if(x.status==='نشط'){
        S.enrollments.forEach(function(o){
          if(o.studentId===x.studentId&&o.id!==(e&&e.id)&&o.status==='نشط'&&o.year<x.year){
            ps.push(Data.put('enrollments',o.id,Object.assign({},o,{status:'منتهٍ'})));
          }
        });
      }
      ps.push(Data.put('enrollments',e?e.id:uid(),Object.assign({},e||{},x)));
      return Promise.all(ps).then(function(){
        toast(e?'تم تحديث التسجيل':
          'تم التسجيل'+(ps.length>1?' وأُنهيت تسجيلات السنوات السابقة (مع حفظها في السجل)':''));
      });
    }
  });
}

ACT.exportEnrollXlsx=function(){
  if(typeof XLSX==='undefined'){toast('مكتبة Excel غير محمّلة.');return;}
  derive();
  var Y=curYear();
  var rows=S.enrollments.filter(function(e){return e.year===Y;})
    .sort(function(a,b){return sName(a.studentId)<sName(b.studentId)?-1:1;});
  if(!rows.length){toast('لا توجد تسجيلات في هذه السنة.');return;}
  var head=['السنة','الرقم','الرقم الذاتي','الطالب','المرحلة','القسم','ذكور / إناث','المركز','الحلقة','المستوى','المعلم','الحالة','تاريخ التسجيل'];
  var data=rows.map(function(e){
    var c=e.centerId&&D.cMap[e.centerId];
    var ha=e.halaqaId&&S.halaqat.filter(function(x){return x.id===e.halaqaId;})[0];
    return [
      e.year, num(sNo(e.studentId)), e.self_no||'',
      sName(e.studentId), e.stage, e.section, e.shift,
      c?c.name:'', ha?ha.name:'', e.level||'',
      e.teacherId?tName(e.teacherId):'',
      e.status, e.date||''
    ];
  });
  try{
    var wb=XLSX.utils.book_new();
    wb.Workbook={Views:[{RTL:true}]};
    var ws=XLSX.utils.aoa_to_sheet([head].concat(data));
    ws['!cols']=head.map(function(){return {wch:16};});
    XLSX.utils.book_append_sheet(wb,ws,'التسجيلات-'+Y);
    var out=XLSX.write(wb,{type:'array',bookType:'xlsx'});
    var blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='التسجيلات-'+Y+'.xlsx';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
    toast('تم تنزيل الملف');
  }catch(e){
    toast('تعذّر إنشاء الملف.');
  }
};

/* ============================================================
   إحصاءات المراكز والمناطق
   ============================================================ */
function computeRegionStats(rid){
  var Y=curYear();
  var centers=S.centers.filter(function(c){return c.regionId===rid;});
  var centerIds=centers.map(function(c){return c.id;});
  var enrolls=S.enrollments.filter(function(e){
    return e.year===Y&&e.status==='نشط'&&centerIds.indexOf(e.centerId)>=0;
  });
  var teacherIds=[];
  enrolls.forEach(function(e){if(e.teacherId&&teacherIds.indexOf(e.teacherId)<0)teacherIds.push(e.teacherId);});
  var uniqStudents={};
  enrolls.forEach(function(e){uniqStudents[e.studentId]=1;});
  return {
    centers:centers.length,
    halaqat:S.halaqat.filter(function(h){return centerIds.indexOf(h.centerId)>=0;}).length,
    teachers:teacherIds.length,
    students:Object.keys(uniqStudents).length
  };
}
function computeCenterStats(cid){
  var Y=curYear();
  var enrolls=S.enrollments.filter(function(e){
    return e.year===Y&&e.status==='نشط'&&e.centerId===cid;
  });
  var teacherIds=[];
  enrolls.forEach(function(e){if(e.teacherId&&teacherIds.indexOf(e.teacherId)<0)teacherIds.push(e.teacherId);});
  var uniq={};
  enrolls.forEach(function(e){uniq[e.studentId]=1;});
  return {
    halaqat:S.halaqat.filter(function(h){return h.centerId===cid;}).length,
    teachers:teacherIds.length,
    students:Object.keys(uniq).length
  };
}
/* ============================================================
   إحصاءات المشرفين والمعلمين
   ============================================================ */
function supStats(sid){
  var Y=curYear();
  var centers=S.centers.filter(function(c){return c.supervisorId===sid;});
  var region=S.regions.filter(function(r){return r.rmId===sid;});
  return {
    centers:centers.length,
    regions:region.length
  };
}
function tStats(tid){
  var Y=curYear();
  var enrolls=S.enrollments.filter(function(e){
    return e.teacherId===tid&&e.year===Y&&e.status==='نشط';
  });
  var uniq={};
  enrolls.forEach(function(e){uniq[e.studentId]=1;});
  var p=0,l=0,a=0,x=0;
  Object.keys(D.tatt).forEach(function(d){
    var st=D.tatt[d][tid];
    if(st==='p')p++;
    else if(st==='l')l++;
    else if(st==='a')a++;
    else if(st==='e')x++;
  });
  var n=p+l+a;
  var ev=S.tevals.filter(function(e){return e.teacherId===tid;})
    .sort(function(a,b){return a.period<b.period?1:-1;});
  var avg=ev.length?Math.round(ev.reduce(function(s,e){return s+num(e.pct);},0)/ev.length):null;
  return {
    p:p, l:l, a:a, x:x,
    rate:n?Math.round((p+0.5*l)/n*100):null,
    avg:avg,
    ev:ev,
    students:Object.keys(uniq).length,
    enrolls:enrolls.length
  };
}

   ============================================================ */
function supLevelsFor(){
  var lv=myLevel();
  return SUP_LEVELS.filter(function(l){return lv>ROLES[supRole(l)].level;});
}
function supForm(id){
  var t=id?find('supervisors',id):null;
  var levels=supLevelsFor();
  if(t&&levels.indexOf(supLevelNorm(t.level))<0)levels=levels.concat([supLevelNorm(t.level)]);
  if(!levels.length){toast('ليست لديك صلاحية إضافة مدراء.');return;}
  var v=t?Object.assign({},t,{level:supLevelNorm(t.level)}):{
    level:levels[0],
    status:'نشط',
    self_no:nextSelfNo(3)
  };
  var byName_=function(a,b){return a.name<b.name?-1:1;};
  M.push({
    title:t?'تعديل المدير':'مدير جديد',
    values:Object.assign({},v,{halaqaId:curHalaqaOfSup(t&&t.id)}),
    wide:1,
    fields:[
      {k:'name',l:'الاسم',req:1,full:1},
      {k:'self_no',l:'الرقم الذاتي (للدخول)',t:'number',ro:1,hint:'يُولَّد تلقائياً. كلمة المرور المبدئية: 000000'},
      {k:'phone',l:'الهاتف',t:'tel'},
      {k:'level',l:'المستوى',t:'select',o:levels},
      {k:'deptId',l:'الإدارة (لمدير الإدارة)',t:'select',o:[['','—']].concat(S.depts.slice().sort(byName_).map(function(d){return [d.id,d.name];}))},
      {k:'regionId',l:'المنطقة (لمدير المنطقة)',t:'select',o:[['','—']].concat(S.regions.slice().sort(byName_).map(function(r){return [r.id,r.name];}))},
      {k:'centerId',l:'المركز (لمدير المركز)',t:'select',o:[['','—']].concat(S.centers.slice().sort(byName_).map(function(c){return [c.id,c.name];}))},
      {k:'halaqaId',l:'تدريس حلقة (يعمل كمعلم)',t:'select',o:[['','— بدون —']].concat(S.halaqat.slice().sort(byName_).map(function(h){return [h.id,h.name];})),hint:'يُربط المشرف بحلقة فيصبح معلمها ويسجّل الحصص.'},
      {k:'status',l:'الحالة',t:'select',o:['نشط','موقوف']},
      {k:'notes',l:'ملاحظات',t:'textarea',full:1}
    ],
    submit:function(x){
      x.name=String(x.name||'').trim();
      if(!x.name)return 'أدخل الاسم.';
      if(x.halaqaId){var hh=find('halaqat',x.halaqaId);var mine=t&&ALL('teachers').filter(function(o){return o.supId===t.id;})[0];
        if(hh&&hh.teacherId&&(!mine||hh.teacherId!==mine.id))return 'لهذه الحلقة معلم آخر؛ أزل تعيينه أولاً.';}
      x.self_no=num(x.self_no)||nextSelfNo(3);
      if(ALL('supervisors').some(function(o){return num(o.self_no)===x.self_no&&(!t||o.id!==t.id);})){
        return 'الرقم الذاتي مستخدم من قبل.';
      }
      var lv=x.level;
      if(lv==='مدير إدارة'){
        if(S.depts.length&&!x.deptId)return 'اختر الإدارة.';
        x.regionId='';x.centerId='';
      }else if(lv==='مدير منطقة'){
        if(!x.regionId)return 'اختر المنطقة.';
        var rg=find('regions',x.regionId);
        x.deptId=rg&&rg.deptId||'';x.centerId='';
      }else{
        if(!x.centerId)return 'اختر المركز.';
        var ct=find('centers',x.centerId);
        x.regionId=ct&&ct.regionId||'';
        var rg2=x.regionId&&find('regions',x.regionId);
        x.deptId=rg2&&rg2.deptId||'';
      }
      var data=Object.assign({},t||{},x);
      if(!t){
        data.createdBy=SB.user?SB.user.id:'local';
        data.createdByRole=myRole();
      }
      var supId=t?t.id:uid();
      return Data.put('supervisors',supId,data).then(function(){return syncSupTeacher(supId,data,x.halaqaId);}).then(function(){
        toast(t?'تم تحديث المدير':'تمت الإضافة — رقمه الذاتي '+x.self_no);
        if(!t)tryCreateAuthAccount(x.self_no,x.name,supRole(lv));
      });
    }
  });
}

function downloadXlsx(name,sheets){
  if(myRole()==='teacher'){toast('التصدير غير متاح للمعلم.');return;}
  if(typeof XLSX==='undefined'){toast('مكتبة Excel غير محمّلة.');return;}
  try{
    var wb=XLSX.utils.book_new();
    wb.Workbook={Views:[{RTL:true}]};
    sheets.forEach(function(sh){
      var ws=XLSX.utils.aoa_to_sheet([sh.head].concat(sh.rows));
      ws['!cols']=sh.head.map(function(){return {wch:16};});
      XLSX.utils.book_append_sheet(wb,ws,sh.name);
    });
    var out=XLSX.write(wb,{type:'array',bookType:'xlsx'});
    var blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=name+'-'+today()+'.xlsx';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
    toast('تم تنزيل الملف');
  }catch(e){
    toast('تعذّر إنشاء الملف.');
  }
}

function booksOfCenter(centerId){
  if(!centerId)return S.books.slice();
  return S.books.filter(function(b){return b.centerId===centerId;});
}
function myTeacherId(){
  if(myRole()!=='teacher')return (S.me&&S.me.asTeacherId)||'';
  return (S.profile&&S.profile.teacher_id)||
         (S.me&&S.me.teacherId)||
         (S.user&&S.user.teacher_id)||
         '';
}
function myCenterId(){
  if(myRole()==='cs')return (S.profile&&S.profile.center_id)||(S.me&&S.me.centerId)||'';
  if(myRole()==='teacher'){
    var tid=myTeacherId();
    var t=tid?D.tMap[tid]:null;
    return t?t.centerId||'':'';
  }
  return '';
}
function nextLessonFor(teacherId,bookId){
  var lessons=S.lessons.filter(function(l){return l.bookId===bookId;})
    .sort(function(a,b){return num(a.order)-num(b.order);});
  if(!lessons.length)return null;
  var last=S.sessions.filter(function(x){
    return x.teacherId===teacherId&&x.bookId===bookId&&x.status==='تمت';
  }).sort(function(a,b){return a.date<b.date?1:-1;})[0];
  if(!last)return lessons[0];
  var lastOrder=num(last.lessonOrder);
  var next=lessons.find(function(l){return num(l.order)>lastOrder;});
  return next||null;
}
function bookProgress(teacherId,bookId){
  var lessons=S.lessons.filter(function(l){return l.bookId===bookId;});
  var total=lessons.length;
  if(!total)return{total:0,done:0,pct:0,current:null,finished:false};
  var last=S.sessions.filter(function(x){
    return x.teacherId===teacherId&&x.bookId===bookId&&x.status==='تمت';
  }).sort(function(a,b){return a.date<b.date?1:-1;})[0];
  var lastOrder=last?num(last.lessonOrder):0;
  var done=lessons.filter(function(l){return num(l.order)<=lastOrder;}).length;
  var next=nextLessonFor(teacherId,bookId);
  return{
    total:total,
    done:done,
    pct:Math.round(done/total*100),
    current:next,
    finished:!next&&done>0
  };
}

   ============================================================ */
ACT.importLessonsExcel=function(){
  if(!isAtLeast(3))return;
  if(typeof XLSX==='undefined'){toast('مكتبة Excel غير محمّلة.');return;}
  var input=document.createElement('input');
  input.type='file';input.accept='.xlsx,.xls,.csv';input.style.display='none';
  input.addEventListener('change',function(){
    var f=input.files&&input.files[0];
    if(!f)return;
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var wb=XLSX.read(e.target.result,{type:'array'});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var rows=XLSX.utils.sheet_to_json(ws,{defval:''});
        if(!rows.length){toast('الملف فارغ.');return;}
        parseLessonsExcel(rows);
      }catch(err){toast('تعذّر قراءة الملف: '+(err.message||''));}
    };
    reader.readAsArrayBuffer(f);
  });
  document.body.appendChild(input);
  input.click();
  setTimeout(function(){input.remove();},60000);
};
function parseLessonsExcel(rows){
  var byBook={};
  rows.forEach(function(r){
    var bookName=String(r['الكتاب']||r['اسم الكتاب']||r.Book||'').trim();
    var title=String(r['عنوان الدرس']||r['العنوان']||r.Title||r['الدرس']||'').trim();
    if(!bookName||!title)return;
    if(!byBook[bookName])byBook[bookName]=[];
    byBook[bookName].push({
      order:num(r['رقم الدرس']||r['الترتيب']||r.Order||0),
      title:title,
      pageFrom:num(r['من صفحة']||r.PageFrom||0),
      pageTo:num(r['إلى صفحة']||r.PageTo||0),
      objectives:String(r['الأهداف']||r.Objectives||r['أهداف']||'')
    });
  });
  var preview=Object.keys(byBook).map(function(bn){
    var book=S.books.filter(function(b){return b.name===bn;})[0];
    return {bookName:bn,matched:!!book,bookId:book?book.id:'',count:byBook[bn].length};
  });
  if(!preview.length){toast('لم يُعثر على صفوف صالحة. تحقق من العناوين.');return;}
  showLessonsPreview(byBook,preview);
}
function showLessonsPreview(byBook,preview){
  S.ui.__lessonsImport={byBook:byBook,preview:preview};
  M.push({
    title:'معاينة استيراد الدروس',
    body:function(){
      var p=S.ui.__lessonsImport;
      if(!p)return '<p class="note">لا توجد بيانات.</p>';
      var matched=p.preview.filter(function(x){return x.matched;});
      var unmatched=p.preview.filter(function(x){return !x.matched;});
      var s='<p>عدد الكتب في الملف: <b>'+p.preview.length+'</b> · صالحة: <b style="color:var(--good)">'+matched.length+'</b> · غير موجودة: <b style="color:var(--bad)">'+unmatched.length+'</b></p>';
      if(matched.length){
        s+='<h3 style="margin-top:12px">كتب موجودة</h3>'+
          '<div class="tw"><table><thead><tr><th>الكتاب</th><th>الدروس</th></tr></thead><tbody>'+
          matched.map(function(x){
            return '<tr><td>'+esc(x.bookName)+'</td><td>'+x.count+'</td></tr>';
          }).join('')+'</tbody></table></div>';
      }
      if(unmatched.length){

ACT.doLessonsImport=function(){
  var p=S.ui.__lessonsImport;
  if(!p)return;
  var jobs=[];
  p.preview.forEach(function(bk){
    if(!bk.matched)return;
    var items=p.byBook[bk.bookName]||[];
    var existingOrders={};
    S.lessons.filter(function(l){return l.bookId===bk.bookId;})
      .forEach(function(l){existingOrders[num(l.order)]=true;});
    items.forEach(function(it){
      if(existingOrders[it.order])return; // Skip duplicates by order
      jobs.push({
        bookId:bk.bookId,
        order:it.order,
        title:it.title,
        pageFrom:it.pageFrom,
        pageTo:it.pageTo,
        objectives:it.objectives
      });
    });
  });
  if(!jobs.length){toast('لا توجد دروس جديدة (كلها موجودة).');return;}
  M.pop();
  toast('جارٍ استيراد '+jobs.length+' درساً…');
  var i=0,fail=null;
  function step(){
    if(i>=jobs.length||fail)return Promise.resolve();
    var j=jobs[i++];
    return Data.put('lessons',uid(),j).then(step,function(e){fail=e;});
  }
  var workers=[];for(var k=0;k<5;k++)workers.push(step());
  Promise.all(workers).then(function(){
    if(fail){toast(errMsg(fail));return;}
    toast('تم استيراد '+jobs.length+' درساً');
    S.ui.__lessonsImport=null;
  },function(e){toast(errMsg(e));});
};

/* ============================================================
   batchPut — كتابة دفعية سريعة
   ============================================================ */
function batchPut(col, items){
  if(!items.length)return Promise.resolve();
  if(Data.db&&SB.client&&SB.user){
    var rows=items.map(function(item){
      var d=Object.assign({},item.data);
      delete d.id;
      return{
        col:col, id:item.id, data:d,
        updated_at:new Date().toISOString(),
        updated_by:SB.user.id
      };
    });
    var chunks=[];
    for(var i=0;i<rows.length;i+=500)chunks.push(rows.slice(i,i+500));
    return chunks.reduce(function(p,chunk){
      return p.then(function(){
        return SB.client.from('docs').upsert(chunk).then(function(r){
          if(r.error)throw new Error(r.error.message);
        });
      });
    },Promise.resolve()).then(function(){
      var arr=(RAW[col]=RAW[col]||[]);
      items.forEach(function(item){
        var data=Object.assign({id:item.id},item.data);
        var existing=arr.find(function(x){return x.id===item.id;});
        if(existing)Object.assign(existing,item.data);
        else arr.push(data);
        if(SB.adapter&&SB.adapter.cacheSet)SB.adapter.cacheSet(col,item.id,item.data);
      });
      refresh();
    });
  }
  if(!Data.local[col])Data.local[col]={};
  items.forEach(function(item){
    var d=Object.assign({},item.data);
    delete d.id;
    Data.local[col][item.id]=d;
  });
  Data.saveLocal();
  Data.pull();
  refresh();
  return Promise.resolve();
}
/* ============================================================
   قاعدة أرقام متسلسلة
   ============================================================ */
function maxNum(collection, field, fallback){
  return collection.reduce(function(m,x){
    var n=num(x[field]);
    return n>m?n:m;
  },fallback);
}
function maxSelfNo(collection, prefix){
  return collection.reduce(function(m,x){
    var n=num(String(x.self_no||'').replace(/\D/g,''));
    if(Math.floor(n/1000)===prefix&&n>m)return n;
    return m;
  },prefix*1000);
}
/* ============================================================
   ملف الاستيراد: الفتح والقراءة
   ============================================================ */
function triggerFile(col){
  if(typeof XLSX==='undefined'){toast('مكتبة Excel لم تُحمَّل. تحقق من الاتصال.');return;}
  var input=document.createElement('input');
  input.type='file';
  input.accept='.xlsx,.xls,.csv';
  input.style.display='none';
  input.addEventListener('change',function(){
    var f=input.files&&input.files[0];
    if(!f)return;
    if(f.size>5*1024*1024){toast('الملف أكبر من 5 ميغابايت.');return;}
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var wb=XLSX.read(e.target.result,{type:'array'});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var rows=XLSX.utils.sheet_to_json(ws,{defval:''});
        if(!rows.length){toast('الملف فارغ أو بلا صفوف.');return;}
        parseAndPreview(col,rows);
      }catch(err){
        toast('تعذّر قراءة الملف: '+(err.message||''));
      }
    };
    reader.onerror=function(){toast('تعذّر فتح الملف.');};
    reader.readAsArrayBuffer(f);
  });
  document.body.appendChild(input);
  input.click();
  setTimeout(function(){input.remove();},60000);
}
/* ============================================================
   تحليل الملف وبناء المعاينة
   ============================================================ */
function parseAndPreview(col,rows){
  var def=IMP_DEFS[col];
  var headersRaw=Object.keys(rows[0]||{});
  var mapped={};
  headersRaw.forEach(function(h){
    var clean=String(h).trim().replace(/^\uFEFF/,'');
    if(def.fieldMap[clean])mapped[def.fieldMap[clean]]=h;
  });
  if(!mapped.name){
    toast('عمود «الاسم» مفقود. تأكد أن الصف الأول يحتوي عنوان «الاسم».');
    return;
  }
  var existingNames={};
  S[col].forEach(function(x){
    var k=String(x.name||'').trim().toLowerCase();
    if(k)existingNames[k]=true;
  });
  var parsed=[],errors=[],dupes=0;
  rows.forEach(function(raw,i){
    var r={};
    Object.keys(mapped).forEach(function(k){r[k]=raw[mapped[k]];});
    var nameKey=String(r.name||'').trim().toLowerCase();
    if(nameKey&&existingNames[nameKey]){dupes++;return;}
    if(nameKey)existingNames[nameKey]=true;
    var res=def.build(r);
    if(res.err)errors.push({row:i+2,name:r.name||'',err:res.err});
    else parsed.push({row:i+2,data:res.ok});
  });
  S.ui.__imp={
    col:col,
    parsed:parsed,
    errors:errors,
    dupes:dupes,
    total:rows.length
  };
  showPreview(col);
}

/* ============================================================
   تنزيل نموذج Excel
   ============================================================ */
function template(col){
  if(typeof XLSX==='undefined'){toast('مكتبة Excel غير محمّلة.');return;}
  var def=IMP_DEFS[col];
  var wb=XLSX.utils.book_new();
  wb.Workbook={Views:[{RTL:true}]};
  var ws=XLSX.utils.aoa_to_sheet([def.headers,def.sample]);
  ws['!cols']=def.headers.map(function(h){return {wch:Math.max(14,String(h).length+4)};});
  XLSX.utils.book_append_sheet(wb,ws,def.label);
  var out=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  var blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='نموذج-استيراد-'+def.label+'.xlsx';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
  toast('تم تنزيل النموذج');
}

function payForm(eid,pid){
  if(S.settings.hideFinance)return;
  var p=pid?S.payments.find(function(x){return x.id===pid;}):null;
  var Y=curYear();
  var ens=S.enrollments.filter(function(e){
    return e.year===Y||e.id===eid||(p&&e.id===p.enrollmentId);
  }).filter(function(e){return e.status!=='منسحب';})
    .sort(function(a,b){return sName(a.studentId)<sName(b.studentId)?-1:1;});
  if(!ens.length){
    toast('لا توجد تسجيلات نشطة في هذه السنة.');
    return;
  }
  var cur=p?p.enrollmentId:(eid||'');
  var v=p?Object.assign({},p):{
    enrollmentId:cur,
    date:today(),
    method:'نقداً',
    receiptNo:nextReceipt()
  };
  function room(id){
    if(!id)return '';
    var e=D.eMap[id];
    if(!e)return '';
    var r=bal(id)+(p&&p.enrollmentId===id?num(p.amount):0);
    return 'المتبقي على هذا الطالب: '+fmt(Math.max(0,r))+' '+S.settings.currency;
  }
  M.push({
    title:p?'تعديل الدفعة':'تسجيل دفعة',
    values:v,
    fields:[
      {k:'enrollmentId',l:'الطالب',t:'select',req:1,full:1,
        o:[['','اختر الطالب…']].concat(ens.map(function(e){
          return [e.id,enLabel(e)];
        }))},
      {k:'amount',l:'المبلغ ('+S.settings.currency+')',t:'number',req:1,hint:room(cur)},
      {k:'date',l:'تاريخ الدفعة',t:'date',req:1},
      {k:'method',l:'طريقة الدفع',t:'select',o:METHODS},
      {k:'receiptNo',l:'رقم السند',t:'number'},
      {k:'note',l:'ملاحظة',full:1}
    ],
    onInput:function(form){
      var hEl=$('#h_amount');
      if(hEl)hEl.textContent=room(form.elements.enrollmentId.value);
    },
    submit:function(x){
      if(!x.enrollmentId)return 'اختر الطالب.';
      x.amount=num(x.amount);
      if(x.amount<=0)return 'أدخل مبلغاً أكبر من صفر.';
      if(!x.date)return 'حدّد تاريخ الدفعة.';
      var r=bal(x.enrollmentId)+(p&&p.enrollmentId===x.enrollmentId?num(p.amount):0);
      if(x.amount>r){
        return 'المبلغ أكبر من المتبقي ('+fmt(Math.max(0,r))+' '+S.settings.currency+'). أضف رسماً أولاً إن كانت هناك رسوم جديدة.';
      }
      x.receiptNo=num(x.receiptNo)||nextReceipt();
      return Data.put('payments',p?p.id:uid(),Object.assign({},p||{},x))
        .then(function(){toast(p?'تم التحديث':'تم تسجيل الدفعة، سند رقم '+x.receiptNo);});
    }
  });
}

   بلاغ تلقائي للدعم: يظهر الزر فقط عند حدوث مشكلة
